name: Slice 0 development checks
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slice0
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: intibelajar_slice0_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slice0 -d intibelajar_slice0_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://slice0:synthetic-ci-only@127.0.0.1:5432/intibelajar_slice0_test
      APP_ORIGIN: http://localhost:5173
      APP_KEY: 9e624b5894764717ba9a9a771bff96377647e2d18776112ba1ea909ce9b69994
      SYNTHETIC_FIXTURES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p .local && npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:contract
      - run: npm test
      - run: pip install PyYAML==6.0.3
      - run: python docs/backend-architecture/validate-spec.py --self-test
      # Consumer checks use the separate frontend checkout; run `npm run verify:frontend`
      # with FRONTEND_DIR set in the coordinating repository's CI job.
