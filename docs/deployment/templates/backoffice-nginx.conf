# Include INSIDE the existing HTTPS server block for intibelajar.com.
# Requires TLS and /etc/nginx/intibelajar-backoffice.htpasswd before nginx -t.
location = /backoffice {
    return 301 /backoffice/;
}
location ^~ /backoffice/ {
    # Fail closed if this snippet is accidentally placed in a plaintext server block.
    if ($scheme != https) { return 403; }
    auth_basic "IntiBelajar Backoffice";
    auth_basic_user_file /etc/nginx/intibelajar-backoffice.htpasswd;
    client_max_body_size 32k;
    access_log off;

    # Trailing slash strips /backoffice/ before forwarding to the private process.
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite user-supplied headers; only Nginx's authenticated identity is accepted.
    proxy_set_header X-Backoffice-User $remote_user;
    proxy_set_header X-Forwarded-For $remote_addr;
}
