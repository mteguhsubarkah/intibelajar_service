          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversation'
        '201':
          description: Conversation opened. The first message discloses that IntiBot is an AI.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tutor-conversations/{conversationId}:
    get:
      operationId: getTutorConversation
      tags: [tutor]
      summary: A conversation with its messages.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tutor-conversations/{conversationId}/messages:
    post:
      operationId: sendTutorMessage
      tags: [tutor]
      summary: Send a message. The reply is produced asynchronously (202 + polling).
      description: |
        `requestFullSolution: true` passes the solution-review gate only when the server's
        hint count is at least 2; it records FULL_SOLUTION_SHOWN. The client's hint count is
        never trusted.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorMessageRequest'
      responses:
        '202':
          description: Learner message stored; tutor reply pending.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorMessageAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/tutor-messages/{messageId}:
    get:
      operationId: getTutorMessage
      tags: [tutor]
      summary: Poll a tutor reply.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Message.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorMessage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

