      properties:
        type:
          type: string
          enum: [heading, text, math, figure, worked_example, tip]
        slide:
          type: integer
          minimum: 0
        text:
          type: string
          maxLength: 4000
        latex:
          type: string
          maxLength: 1000
        name:
          type: string
          maxLength: 120
        expression:
          type: string
          maxLength: 400
