components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ib_session
      description: Opaque 256-bit session token. Secure, HttpOnly, SameSite=Lax.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token from GET /v1/auth/session, required on authenticated mutations.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One key per user intent. Scoped to principal and operation, kept 7 days.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, signed and bound to the query. Expires after 24 hours.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google]
    ConsentToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{32,128}$'
    Purpose:
      name: purpose
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConsentPurpose'
    LearnerId:
      name: learnerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DiagnosisRunId:
      name: diagnosisRunId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LegacyDiagnosisRunId:
      name: diagnosisRunId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConceptId:
      name: conceptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'

  headers:
    RetryAfter:
      description: Seconds to wait before polling or retrying.
      schema:
        type: integer
        minimum: 0
        maximum: 3600
    Location:
      description: URL of the created or next resource.
      schema:
        type: string
        format: uri-reference
    IdempotencyReplayed:
      description: Present and true when the response is a stored replay.
      schema:
        type: boolean
    Deprecation:
      description: Marks a deprecated facade operation.
      schema:
        type: string
    Sunset:
      description: Planned removal date of a deprecated operation.
      schema:
        type: string
    ETag:
      description: Release version of the catalog.
      schema:
        type: string
    NoStore:
      description: Learner data is never cached.
      schema:
        type: string
        const: no-store
    PublicCache:
      description: Catalog caching policy.
      schema:
        type: string
    SetSessionCookie:
      description: The rotated `__Host-ib_session` cookie.
      schema:
        type: string

  responses:
    BadRequest:
      description: VALIDATION_FAILED or INVALID_CURSOR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: CSRF_FAILED, CONSENT_REQUIRED, ACCOUNT_UNAVAILABLE, FEATURE_DISABLED, SOLUTION_LOCKED or FORBIDDEN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            consentRequired:
              value:
                code: CONSENT_REQUIRED
                message: Minta izin orang tua dulu supaya progresmu bisa disimpan.
                requestId: 0192f6d1-6c1e-7b9a-9f1e-3c1d2b4a5e6f
                retryable: false
                details:
                  missingPurposes: [LEARNING_DATA]
    NotFound:
      description: NOT_FOUND. Also returned for resources owned by someone else.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: INVALID_STATE_TRANSITION, STALE_STATE_VERSION, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, CONTENT_UNAVAILABLE, ALREADY_IMPORTED or ALREADY_REPORTED.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            staleVersion:
              value:
                code: STALE_STATE_VERSION
                message: Sesi ini sudah berubah di tab lain. Muat ulang untuk melanjutkan.
                requestId: 0192f6d1-6c1e-7b9a-9f1e-3c1d2b4a5e70
                retryable: false
                details:
                  currentStateVersion: 5
    Gone:
      description: SESSION_EXPIRED or LINK_EXPIRED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: RATE_LIMITED or AI_BUDGET_EXCEEDED.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: DEPENDENCY_UNAVAILABLE.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  examples:
    AttemptResultTower:
      summary: Tower question, wrong ratio, diagnosed inline.
      value:
        attempt:
          id: 0192f6c4-8a1b-7c3d-9e4f-5a6b7c8d9e01
          sessionId: 0192f6c4-8a1b-7c3d-9e4f-5a6b7c8d9e00
          questionRevisionId: 0192f6b0-1111-7222-8333-944455556666
          kind: INITIAL
          ordinal: 1
          response:
            responseType: TEXT
            text: 'sin 30 = 20/x'
            inputMode: TYPED
            purged: false
          assistance: NONE
          verdict: INCORRECT
          source: LIVE
          submittedAt: '2026-10-17T03:15:20Z'
          gradedAt: '2026-10-17T03:15:20Z'
        diagnosisRun:
          id: 0192f6c4-8a1b-7c3d-9e4f-5a6b7c8d9e02
          attemptId: 0192f6c4-8a1b-7c3d-9e4f-5a6b7c8d9e01
          sessionId: 0192f6c4-8a1b-7c3d-9e4f-5a6b7c8d9e00
          generation: 1
          purpose: DIAGNOSIS
          engine: DETERMINISTIC
          status: COMPLETED
          evidenceStatus: SUPPORTED
          verdict: INCORRECT
          headline: 'Hampir! Meleset sedikit di 1 inti.'
          lede: 'Pilihan perbandingannya yang meleset.'
          evidence:
            - conceptId: 0192f6a0-2222-7333-8444-955566667777
              conceptCode: MAT.TRI.RATIO_DEF
              legacyMapId: tri-d
              conceptTitle: 'Definisi sin, cos, tan'
              classification: MISCONCEPTION_EVIDENCED
              misconception:
                code: RATIO_CHOICE
