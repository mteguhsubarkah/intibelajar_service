      properties:
        text:
          type: string
        quick:
          type: array
          items:
            type: string
        hintsUsed:
          type: integer
          minimum: 0
        rewrite:
          type: boolean
    LegacyIntakeReadRequest:
      allOf:
        - $ref: '#/components/schemas/LegacyFlowContext'
        - type: object
          required: [imageDataUrl]
          properties:
            imageDataUrl:
              type: string
              maxLength: 8000000
    LegacyIntakeRead:
      type: object
      description: Reference only. L7 is not served by the facade.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        demo:
          type: boolean
    LegacyIntakeMapRequest:
