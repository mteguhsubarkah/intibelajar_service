  /v1/learning-sessions/{sessionId}/attempts:
    post:
      operationId: submitAttempt
      tags: [learning, diagnosis]
      summary: Submit an answer (E-03, E-04, E-16, E-22). The server derives the attempt kind from the state.
      description: |
        Returns `201` with the stored attempt, its diagnosis run and the new session state.
        Deterministic evaluation finishes inline, so the run is often already `COMPLETED`.
        Otherwise the run is `QUEUED` and `Retry-After` says when to poll
        `GET /v1/diagnosis-runs/{diagnosisRunId}`. The `Idempotency-Key` doubles as the
        blueprint's `clientAttemptId`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAttemptRequest'
            examples:
              towerFirstAttempt:
                value:
                  expectedStateVersion: 1
                  response:
                    responseType: TEXT
                    text: 'sin 30 = 20/x'
      responses:
        '201':
          description: Attempt stored.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
              examples:
                inlineDiagnosis:
                  $ref: '#/components/examples/AttemptResultTower'
