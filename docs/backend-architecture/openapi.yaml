      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [title, body]
            properties:
              title:
                type: string
              body:
                type: string
        after:
          type: array
          items:
            type: string
    LegacyTutorRequest:
      allOf:
        - $ref: '#/components/schemas/LegacyFlowContext'
