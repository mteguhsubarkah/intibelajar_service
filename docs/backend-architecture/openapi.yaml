    LegacyFlowContext:
      type: object
      description: Spread into every legacy request body by the shipped adapters. Client-asserted; never authority.
      required: [sessionId, questionId, topicId, hintOpened]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 64
        questionId:
          type: string
          minLength: 1
          maxLength: 128
        topicId:
          type: [string, 'null']
          maxLength: 64
        hintOpened:
          type: boolean
        diagnosisRunId:
          type: [string, 'null']
          maxLength: 80
        questionText:
          type: string
          maxLength: 2000
        coreIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
    LegacyDiagnosisRequest:
      allOf:
        - $ref: '#/components/schemas/LegacyFlowContext'
        - type: object
          required: [responseMode, rawText]
          properties:
            responseMode:
              type: [string, 'null']
              enum: [know, blank, null]
            rawText:
              type: string
              maxLength: 2000
    LegacyGap:
      type: object
      required: [label, name, reason, coreId, mapId]
      properties:
        label:
          type: string
        name:
          type: string
        reason:
          type: string
        coreId:
          type: string
        mapId:
          type: string
    LegacyNext:
      type: object
      required: [core, reason, formula, coreId, mapId]
      properties:
        core:
          type: string
        reason:
          type: string
        formula:
          type: string
        coreId:
          type: string
        mapId:
          type: string
    LegacyAnalysis:
      type: object
      required: [tone, title, gap, okName, next]
      properties:
        tone:
          type: string
          enum: [gap, kuat]
        title:
          type: string
        gap:
          oneOf:
            - $ref: '#/components/schemas/LegacyGap'
            - type: 'null'
        okName:
          type: [string, 'null']
        next:
          $ref: '#/components/schemas/LegacyNext'
      allOf:
        - if:
            required: [tone]
            properties:
              tone:
                const: kuat
          then:
            properties:
              gap:
                type: 'null'
          else:
            properties:
              gap:
                type: object
    LegacyCoreReason:
      type: object
      required: [id, state, reason]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [ok, gap, rest]
        reason:
          type: string
    LegacyDiagnosisRun:
      type: object
      description: The shape `diagnosisRunWithBackend` validates (isRun). Frozen.
      required: [diagnosisRunId, status]
      properties:
        claimToken: {type: string, maxLength: 6000}
        diagnosisRunId:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum: [pending, running, completed, insufficient_evidence, failed]
        assessment:
          $ref: '#/components/schemas/LegacyAnalysis'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LegacyCoreReason'
        clarification:
          type: string
      allOf:
        - if:
            required: [status]
            properties:
              status:
                const: completed
          then:
            required: [assessment, items]
    LegacyCheckRequest:
      allOf:
        - $ref: '#/components/schemas/LegacyFlowContext'
        - type: object
          required: [attemptId, kind, itemId, answer]
          properties:
            attemptId:
              type: string
              maxLength: 80
              description: Regenerated by the client on every call; ignored for deduplication.
            kind:
              type: string
              enum: [check, practice, retry_original]
            itemId:
              type: string
              minLength: 1
              maxLength: 128
            answer:
              type: [string, number]
              maxLength: 2000
    LegacyCheckResult:
      type: object
      description: The shape `checkWithBackend` validates (isCheck). Frozen.
      required: [correct]
      properties:
        claimToken: {type: string, maxLength: 6000}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, state, reason]
            properties:
              id: {type: string}
              state: {type: string, enum: [ok, gap, rest]}
              reason: {type: string}
        correct:
          type: [boolean, 'null']
        feedback:
          type: string
        correctOptionIndex:
          type: integer
          minimum: 0
        unreadable:
          type: boolean
    LegacySolutionRequest:
      allOf:
        - $ref: '#/components/schemas/LegacyFlowContext'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [requested, review_steps, max_tries, compare]
