          type: string
          enum: [CONCEPT_LESSON, COMBINED_SET, BANK]
        withLesson:
          type: boolean
        spec:
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          description: Exactly one of conceptId, setCode or questionIds. The server chooses and orders the items.
