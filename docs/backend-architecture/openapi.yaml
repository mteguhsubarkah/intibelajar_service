        propertyName: kind
        mapping:
          QUESTION_LOOP: '#/components/schemas/CreateQuestionLoopRequest'
          PRACTICE: '#/components/schemas/CreatePracticeRequest'
    CreateQuestionLoopRequest:
      type: object
      additionalProperties: false
      required: [kind, origin, questionId]
      properties:
        kind:
          type: string
          const: QUESTION_LOOP
        origin:
          type: string
          enum: [FUNNEL, BANK, CHALLENGE, INTAKE]
        questionId:
          $ref: '#/components/schemas/Uuid'
    CreatePracticeRequest:
      type: object
      additionalProperties: false
      required: [kind, origin, spec, withLesson]
