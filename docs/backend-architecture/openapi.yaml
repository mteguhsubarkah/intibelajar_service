  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      description: Server-generated UUIDv7.
    Timestamp:
      type: string
      format: date-time
    LocalDate:
      type: string
      format: date

    # ----------------------------------------------------------------- enums
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - INVALID_CURSOR
        - UNAUTHENTICATED
        - CSRF_FAILED
        - CONSENT_REQUIRED
        - ACCOUNT_UNAVAILABLE
        - FEATURE_DISABLED
        - SOLUTION_LOCKED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATE_TRANSITION
        - STALE_STATE_VERSION
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - CONTENT_UNAVAILABLE
        - ALREADY_IMPORTED
        - ALREADY_REPORTED
        - SESSION_EXPIRED
        - LINK_EXPIRED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - AI_BUDGET_EXCEEDED
        - INTERNAL
        - DEPENDENCY_UNAVAILABLE
    LearnerStatus:
      type: string
      enum: [PENDING_CONSENT, ACTIVE, SUSPENDED, DELETION_PENDING]
    AgeBand:
      type: string
      enum: [UNDER_13, AGE_13_15, AGE_16_17, ADULT, UNKNOWN]
    AgeBandSource:
      type: string
      enum: [SELF_DECLARED, GUARDIAN_CONFIRMED, VERIFIED]
    ConsentPurpose:
      type: string
      enum: [LEARNING_DATA, AI_PROCESSING, IMAGE_UPLOAD, PRODUCT_ANALYTICS]
    ConsentStatus:
      type: string
      enum: [PENDING, GRANTED, DECLINED, EXPIRED, REVOKED]
    ConsentMethod:
      type: string
      enum: [GUARDIAN_EMAIL, GUARDIAN_SIGNIN, SELF_WITH_GUARDIAN_NOTICE, SELF_DECLARED]
    SessionKind:
      type: string
      enum: [QUESTION_LOOP, PRACTICE]
    SessionOrigin:
      type: string
      enum: [FUNNEL, BANK, CHALLENGE, CONCEPT_LESSON, COMBINED_SET, INTAKE, DEVICE_IMPORT]
    SessionState:
      type: string
      enum:
        - QUESTION
        - DIAGNOSING
        - CLARIFICATION_NEEDED
        - DIAGNOSIS_READY
        - MICROLEARNING
        - QUICK_CHECK
        - RETRY
        - VERIFYING
        - EVALUATION_FAILED
        - PRACTICING
        - COMPLETED
        - ABANDONED
        - EXPIRED
    SessionOutcome:
      type: string
      enum: [SOLVED_FIRST_TRY, SOLVED_AFTER_LEARNING, SOLUTION_REVIEWED, PRACTICE_FINISHED]
    ResumeState:
      type: string
      enum: [DIAGNOSING, VERIFYING]
    AllowedAction:
      type: string
      enum:
        - SUBMIT_ATTEMPT
        - ANSWER_QUICK_CHECK
        - START_LESSON
        - ADVANCE_LESSON
        - FINISH_LESSON
        - SKIP_LESSON
        - START_RETRY
        - SKIP_ITEM
        - REVIEW_SOLUTION
        - REQUEST_HINT
        - REQUEST_DIAGNOSIS
        - ABANDON
        - UPDATE_CHECKPOINT
    AttemptKind:
      type: string
      enum: [INITIAL, CLARIFICATION, QUICK_CHECK, RETRY, PRACTICE, TRANSFER]
    Assistance:
      type: string
      enum: [NONE, HINT, LESSON, TUTOR, SOLUTION]
    Verdict:
      type: string
      enum: [PENDING, CORRECT, INCORRECT, UNREADABLE, NOT_GRADED]
    FinalVerdict:
      type: string
      enum: [CORRECT, INCORRECT, UNREADABLE, NOT_GRADED]
    AttemptSource:
      type: string
      enum: [LIVE, DEVICE_IMPORT]
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]
    EvidenceStatus:
      type: string
      enum: [SUPPORTED, INSUFFICIENT_EVIDENCE]
    RunPurpose:
      type: string
      enum: [DIAGNOSIS, VERIFICATION, GRADING]
    Engine:
      type: string
      enum: [DETERMINISTIC, AI_ASSISTED, EDUCATOR]
    FailureCode:
      type: string
      x-extensible-enum: true
      enum: [DEADLINE_EXCEEDED, DEPENDENCY_UNAVAILABLE, INVALID_OUTPUT, PROVIDER_REFUSED, CONSENT_REVOKED, AI_BUDGET_EXCEEDED, INTERNAL]
    Classification:
      type: string
      enum: [UNDERSTANDING_DEMONSTRATED, MISCONCEPTION_EVIDENCED, INSUFFICIENT_EVIDENCE, NOT_ASSESSED]
    EvidenceSource:
      type: string
      enum: [DETERMINISTIC, AI, EDUCATOR]
    UncertaintyReason:
      type: string
      enum: [AMBIGUOUS_NOTATION, INCOMPLETE_WORK, ALTERNATIVE_PATH, LOW_CONFIDENCE, UNREADABLE_INPUT, OUT_OF_SCOPE]
    EligibilityReason:
      type: string
      enum:
        - NOT_A_CLAIM
        - AI_ONLY
        - DEVICE_IMPORT
        - FORMATIVE_CHECK
        - SOLUTION_SEEN
        - NOT_ASSESSABLE
        - SUPERSEDED
        - ANCHOR_OR_RETRY
        - NOT_TRANSFER_ITEM
        - HINT_USED
        - FAMILY_NOT_FRESH
    ItemType:
      type: string
      enum: [FREE_RESPONSE, MULTIPLE_CHOICE, NUMERIC]
    QuestionVisibility:
      type: string
      enum: [PUBLIC_PRACTICE, CATALOG, PRIVATE]
    Phase:
      type: string
      enum: [D, E, F, F+]
    LessonAssignmentStatus:
      type: string
      enum: [ASSIGNED, IN_PROGRESS, CHECKS_PENDING, COMPLETED, SKIPPED]
    SessionItemStatus:
      type: string
      enum: [PENDING, ANSWERED, SKIPPED]
    RecommendationAction:
      type: string
      enum: [LEARN, PRACTICE, RETRY]
    MasteryStatus:
      type: string
      enum: [NOT_ASSESSED, DEVELOPING, DEMONSTRATED]
    Exploration:
      type: string
      enum: [UNVISITED, VISITED]
    NeedsReviewReason:
      type: string
      enum: [CONTRADICTION, STALE_14D]
    ProgressEventType:
      type: string
      x-extensible-enum: true
      enum:
        - CONCEPT_VISITED
        - ATTEMPT_GRADED
        - LESSON_COMPLETED
        - SESSION_COMPLETED
        - MASTERY_CHANGED
        - TIER_CHANGED
        - XP_AWARDED
        - STREAK_EXTENDED
        - STREAK_FREEZE_USED
        - MISSION_COMPLETED
        - DEVICE_HISTORY_IMPORTED
    TutorRole:
      type: string
      enum: [LEARNER, TUTOR]
    TutorMessageStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, BLOCKED]
    TutorIntent:
      type: string
      enum: [QUESTION, SOCRATIC_PROMPT, HINT, SOLUTION_REVIEW, REDIRECT, REFUSAL]
    IntakeStatus:
      type: string
      enum: [RECEIVED, READING, READ, CONFIRMED, DISCARDED, FAILED, EXPIRED]
    IntakeInputMode:
      type: string
      enum: [PHOTO, TYPED]
    ReportReason:
      type: string
      enum: [ANSWER_WAS_CORRECT, WRONG_CONCEPT, UNCLEAR_EXPLANATION, OTHER]
    ReportStatus:
      type: string
      enum: [OPEN, UPHELD, REJECTED]

    # ---------------------------------------------------------------- errors
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 300
          description: Safe to show (Indonesian). Never echoes input.
        requestId:
          $ref: '#/components/schemas/Uuid'
        retryable:
          type: boolean
        details:
          type: object
          description: Code-specific, machine-readable fields such as currentStateVersion, missingPurposes, allowedActions or fields.

    # ------------------------------------------------------------------ auth
    AuthSession:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type: string
          minLength: 16
          maxLength: 128
          description: Present for signed-in users. Send it as X-CSRF-Token on mutations.
        guest:
          type: boolean
          description: True for a /coba trial account (FEATURE_GUEST_TRIAL). Absent for real accounts.
        user:
          type: object
          additionalProperties: false
          required: [id, role]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            role:
              type: string
              enum: [STUDENT, GUARDIAN]
        learner:
          type: object
          additionalProperties: false
          required: [id, status, missingPurposes]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/LearnerStatus'
            ageBand:
              $ref: '#/components/schemas/AgeBand'
            missingPurposes:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ConsentPurpose'
            consentDeadlineAt:
              $ref: '#/components/schemas/Timestamp'
    LegacyContinuation:
      type: object
      required: [step, targetPath]
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 50
        targetPath:
          type: string
          maxLength: 200
          description: Must be an allow-listed app route, otherwise 400.
    StartAuthRequest:
      type: object
      description: Legacy-compatible (L5). The spread FlowContext fields are accepted as continuation hints; unknown fields are ignored.
      required: [provider, continuation]
      properties:
        provider:
          type: string
          enum: [google, email]
        continuation:
          $ref: '#/components/schemas/LegacyContinuation'
        sessionId:
          type: string
          maxLength: 64
        questionId:
          type: string
          maxLength: 128
        topicId:
          type: [string, 'null']
          maxLength: 64
        hintOpened:
          type: boolean
        diagnosisRunId:
          type: [string, 'null']
          maxLength: 80
        questionText:
          type: string
          maxLength: 2000
        coreIds:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
    StartAuthResponse:
      type: object
      additionalProperties: false
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
          format: uri
          description: https (or http on localhost in development).
    EmailLinkRequest:
      type: object
      additionalProperties: false
      required: [email, transaction]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        transaction:
          type: string
          minLength: 16
          maxLength: 128
    EmailLinkAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    EmailVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
    EmailVerifyResult:
      type: object
      additionalProperties: false
      required: [continuation]
      properties:
        continuation:
          $ref: '#/components/schemas/Continuation'
    Continuation:
      type: object
      additionalProperties: false
      required: [route]
      description: An allow-listed app route plus optional resume hints. Never an arbitrary URL.
      properties:
        route:
          type: string
          pattern: '^/(|coba|soal-tadi|kenalan|tanya|challenge|latihan/soal|home|pick|latihan|progress|profile|diagnosis|mastery)$|^/core/[a-z0-9-]{1,64}$'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        step:
          type: integer
          minimum: 0
          maximum: 50
        lessonStep:
          type: integer
          minimum: 0
          maximum: 50

    # -------------------------------------------------------- me and consent
    Profile:
      type: object
      additionalProperties: false
      required: [learnerId, status, ageBand, ageBandSource, timezone, preferredSubjectCodes]
      properties:
        learnerId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/LearnerStatus'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        ageBandSource:
          $ref: '#/components/schemas/AgeBandSource'
        displayName:
          type: string
          maxLength: 40
        grade:
          type: integer
          minimum: 7
          maximum: 12
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
        preferredSubjectCodes:
          type: array
          maxItems: 6
          items:
            type: string
            maxLength: 16
        consentDeadlineAt:
          $ref: '#/components/schemas/Timestamp'
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        grade:
          type: integer
          minimum: 7
          maximum: 12
        birthYear:
          type: integer
          minimum: 1990
          maximum: 2030
          writeOnly: true
          description: Used once to derive the age band. Not stored.
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
        preferredSubjectCodes:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            maxLength: 16
    ConsentStatusItem:
      type: object
      additionalProperties: false
      required: [purpose, status]
      properties:
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        status:
          anyOf:
            - $ref: '#/components/schemas/ConsentStatus'
            - type: string
              const: NOT_REQUESTED
        method:
          $ref: '#/components/schemas/ConsentMethod'
        policyVersion:
          type: string
          maxLength: 32
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    ConsentStatusList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentStatusItem'
    ConsentRequestCreate:
      type: object
      additionalProperties: false
      required: [guardianEmail, purposes]
      properties:
        guardianEmail:
          type: string
          format: email
          maxLength: 254
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConsentPurpose'
    ConsentRequestResult:
      type: object
      additionalProperties: false
      required: [purposes, linkExpiresAt]
      properties:
        purposes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentStatusItem'
        linkExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    GuardianConsentView:
      type: object
      additionalProperties: false
      required: [learner, purposes, policyVersion, policyText, policyTextSha256, expiresAt]
      properties:
        learner:
          type: object
          additionalProperties: false
          properties:
            displayName:
              type: string
              maxLength: 40
            grade:
              type: integer
              minimum: 7
              maximum: 12
        purposes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purpose, title, description]
            properties:
              purpose:
                $ref: '#/components/schemas/ConsentPurpose'
              title:
                type: string
                maxLength: 120
              description:
                type: string
                maxLength: 2000
        policyVersion:
          type: string
          maxLength: 32
        policyText:
          type: string
          maxLength: 20000
        policyTextSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        aiProviderDisclosure:
          type: string
          maxLength: 1000
          description: Names the AI provider and the transfer abroad (UU 27/2022 Pasal 56).
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    GuardianConsentDecision:
      type: object
      additionalProperties: false
      required: [decisions, policyVersion, policyTextSha256, attestation]
      properties:
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [purpose, granted]
            properties:
              purpose:
                $ref: '#/components/schemas/ConsentPurpose'
              granted:
                type: boolean
        policyVersion:
          type: string
          maxLength: 32
        policyTextSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        attestation:
          type: boolean
          const: true
          description: The decider confirms being the learner's parent or guardian.
    GuardianConsentResult:
      type: object
      additionalProperties: false
      required: [learnerStatus, decisions]
      properties:
        learnerStatus:
          $ref: '#/components/schemas/LearnerStatus'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ConsentStatusItem'
    GuardianLearner:
      type: object
      additionalProperties: false
      required: [learnerId, status, consents]
      properties:
        learnerId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          maxLength: 40
        grade:
          type: integer
          minimum: 7
          maximum: 12
        status:
          $ref: '#/components/schemas/LearnerStatus'
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentStatusItem'
    GuardianLearnerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GuardianLearner'
    DeletionAccepted:
      type: object
      additionalProperties: false
      required: [status, requestedAt, completesBy]
      properties:
        status:
          type: string
          const: DELETION_PENDING
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        completesBy:
          $ref: '#/components/schemas/Timestamp'
    DeviceImportRequest:
      type: object
      additionalProperties: false
      required: [deviceSessionId, questionAlias, furthestStep, includeAnswerText]
      properties:
        deviceSessionId:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        questionAlias:
          type: string
          minLength: 1
          maxLength: 128
          description: The question's legacy item ID, resolved through the alias manifest.
        furthestStep:
          type: string
          enum: [QUESTION, DIAGNOSIS_SEEN, LESSON_FINISHED, COMPLETED]
        lessonStep:
          type: integer
          minimum: 0
          maximum: 50
        includeAnswerText:
          type: boolean
        answerText:
          type: string
          maxLength: 2000
          description: Sent only when the learner ticks "sertakan jawabanku".
        deviceStartedAt:
          $ref: '#/components/schemas/Timestamp'
    DeviceImportResult:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/LearningSession'

    # --------------------------------------------------------------- catalog
    Subject:
      type: object
      additionalProperties: false
      required: [id, code, title, availability]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 16
        title:
          type: string
          maxLength: 80
        availability:
          type: string
          enum: [AVAILABLE, COMING_SOON]
    SubjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
    Topic:
      type: object
      additionalProperties: false
      required: [id, subjectId, code, title, phase, availability]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subjectId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 32
        legacyId:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 120
        subtitle:
          type: string
          maxLength: 200
        phase:
          $ref: '#/components/schemas/Phase'
        availability:
          type: string
          enum: [MAPPED, PLANNED]
    TopicList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
    TopicDetail:
      type: object
      additionalProperties: false
      required: [id, subjectId, code, title, phase, availability, units, concepts, prerequisiteEdges, relations]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subjectId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 32
        legacyId:
          type: string
          maxLength: 64
        title:
