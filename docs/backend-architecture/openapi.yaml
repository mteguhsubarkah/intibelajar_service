openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: IntiBelajar API
  version: 1.0.0-draft.1
  summary: Accounts, consent, catalog, learning sessions, diagnosis, mastery and tutoring for IntiBelajar.
  description: |
    Hand-maintained contract of the Backend Architecture Specification v1
    (`docs/backend-architecture`). **Status: proposed. No server implements it yet.**

    Rules that apply to every operation (details in `09-api-design.md`):

    - Authentication uses the `__Host-ib_session` cookie. Every authenticated
      mutation also sends `X-CSRF-Token` (from `GET /v1/auth/session`).
    - Every authenticated `POST` command sends an `Idempotency-Key`. A replay
      returns the stored status and body with `Idempotency-Replayed: true`.
    - Session commands send `expectedStateVersion`. The server owns state; the
      session representation lists `allowedActions`.
    - Errors use one envelope (`Error`). A resource owned by someone else is `404`.
    - Operations tagged `legacy` are the deprecated facade for the shipped
      frontend adapters. Their shapes are frozen.
servers:
  - url: /
    description: Same origin as the single-page app.
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Sign-in, session and CSRF token.
  - name: me
    description: The signed-in learner's profile, consents, imports and deletion.
  - name: guardian
    description: Guardian consent decisions and controls.
  - name: catalog
    description: Published curriculum content. Never contains answer keys or rubrics.
  - name: learning
    description: Authoritative learning sessions and their commands.
  - name: diagnosis
    description: Attempts, diagnosis runs and disputes.
  - name: progress
    description: Mastery, XP, streaks and activity.
  - name: tutor
    description: IntiBot, asynchronous. Requires AI_PROCESSING consent.
  - name: intake
    description: Own questions (photo or typed). Requires IMAGE_UPLOAD and AI_PROCESSING consent for photos.
  - name: public
    description: Stateless guest evaluation (OPEN_TRIAL mode only).
  - name: legacy
    description: Deprecated facade for the shipped frontend adapters (L1-L9).

paths:
  /v1/guide/messages:
    post:
      operationId: contextGuide
      summary: IntiGuide for the current question or published core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              additionalProperties: false
              properties:
                questionText:
                  type: string
                  maxLength: 2000
                answer:
                  type: string
                  maxLength: 2000
                coreAlias:
                  type: string
                  maxLength: 80
                messages:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: object
                    required:
                      - from
                      - text
                    additionalProperties: false
                    properties:
                      from:
                        type: string
                        enum:
                          - me
                          - bot
                      text:
                        type: string
                        minLength: 1
                        maxLength: 1000
      responses:
        "200":
          description: Tutor response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyTutorReply"
  /v1/trial/claim:
    post:
      operationId: claimTrial
      summary: Save a verified anonymous trial after onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proof
              additionalProperties: false
              properties:
                proof:
                  type: string
                  minLength: 1
                  maxLength: 6000
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                required:
                  - claimed
                  - sessionId
                properties:
                  claimed:
                    type: boolean
                  sessionId:
                    type: string
                    format: uuid
  /v1/trial/diagnosis:
    post:
      operationId: publicTriallegacyCreateDiagnosispost
      tags:
        - Public trial
      deprecated: false
      summary: "Anonymous public trial: diagnosis"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyDiagnosisRequest"
      responses:
        "200":
          description: The run in the legacy shape.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyDiagnosisRun"
              examples:
                completedGap:
                  $ref: "#/components/examples/LegacyDiagnosisRunExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Available before registration in development and pilot. Uses
        published public catalog and deterministic server evaluation.
        Browser-bound temporary results; no learner account, consent grants or
        durable progress. No local-response fallback. Same-origin/HTTPS checks
        still apply.
  /v1/trial/diagnosis/{diagnosisRunId}:
    get:
      operationId: publicTriallegacyGetDiagnosisget
      tags:
        - Public trial
      deprecated: false
      summary: "Anonymous public trial: diagnosis/{diagnosisRunId}"
      security: []
      parameters:
        - $ref: "#/components/parameters/LegacyDiagnosisRunId"
      responses:
        "200":
          description: The run.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyDiagnosisRun"
        "404":
          $ref: "#/components/responses/NotFound"
      description: Available before registration in development and pilot. Uses
        published public catalog and deterministic server evaluation.
        Browser-bound temporary results; no learner account, consent grants or
        durable progress. No local-response fallback. Same-origin/HTTPS checks
        still apply.
  /v1/trial/answers/check:
    post:
      operationId: publicTriallegacyCheckAnswerpost
      tags:
        - Public trial
      deprecated: false
      summary: "Anonymous public trial: answers/check"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyCheckRequest"
      responses:
        "200":
          description: Verdict in the legacy shape. `correct` is null when unreadable.
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: Available before registration in development and pilot. Uses
        published public catalog and deterministic server evaluation.
        Browser-bound temporary results; no learner account, consent grants or
        durable progress. No local-response fallback. Same-origin/HTTPS checks
        still apply.
  /v1/trial/solution:
    post:
      operationId: publicTriallegacyGetSolutionpost
      tags:
        - Public trial
      deprecated: false
      summary: "Anonymous public trial: solution"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacySolutionRequest"
      responses:
        "200":
          description: Solution in the legacy shape.
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: Available before registration in development and pilot. Uses
        published public catalog and deterministic server evaluation.
        Browser-bound temporary results; no learner account, consent grants or
        durable progress. No local-response fallback. Same-origin/HTTPS checks
        still apply.
  /v1/trial/tutor:
    post:
      operationId: publicTriallegacyTutorpost
      tags:
        - Public trial
      deprecated: false
      summary: "Anonymous public trial: tutor"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyTutorRequest"
      responses:
        "200":
          description: Reply in the legacy shape. `hintsUsed` is the server's count.
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyTutorReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: Available before registration in development and pilot. Uses
        published public catalog and deterministic server evaluation.
        Browser-bound temporary results; no learner account, consent grants or
        durable progress. No local-response fallback. Same-origin/HTTPS checks
        still apply.
  # ------------------------------------------------------------------ auth
  /v1/auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Current principal, learner status, missing consents and CSRF token.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Session state. `authenticated` is false for visitors.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                pendingConsent:
                  value:
                    authenticated: true
                    csrfToken: 'q1W8x2kP9mZ3bT6vN0rL4sYcH7dE5fGu'
                    user:
                      id: 0192f6a9-4444-7555-8666-977788880001
                      role: STUDENT
                    learner:
                      id: 0192f6a9-4444-7555-8666-977788889999
                      status: PENDING_CONSENT
                      ageBand: AGE_13_15
                      missingPurposes: [LEARNING_DATA]
                      consentDeadlineAt: '2026-10-24T03:00:00Z'
  /v1/auth/start:
    post:
      operationId: startAuth
      tags: [auth, legacy]
      summary: Start Google or email sign-in with a continuation (legacy-compatible, L5).
      description: |
        Creates a pre-auth session and an auth transaction (state, nonce, PKCE verifier,
        continuation). `continuation.targetPath` must be an allow-listed app route.
        For `email`, `redirectUrl` is the app's email page, which then calls
        `POST /v1/auth/email/links`.
      security:
        - {}
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAuthRequest'
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/callback/{provider}:
    get:
      operationId: completeOAuthCallback
      tags: [auth]
      summary: OIDC callback. Verifies the provider response, rotates the session, redirects to the continuation.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        # Additive compatibility review: Google may return these metadata parameters.
        # They are never identity/consent authority; only the verified ID token is.
        - name: scope
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: authuser
          in: query
          schema:
            type: string
            pattern: '^[0-9]{1,4}$'
        - name: prompt
          in: query
          schema:
            type: string
            maxLength: 256
        - name: hd
          in: query
          schema:
            type: string
            maxLength: 253
        - name: iss
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: error_description
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        '302':
          description: Redirect to the continuation route (or to onboarding for a new learner, or back with a cancelled flag).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/auth/email/links:
    post:
      operationId: sendEmailSignInLink
      tags: [auth]
      summary: Send a one-time sign-in link. The response never reveals whether the address is known.
      security:
        - {}
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLinkRequest'
      responses:
        '202':
          description: Accepted. A link is sent if the transaction is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailLinkAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailSignInLink
      tags: [auth]
      summary: Consume a sign-in link token (by POST, so mail scanners cannot consume it).
      security:
        - {}
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '200':
          description: Signed in. The session cookie is rotated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/guest:
    post:
      operationId: startGuestTrial
      tags: [auth]
      summary: Start a 24-hour trial account for a /coba visitor (FEATURE_GUEST_TRIAL).
      description: >
        Without a session, creates a trial learner (learning data, AI reading and photo purposes, 24 hours) and sets the
        session cookie, so /coba is graded by the server like any learner. With a session nothing is created. Trial
        accounts are erased when the trial ends. Off unless FEATURE_GUEST_TRIAL=true.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: The visitor now has a session; guest says whether it is a trial account.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [guest]
                properties:
                  guest:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke this session, or every session of the user.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [current, all]
            default: current
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  # -------------------------------------------------------------------- me
  /v1/me:
    delete:
      operationId: deleteMyAccount
      tags: [me]
      summary: Delete the account. Processing stops immediately; erasure completes within 7 days.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '202':
          description: Deletion accepted. All sessions are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/profile:
    get:
      operationId: getMyProfile
      tags: [me]
      summary: Read the learner profile.
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateMyProfile
      tags: [me]
      summary: Onboarding and profile edits. A birth year is turned into an age band and not stored.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/consents:
    get:
      operationId: listMyConsents
      tags: [me]
      summary: Consent status per purpose.
      responses:
        '200':
          description: One entry per purpose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/me/consent-requests:
    post:
      operationId: createConsentRequest
      tags: [me]
      summary: Ask a guardian for consent. Emails a one-time link valid for 7 days.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequestCreate'
      responses:
        '201':
          description: Requests created (one per purpose).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRequestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/consents/{purpose}/revocation:
    post:
      operationId: revokeMyConsent
      tags: [me]
      summary: Revoke an optional purpose (AI_PROCESSING, IMAGE_UPLOAD, PRODUCT_ANALYTICS). Use DELETE /v1/me for LEARNING_DATA.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revoked. Processing for the purpose stops immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/me/device-imports:
    post:
      operationId: importDeviceHistory
      tags: [me]
      summary: Import one device session. Imported history is never evidence, XP or mastery.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceImportRequest'
      responses:
        '201':
          description: Imported session, placed at the matching state and checkpoint.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # -------------------------------------------------------------- guardian
  /v1/guardian-consents/{token}:
    get:
      operationId: getGuardianConsentRequest
      tags: [guardian]
      summary: Show a consent request to the guardian (one-time link).
      security: []
      parameters:
        - $ref: '#/components/parameters/ConsentToken'
      responses:
        '200':
          description: The exact policy text and purposes being asked for.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianConsentView'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/guardian-consents/{token}/decision:
    post:
      operationId: decideGuardianConsent
      tags: [guardian]
      summary: Grant or decline each purpose. Declining LEARNING_DATA erases the pending account.
      security: []
      parameters:
        - $ref: '#/components/parameters/ConsentToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianConsentDecision'
      responses:
        '200':
          description: Decision recorded with the policy version and the hash of the text shown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianConsentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/guardian/learners:
    get:
      operationId: listGuardianLearners
      tags: [guardian]
      summary: Learners linked to the signed-in guardian, with consent status. Never answers or messages.
      responses:
        '200':
          description: Linked learners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianLearnerList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/guardian/learners/{learnerId}/consents/{purpose}/revocation:
    post:
      operationId: revokeConsentAsGuardian
      tags: [guardian]
      summary: Revoke a purpose for a linked learner. Revoking LEARNING_DATA starts erasure.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/LearnerId'
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianLearner'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/guardian/learners/{learnerId}/deletion-requests:
    post:
      operationId: requestDeletionAsGuardian
      tags: [guardian]
      summary: Request erasure of a linked learner's account.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
