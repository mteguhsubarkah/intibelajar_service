openapi: 3.1.0
info:
  title: IntiBelajar private catalog backoffice
  version: 0.1.0
  description: |
    Standalone loopback authoring server, accessed through SSH tunnel on port 8010
    or explicitly configured authenticated HTTPS reverse proxy under /backoffice/.
    Separate from canonical /v1. Draft JSON workspace; no publication endpoint. Learner accounts are reachable only through
    /api/accounts*, which exist only when the server runs with BACKOFFICE_ACCOUNTS=true (QA cleanup), and every view or
    deletion is written to audit_event as a STAFF actor.
    X-Backoffice-Key uses the local access-key file; Bearer Authorization remains supported locally.
    POST requires an exact configured Origin. Domain mode also requires same-host proxy HTTPS/user headers.
servers:
  - url: ./
security:
  - AccessKeyHeader: []
  - AccessKey: []
paths:
  /api/state:
    get:
      operationId: getDraftWorkspace
      summary: Topics, cores, lessons, practice summaries, relations, provenance, jobs and strict publication findings.
      responses:
        '200':
          description: Current workspace. Practice questions are summarised without answer keys or rubrics; previewUrl is the learner app page used for lesson preview.
          content:
            application/json:
              schema:
                type: object
                required: [revision, topics, lessons, topicRelations, subjects, sources, jobs, findings, audit]
                properties:
                  revision: {type: integer, minimum: 0}
                  topics: {type: array, items: {type: object}}
                  lessons: {type: array, items: {type: object}}
                  topicRelations: {type: object}
                  subjects: {type: object}
                  sources: {type: object}
                  jobs: {type: array, items: {type: object}}
                  findings: {type: array, items: {type: object}}
                  audit: {type: array, items: {type: object}}
                  practice:
                    type: array
                    description: Questions whose PRIMARY assessable concept is a core (core practice). No key, rubric or feedback.
                    items: {type: object}
                  previewUrl: {type: string, description: 'Learner app page /pratinjau/materi, rendered in an iframe and fed through postMessage.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/commands:
    post:
      operationId: saveDraftEntity
      summary: Upsert a topic, core, relation, prerequisite, lesson (text or blocks) or core practice question.
      description: |
        All changes reset review to PROPOSED and release sign-off to PENDING.
        Cycle, reference, schema and alias validation runs before atomic persistence.
        code identifies the entity; core.topic selects its topic; lesson.concepts is comma-separated.
        relation.code is the requiring/source topic, relation.to its target; prerequisite.code is the dependent core.
        lesson-blocks stores heading/text/math/tip/figure blocks (plain text, **bold** only) on contiguous slides;
        checks stay on their slides and a slide holding a check cannot be removed.
        question upserts a MULTIPLE_CHOICE (option-v1) or NUMERIC (numeric-v1) practice question with one PRIMARY concept;
        an empty code creates a new question and the response returns its generated code.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, kind]
              properties:
                revision: {type: integer, minimum: 0}
                kind: {enum: [topic, core, relation, prerequisite, lesson, lesson-blocks, question]}
                code: {type: string, maxLength: 120, description: Required except for a new question.}
                title: {type: string, maxLength: 240}
                phase: {enum: [D, E, F, F+]}
                subject: {type: string, description: Existing subject code. Defaults to existing subject or MAT; changing an existing topic subject is rejected.}
                source: {type: string, maxLength: 2000}
                topic: {type: string}
                definition: {type: string, maxLength: 2000}
                objectives: {type: string, description: One objective per line.}
                to: {type: string}
                type: {enum: [REQUIRES, RELATED, HARD, SOFT]}
                label: {type: string, maxLength: 200}
                concepts:
                  oneOf:
                    - {type: string, description: Comma-separated core codes.}
                    - {type: array, items: {type: string}}
                estimatedMinutes: {type: integer, minimum: 1, maximum: 30}
                blocks:
                  type: array
                  maxItems: 80
                  items:
                    type: object
                    required: [type, slide]
                    properties:
                      type: {enum: [heading, text, math, tip, figure]}
                      slide: {type: integer, minimum: 0, maximum: 9}
                      text: {type: string, maxLength: 2000}
                      name: {type: string, maxLength: 240}
                      expression: {type: string, maxLength: 240}
                      highlight: {type: boolean}
                      figureRef: {type: string, pattern: '^[a-z0-9-]{1,40}$'}
                concept: {type: string, description: Core code of a practice question (its PRIMARY concept).}
                itemType: {enum: [MULTIPLE_CHOICE, NUMERIC]}
                prompt: {type: string, maxLength: 2000}
                options: {type: array, minItems: 2, maxItems: 6, items: {type: string, maxLength: 240}}
                answerIndex: {type: integer, description: Index of the correct option.}
                answerValue: {type: [number, string], description: Correct numeric answer.}
                unit: {type: string, maxLength: 20}
                answerExample: {type: string, maxLength: 240}
                feedbackCorrect: {type: string, maxLength: 2000}
                feedbackIncorrect: {type: string, maxLength: 2000}
                difficulty: {type: integer, minimum: 1, maximum: 3}
                slide1: {type: string, maxLength: 2000}
                slide2: {type: string, maxLength: 2000}
      responses:
        '200': {description: 'Draft saved, with new revision (and the question code for kind=question).'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/questions/{code}:
    get:
      operationId: getPracticeQuestion
      summary: One editable practice question including its key, fetched only when an editor opens it.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, maxLength: 120}}
      responses:
        '200': {description: 'Prompt, options, answerIndex or answerValue/unit, feedback, difficulty and minutes.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/imports:
    post:
      operationId: enqueueCurriculumSeed
      summary: Enqueue the checked-in, version-pinned official-source seed; idempotent by SHA256.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: {$ref: '#/components/requestBodies/Revision'}
      responses:
        '202': {description: Existing or newly queued import job.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/exports:
    post:
      operationId: exportDraftManifest
      summary: Write a new manifest directory and return path plus strict review blockers; does not publish.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody: {$ref: '#/components/requestBodies/Revision'}
      responses:
        '200': {description: 'Export directory, revision, and strict findings.'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/accounts:
    get:
      operationId: listAccounts
      summary: 'QA: registered accounts (newest first, max 500). {enabled:false} unless BACKOFFICE_ACCOUNTS=true. Each call is audited.'
      description: |
        email is present only for email-link identities (decrypted); Google identities store no email, so emailNote explains it.
        label is the exact text the admin must retype to delete the account.
      responses:
        '200':
          description: Feature state and accounts.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
                  staff: {type: string}
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [userId, role, label, methods, status, createdAt, deletable]
                      properties:
                        userId: {type: string, format: uuid}
                        role: {type: string, enum: [STUDENT, GUARDIAN]}
                        label: {type: string}
                        displayName: {type: [string, 'null']}
                        grade: {type: [integer, 'null']}
                        methods: {type: array, items: {type: string, enum: [Google, Email]}}
                        email: {type: [string, 'null']}
                        emailNote: {type: [string, 'null']}
                        status: {type: string}
                        createdAt: {type: string, format: date-time}
                        lastLoginAt: {type: [string, 'null'], format: date-time}
                        deletable: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/accounts/deletions:
    post:
      operationId: requestAccountDeletion
      summary: 'QA: delete one student account through the same erasure pipeline as DELETE /v1/me (sessions revoked, worker erases data).'
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, confirm]
              properties:
                userId: {type: string, format: uuid}
                confirm: {type: string, maxLength: 300, description: 'Must equal the account label (email, display name, or akun-<id prefix>).'}
                revision: {type: integer, minimum: 0, description: 'Ignored; sent by the shared client helper.'}
      responses:
        '202': {description: 'Deletion queued: status DELETION_PENDING, requestedAt, completesBy, label.'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AccessKeyHeader: {type: apiKey, in: header, name: X-Backoffice-Key, description: 'Keeps Authorization available for the Nginx Basic login.'}
    AccessKey: {type: http, scheme: bearer, description: 'Random 32-byte local access key, not a JWT.'}
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string}
      description: 'Exact configured origin: loopback by default or BACKOFFICE_PUBLIC_ORIGIN in authenticated HTTPS proxy mode.'
  requestBodies:
    Revision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [revision]
            properties:
              revision: {type: integer, minimum: 0}
  responses:
    Error:
      description: Explicit auth, origin, validation, revision conflict, or filesystem error.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: {type: string}
              details: {type: array, items: {type: object}}
