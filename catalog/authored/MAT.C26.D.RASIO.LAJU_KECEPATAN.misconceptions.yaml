schemaVersion: 1
kind: CONCEPT_MISCONCEPTIONS
target: MAT.C26.D.RASIO.LAJU_KECEPATAN
provenance:
  source: authored
  note: Untuk rubrik numeric-v1 soal /coba (soal-peta versi kecepatan (rilis 16)).
review:
  status: PROPOSED
  decision: D8
  fields:
    - misconceptions
  evidence:
    - Kesalahan umum yang dipakai sebagai pengecoh soal /coba; kode dan kalimat perlu dicek guru.
misconceptions:
  - code: BERHENTI_DI_JARAK
    description: Jarak asli dianggap jawaban kecepatan
    example: jarak asli 60 km, lalu berhenti
    indicators:
      - "soal-peta versi kecepatan (rilis 16): jawaban 60"
  - code: LAJU_DIKALI_WAKTU
    description: Kecepatan dihitung sebagai jarak dikali waktu
    example: 60 × 2 = 120
    indicators:
      - "soal-peta versi kecepatan (rilis 16): jawaban 120"
  - code: LAJU_TERBALIK
    description: Kecepatan dihitung sebagai waktu dibagi jarak
    example: "2 : 60 = 0,03"
    indicators:
      - "soal-peta versi kecepatan (rilis 16): jawaban 0,03"
