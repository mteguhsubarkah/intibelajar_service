blocks:
  - {type: heading, slide: 0, text: Tiap perbandingan butuh dua sisi tertentu.}
  - {type: text, slide: 0, text: 'Terhadap sudut acuan: depan berhadapan dengan sudut; samping menempel pada sudut; miring berhadapan dengan siku-siku.'}
  - {type: math, slide: 0, name: sin, expression: 'sin = depan / miring'}
  - {type: math, slide: 0, name: cos, expression: 'cos = samping / miring'}
  - {type: math, slide: 0, name: tan, expression: 'tan = depan / samping'}
  - {type: tip, slide: 0, text: 'Lihat dulu sisi mana yang diketahui dan dicari, baru pilih perbandingannya.'}
  - {type: heading, slide: 1, text: 'Contoh: soal berbeda, cara yang sama'}
  - {type: text, slide: 1, text: 'Bayangan sebuah tiang 8 m, sudut matahari 45°. Berapa tinggi tiang? Yang diketahui samping (8 m), yang dicari depan (tinggi tiang). Depan dan samping memakai tan.'}
  - {type: math, slide: 1, name: Model, expression: 'tan 45° = t / 8'}
