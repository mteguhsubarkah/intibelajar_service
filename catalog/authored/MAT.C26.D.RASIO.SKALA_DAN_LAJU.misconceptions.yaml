schemaVersion: 1
kind: CONCEPT_MISCONCEPTIONS
target: MAT.C26.D.RASIO.SKALA_DAN_LAJU
provenance:
  source: authored
  note: Untuk rubrik numeric-v1 soal /coba (soal-peta).
review:
  status: PROPOSED
  decision: D8
  fields:
    - misconceptions
  evidence:
    - Kesalahan umum yang dipakai sebagai pengecoh soal /coba; kode dan kalimat perlu dicek guru.
misconceptions:
  - code: JARAK_BELUM_KM
    description: Jarak asli dalam cm langsung dipakai tanpa diubah ke km
    example: "6.000.000 : 2 = 3.000.000"
    indicators:
      - "soal-peta: jawaban 3.000.000"
  - code: SKALA_DIABAIKAN
    description: Jarak pada peta dipakai sebagai jarak sebenarnya
    example: "12 : 2 = 6"
    indicators:
      - "soal-peta: jawaban 6"
