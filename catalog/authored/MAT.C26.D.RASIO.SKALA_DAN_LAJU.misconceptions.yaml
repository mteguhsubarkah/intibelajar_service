schemaVersion: 1
kind: CONCEPT_MISCONCEPTIONS
target: MAT.C26.D.RASIO.SKALA_DAN_LAJU
provenance:
  source: authored
  note: Untuk rubrik numeric-v1 soal /coba (soal-peta versi lama (tanya waktu), soal-peta).
review:
  status: PROPOSED
  decision: D8
  fields:
    - misconceptions
  evidence:
    - Kesalahan umum yang dipakai sebagai pengecoh soal /coba; kode dan kalimat perlu dicek guru.
misconceptions:
  - code: BERHENTI_DI_JARAK
    description: Jarak asli dari skala dianggap sudah jawaban akhir
    example: jarak asli 3 km, lalu berhenti
    indicators:
      - "soal-peta versi lama (tanya waktu): jawaban 3"
  - code: LAJU_TERBALIK
    description: Laju dihitung terbalik (kecepatan dibagi jarak)
    example: "30 : 3 = 10"
    indicators:
      - "soal-peta versi lama (tanya waktu): jawaban 10"
  - code: JARAK_BELUM_KM
    description: Jarak asli dalam cm langsung dipakai tanpa diubah ke km
    example: "300.000 : 30 = 10.000"
    indicators:
      - "soal-peta versi lama (tanya waktu): jawaban 10.000"
  - code: SKALA_DIABAIKAN
    description: Jarak pada peta dipakai sebagai jarak sebenarnya
    example: 12 cm dianggap 12 km
    indicators:
      - "soal-peta: jawaban 12"
