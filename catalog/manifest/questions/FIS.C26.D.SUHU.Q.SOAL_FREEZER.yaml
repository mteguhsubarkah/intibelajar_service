body:
  schemaVersion: 1
  prompt: Suhu di dalam freezer kulkas −5 °C, sedangkan suhu tubuh manusia normal 310 K. Berapa selisih kedua suhu itu dalam °C?
  hints:
    - step: 1
      conceptCode: FIS.C26.D.SUHU.SUHU_DAN_PERPINDAHAN_KALOR
      lead: Samakan satuannya dulu. Jarak antarangka di skala kelvin dan Celsius sama, cuma titik nolnya geser 273.
      note: °C = K − 273
    - step: 2
      conceptCode: MAT.C26.D.BILANGAN.OPERASI_BILANGAN_BULAT
      lead: Selisih = suhu yang lebih tinggi dikurangi suhu yang lebih rendah. Mengurangi bilangan negatif sama dengan menambah.
      note: a − (−b) = a + b
  answerFormat: NUMBER
  answerExample: selisih = … °C
