  finalAnswerEvidence:
    - MAT.TRI.SUDUT_ISTIMEWA
  feedback:
    correct: sin 30° = ½, jadi sisi depan = ½ × 10 = 5. Pola ini dipakai untuk semua sudut istimewa.
    incorrect: Sisi depan = sin 30° × sisi miring, dan sin 30° = ½ — jadi 5. Pola ini dipakai untuk semua sudut istimewa.
