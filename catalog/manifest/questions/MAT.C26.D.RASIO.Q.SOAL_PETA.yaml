      keyFormula: 1 jam = 60 menit
    - misconceptionCode: BERHENTI_DI_JARAK
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      keyFormula: "waktu = jarak : kecepatan"
    - misconceptionCode: LAJU_TERBALIK
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      keyFormula: "waktu = jarak : kecepatan"
    - misconceptionCode: JARAK_BELUM_KM
