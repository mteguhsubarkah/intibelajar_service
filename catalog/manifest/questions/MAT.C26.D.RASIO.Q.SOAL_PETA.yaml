  feedback:
    correct: "6 × 50.000 = 300.000 cm = 3 km. 3 : 30 = 0,1 jam = 6 menit."
    incorrect: "Jawabannya 6 menit. Jarak asli 3 km, waktu 3 : 30 = 0,1 jam, lalu 0,1 × 60 = 6 menit."
  workedSolution:
    steps:
      - title: Jarak asli dari skala
        body: 6 × 50.000 = 300.000 cm = 3 km
      - title: Waktu dari laju
        body: "waktu = 3 km : 30 km/jam = 0,1 jam"
      - title: Ubah ke menit
        body: 0,1 jam × 60 menit per jam = 6 menit
    after:
      - "3 km : 30 km/jam = 0,1 jam = 6 menit"
  cobaSteps:
    - step: 1
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      prompt: Waktu perjalanan = … jam
      key: "0,1 jam (3 km : 30 km/jam)"
      correct: "Pas, 3 km : 30 km/jam = 0,1 jam. Skala dan lajunya udah benar."
      answer:
        value: 0.1
        tolerance:
          relative: 0.02
          floor: 0.1
      partials:
        - value: 3
          explanation: "Jarak aslinya 3 km, pas. Sekarang waktunya: 3 : 30 = … jam?"
        - value: 300000
          explanation: "300.000 cm udah benar. Ubah ke km dulu: 1 km = 100.000 cm."
        - value: 10
          explanation: "Kebalik: waktu = jarak : kecepatan, jadi 3 : 30."
        - value: 6
          explanation: Itu sudah dalam menit. Di kotak ini tulis waktunya dalam jam dulu.
    - step: 2
      conceptCode: MAT.C26.D.RASIO.KONVERSI_SATUAN_WAKTU
      prompt: 0,1 jam = … menit
      key: 6 menit (0,1 × 60)
      correct: Pas, 0,1 × 60 = 6 menit.
      answer:
        value: 6
        tolerance:
          relative: 0.02
          floor: 1
      partials:
        - value: 0.1
          tolerance:
            relative: 0.02
            floor: 0.1
          explanation: Itu masih dalam jam. Kalikan 60.
        - value: 600
          explanation: 1 jam = 60 menit, bukan 6.000. Coba 0,1 × 60.
