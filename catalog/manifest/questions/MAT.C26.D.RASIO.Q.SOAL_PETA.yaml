      misconceptionCode: SKALA_DIABAIKAN
      explanation: 12 cm itu jarak di peta. Kalikan dulu dengan 500.000 supaya dapat jarak aslinya.
    - pattern:
        kind: NUMERIC
        value: 60
      conceptCode: MAT.C26.D.RASIO.LAJU_KECEPATAN
      misconceptionCode: BERHENTI_DI_JARAK
      explanation: "60 km itu jarak aslinya, sudah benar. Sekarang hitung kecepatannya: v = s : t."
    - pattern:
