body:
  schemaVersion: 1
  prompt: "Pada peta, jarak rumah Dika ke sekolah 6 cm dengan skala 1 : 50.000. Setiap pagi Dika diantar ayahnya naik motor dengan kecepatan tetap 30 km/jam. Berapa menit waktu perjalanan Dika ke sekolah?"
  hints:
    - step: 1
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      lead: "Skala 1 : 50.000 artinya 1 cm di peta = 50.000 cm aslinya. Ubah ke km dulu, lalu waktu = jarak : kecepatan."
      note: "jarak asli = jarak peta × 50.000; 1 km = 100.000 cm; waktu = jarak : kecepatan"
    - step: 2
      conceptCode: MAT.C26.D.RASIO.KONVERSI_SATUAN_WAKTU
      lead: "Hasilmu masih dalam jam. Ubah ke menit: 1 jam = 60 menit, jadi kalikan dengan 60."
      note: 1 jam = 60 menit
  answerFormat: NUMBER
  answerExample: waktu = … menit
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 6
    unit: menit
    tolerance:
      relative: 0.02
      floor: 1
    thousandsDot: true
  acceptedForms:
    - 6 menit
    - "6 × 50.000 = 300.000 cm = 3 km; 3 : 30 = 0,1 jam; 0,1 × 60 = 6 menit"
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
      steps:
        - code: S1
          description: "Jarak asli: 6 × 50.000 = 300.000 cm = 3 km"
          concepts:
            - code: MAT.C26.D.RASIO.SKALA_DAN_LAJU
              role: REQUIRED
        - code: S2
          description: "Waktu = jarak : kecepatan = 3 : 30 = 0,1 jam"
          concepts:
            - code: MAT.C26.D.RASIO.SKALA_DAN_LAJU
              role: REQUIRED
        - code: S3
          description: 0,1 jam × 60 = 6 menit
          concepts:
            - code: MAT.C26.D.RASIO.KONVERSI_SATUAN_WAKTU
              role: REQUIRED
  misconceptionMap:
    - pattern:
        kind: NUMERIC
        value: 0.1
      conceptCode: MAT.C26.D.RASIO.KONVERSI_SATUAN_WAKTU
      misconceptionCode: MASIH_DALAM_JAM
      explanation: 0,1 itu masih dalam jam. Soalnya minta menit, jadi kalikan 60.
    - pattern:
        kind: NUMERIC
        value: 3
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      misconceptionCode: BERHENTI_DI_JARAK
      explanation: "3 km itu jarak aslinya, sudah benar. Sekarang hitung waktunya: waktu = jarak : kecepatan."
    - pattern:
        kind: NUMERIC
        value: 10
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      misconceptionCode: LAJU_TERBALIK
      explanation: "Kebalik: waktu = jarak : kecepatan, bukan kecepatan : jarak."
    - pattern:
        kind: NUMERIC
        value: 10000
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      misconceptionCode: JARAK_BELUM_KM
      explanation: Jaraknya masih dalam cm. Ubah ke km dulu sebelum dibagi 30 km/jam.
  finalAnswerEvidence:
    - MAT.C26.D.RASIO.SKALA_DAN_LAJU
    - MAT.C26.D.RASIO.KONVERSI_SATUAN_WAKTU
  lessonFor:
