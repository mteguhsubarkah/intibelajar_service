body:
  schemaVersion: 1
  prompt: "Pada peta, jarak rumah Dika ke rumah neneknya 12 cm dengan skala 1 : 500.000. Dika dan keluarganya naik bus dan sampai dalam waktu 2 jam. Berapa kecepatan rata-rata bus itu dalam km/jam?"
  hints:
    - step: 1
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      lead: "Skala adalah perbandingan jarak pada peta dengan jarak aslinya. Skala 1 : 500.000 artinya 1 cm di peta sama dengan 500.000 cm di dunia nyata. Karena kecepatannya ditanyakan dalam km/jam, ubah jaraknya ke km dulu."
      note: jarak asli = jarak di peta × penyebut skala; 1 km = 100.000 cm
    - step: 2
      conceptCode: MAT.C26.D.RASIO.LAJU_KECEPATAN
      lead: Laju atau kecepatan (v) menunjukkan seberapa jauh sesuatu bergerak dalam waktu tertentu. Kecepatan = jarak tempuh (s) dibagi waktu tempuh (t).
      note: "v = s : t"
  answerFormat: NUMBER
  answerExample: v = … km/jam
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 30
    unit: km/jam
    tolerance:
      relative: 0.02
      floor: 1
    thousandsDot: true
  acceptedForms:
    - 30 km/jam
    - "12 × 500.000 = 6.000.000 cm = 60 km; v = 60 : 2 = 30 km/jam"
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
      steps:
        - code: S1
          description: "Jarak asli: 12 × 500.000 = 6.000.000 cm = 60 km"
          concepts:
            - code: MAT.C26.D.RASIO.SKALA_DAN_LAJU
              role: REQUIRED
        - code: S2
          description: "Kecepatan = jarak : waktu = 60 : 2 = 30 km/jam"
          concepts:
            - code: MAT.C26.D.RASIO.LAJU_KECEPATAN
              role: REQUIRED
  misconceptionMap:
