body:
  schemaVersion: 1
  prompt: "Pada peta, jarak rumah Dika ke rumah neneknya 12 cm dengan skala 1 : 500.000. Berapa jarak sebenarnya rumah Dika ke rumah neneknya dalam km?"
  hints:
    - step: 1
      conceptCode: MAT.C26.D.RASIO.SKALA_DAN_LAJU
      lead: "Skala adalah perbandingan jarak pada peta dengan jarak aslinya. Skala 1 : 500.000 artinya 1 cm di peta sama dengan 500.000 cm di dunia nyata."
      note: jarak asli = jarak di peta × penyebut skala
    - step: 2
      conceptCode: MAT.C26.D.RASIO.KONVERSI_SATUAN_PANJANG
      lead: "Satuan panjang bertingkat: km, hm, dam, m, dm, cm, mm. Turun satu anak tangga dikali 10, naik satu anak tangga dibagi 10. Karena yang ditanya dalam km, ubah cm ke km."
      note: 1 km = 100.000 cm; cm ke km dibagi 100.000
  answerFormat: NUMBER
  answerExample: jarak sebenarnya = … km
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 60
    unit: km
    tolerance:
      relative: 0.02
      floor: 1
    thousandsDot: true
  acceptedForms:
    - 60 km
    - 12 × 500.000 = 6.000.000 cm = 60 km
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
      steps:
        - code: S1
          description: "Jarak asli: 12 × 500.000 = 6.000.000 cm"
          concepts:
            - code: MAT.C26.D.RASIO.SKALA_DAN_LAJU
              role: REQUIRED
        - code: S2
          description: "6.000.000 cm : 100.000 = 60 km"
          concepts:
            - code: MAT.C26.D.RASIO.KONVERSI_SATUAN_PANJANG
              role: REQUIRED
  misconceptionMap:
