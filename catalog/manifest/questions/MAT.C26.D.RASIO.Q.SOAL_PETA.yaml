      misconceptionCode: CM_BELUM_KE_KM
      explanation: "Itu masih dalam cm. Ubah ke km dulu: dibagi 100.000."
    - pattern:
        kind: NUMERIC
        value: 60000
      conceptCode: MAT.C26.D.RASIO.KONVERSI_SATUAN_PANJANG
      misconceptionCode: BERHENTI_DI_METER
      explanation: Itu masih dalam meter. Dari m ke km dibagi 1.000 lagi.
    - pattern:
