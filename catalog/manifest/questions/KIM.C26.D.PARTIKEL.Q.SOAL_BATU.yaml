body:
  schemaVersion: 1
  prompt: Sebuah batu bermassa 60 g dimasukkan ke gelas ukur berisi air, dan permukaan airnya naik 20 mL. Berapa massa jenis batu itu?
  hints:
    - step: 1
      conceptCode: KIM.C26.D.PARTIKEL.MASSA_JENIS
      lead: "Air naik karena didorong batu. Jadi volume batu sama dengan kenaikan airnya. Setelah itu, massa jenis = massa : volume."
      note: "volume batu = kenaikan air; ρ = m : V"
    - step: 2
      conceptCode: FIS.C26.D.UKUR.BESARAN_DAN_SATUAN
      lead: Massa jenis biasanya ditulis dalam g/cm³. 1 mL sama dengan 1 cm³, jadi 20 mL = 20 cm³.
      note: 1 mL = 1 cm³
  answerFormat: NUMBER
  answerExample: ρ = … g/cm³
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 3
    unit: g/cm³
    tolerance:
      relative: 0.02
      floor: 1
    thousandsDot: true
  acceptedForms:
    - 3 g/cm³
    - "V = 20 mL = 20 cm³; ρ = 60 : 20 = 3 g/cm³"
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
      steps:
