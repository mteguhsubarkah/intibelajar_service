body:
  schemaVersion: 1
  prompt: Sebongkah es bermassa 90 g mencair seluruhnya menjadi air. Jika massa jenis air 1 g/cm³, berapa volume air yang terbentuk?
  hints:
    - step: 1
      conceptCode: KIM.C26.D.PARTIKEL.PERUBAHAN_WUJUD_ZAT
      lead: "Mencair adalah perubahan wujud dari padat ke cair, partikelnya tidak bertambah atau berkurang. Jadi massa air sama dengan massa es."
      note: massa sebelum = massa sesudah berubah wujud
    - step: 2
      conceptCode: KIM.C26.D.PARTIKEL.MASSA_JENIS
      lead: "Dari inti 1, massa airnya 90 g. Massa jenis = massa : volume, jadi volume = massa : massa jenis."
      note: "V = m : ρ"
  answerFormat: NUMBER
  answerExample: V = … cm³
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 90
    unit: cm³
    tolerance:
      relative: 0.02
      floor: 1
    thousandsDot: true
  acceptedForms:
    - 90 cm³
    - 90 mL
    - "massa air = 90 g; V = 90 : 1 = 90 cm³"
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
      steps:
        - code: S1
          description: Massa air = massa es = 90 g (massa tetap saat mencair)
          concepts:
            - code: KIM.C26.D.PARTIKEL.PERUBAHAN_WUJUD_ZAT
              role: REQUIRED
        - code: S2
          description: "V = m : ρ = 90 : 1 = 90 cm³"
          concepts:
            - code: KIM.C26.D.PARTIKEL.MASSA_JENIS
              role: REQUIRED
  misconceptionMap:
    - pattern:
        kind: NUMERIC
        value: 0.011
      conceptCode: KIM.C26.D.PARTIKEL.MASSA_JENIS
      misconceptionCode: PEMBAGIAN_TERBALIK
      explanation: "Kebalik: volume = massa dibagi massa jenis, jadi 90 : 1."
  finalAnswerEvidence:
    - KIM.C26.D.PARTIKEL.PERUBAHAN_WUJUD_ZAT
    - KIM.C26.D.PARTIKEL.MASSA_JENIS
  lessonFor:
