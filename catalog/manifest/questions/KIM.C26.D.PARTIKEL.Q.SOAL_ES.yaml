      keyFormula: "V = m : ρ"
  feedback:
    correct: "Massa air = massa es = 90 g. V = 90 : 1 = 90 cm³."
    incorrect: "Jawabannya 90 cm³. Saat mencair massanya tetap 90 g, lalu V = m : ρ = 90 : 1 = 90 cm³."
  workedSolution:
    steps:
      - title: Massa tetap saat mencair
        body: massa air = massa es = 90 g
      - title: Volume dari massa jenis
        body: "V = m : ρ = 90 : 1 = 90 cm³"
    after:
      - "90 g air dengan ρ = 1 g/cm³ → V = 90 cm³"
  cobaSteps:
