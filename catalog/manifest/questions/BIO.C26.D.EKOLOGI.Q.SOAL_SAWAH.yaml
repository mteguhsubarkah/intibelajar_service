      explanation: "Kamu menghitung 4 kali pindah. Hitung panahnya: padi → tikus → ular → elang ada 3 panah."
    - pattern:
        kind: NUMERIC
        value: 100
      conceptCode: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
      misconceptionCode: PERPINDAHAN_KURANG
      explanation: Itu baru sampai ular. Masih ada satu perpindahan lagi ke elang.
    - pattern:
        kind: NUMERIC
        value: 1000
      conceptCode: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
      misconceptionCode: PERPINDAHAN_KURANG
      explanation: Itu energi di tikus. Lanjutkan ke ular, lalu ke elang.
    - pattern:
        kind: NUMERIC
        value: 10000
      conceptCode: BIO.C26.D.EKOLOGI.RANTAI_DAN_JARING_MAKANAN
      misconceptionCode: ENERGI_PINDAH_UTUH
      explanation: Energi tidak pindah utuh. Tiap naik satu tingkat hanya sekitar 10% yang diteruskan.
  finalAnswerEvidence:
