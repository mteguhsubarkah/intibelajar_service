  feedback:
    correct: "Padi → tikus, tikus → ular, ular → elang: energi berpindah 3 kali."
    incorrect: Jawabannya 3 kali. Ada 3 panah (padi → tikus, tikus → ular, ular → elang), dan setiap panah satu perpindahan energi.
  workedSolution:
    steps:
      - title: Kenali produsen dan konsumen
        body: padi produsen, tikus konsumen I, ular konsumen II, elang konsumen III
      - title: Hitung panahnya
        body: "padi → tikus, tikus → ular, ular → elang: 3 perpindahan energi"
    after:
      - 3 panah, jadi 3 kali perpindahan energi
  cobaSteps:
    - step: 1
      conceptCode: BIO.C26.D.EKOLOGI.RANTAI_DAN_JARING_MAKANAN
      prompt: Produsen di rantai ini adalah …
      key: padi (membuat makanannya sendiri)
      correct: "Betul, padi produsennya: ia membuat makanannya sendiri."
      words:
        correct:
          - padi
          - tanaman padi
          - pohon padi
        wrong:
          - words:
              - tikus
              - ular
              - elang
            explanation: Itu konsumen, karena ia memakan makhluk lain. Produsen membuat makanannya sendiri.
    - step: 2
      conceptCode: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
      prompt: Dari padi sampai ular, energi berpindah … kali
      key: 2 kali (padi → tikus, tikus → ular)
      correct: "Pas, padi → tikus dan tikus → ular: 2 kali."
      answer:
        value: 2
        tolerance:
          relative: 0.02
          floor: 1
      partials:
