body:
  schemaVersion: 1
  prompt: Di sawah terdapat rantai makanan padi → tikus → ular → elang. Ada berapa kali perpindahan energi dalam rantai makanan tersebut?
  hints:
    - step: 1
      conceptCode: BIO.C26.D.EKOLOGI.RANTAI_DAN_JARING_MAKANAN
      lead: Di rantai makanan, produsen adalah makhluk hidup yang membuat makanannya sendiri, biasanya tumbuhan. Yang memakan produsen disebut konsumen I, yang memakan konsumen I disebut konsumen II, begitu seterusnya.
      note: produsen → konsumen I → konsumen II → konsumen III
    - step: 2
      conceptCode: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
      lead: Energi mengalir satu arah, dari produsen ke konsumen. Setiap kali energi pindah dari produsen ke konsumen I, atau dari satu konsumen ke konsumen berikutnya, itu dihitung 1 perpindahan energi.
      note: 1 panah = 1 perpindahan energi
  answerFormat: NUMBER
  answerExample: … kali
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 3
    unit: kali
    tolerance:
      relative: 0.02
      floor: 1
  acceptedForms:
    - 3 kali
    - "padi → tikus, tikus → ular, ular → elang: 3 perpindahan"
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
