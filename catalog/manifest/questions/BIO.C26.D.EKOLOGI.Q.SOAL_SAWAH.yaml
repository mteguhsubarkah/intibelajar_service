  feedback:
    correct: Ada 3 panah. 10.000 → 1.000 → 100 → 10 kJ.
    incorrect: "Jawabannya 10 kJ. Ada 3 panah, dan tiap perpindahan hanya sekitar 10%: 10.000 → 1.000 → 100 → 10 kJ."
  workedSolution:
    steps:
      - title: Hitung panahnya
        body: "padi → tikus → ular → elang: 3 panah, 3 kali pindah"
      - title: Kurangi 10% tiap pindah
        body: 10.000 → 1.000 → 100 → 10 kJ
    after:
      - energi di elang 10 kJ
  cobaSteps:
    - step: 1
      conceptCode: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
      prompt: Energi berpindah … kali
      key: 3 kali (ada 3 panah)
      correct: "Pas, ada 3 panah: padi → tikus → ular → elang."
      answer:
        value: 3
        tolerance:
          relative: 0.02
          floor: 1
      partials:
        - value: 4
          explanation: Ada 4 makhluk, tapi panahnya cuma 3. Energi pindah di tiap panah.
    - step: 2
      conceptCode: BIO.C26.D.EKOLOGI.RANTAI_DAN_JARING_MAKANAN
      prompt: Energi yang sampai ke elang = … kJ
      key: 10 kJ (10.000 → 1.000 → 100 → 10)
      correct: Pas, 10.000 → 1.000 → 100 → 10 kJ.
      answer:
        value: 10
        tolerance:
          relative: 0.02
          floor: 1
      partials:
        - value: 100
          explanation: Itu baru sampai ular. Satu langkah lagi.
        - value: 1000
          explanation: Itu di tikus. Lanjutkan ke ular, lalu elang.
        - value: 1
          explanation: Panahnya cuma 3, jadi dikali 10% sebanyak 3 kali.
        - value: 10000
          explanation: Energi tidak pindah utuh. Tiap naik satu tingkat cuma sekitar 10%.
