body:
  schemaVersion: 1
  prompt: Di sawah terdapat rantai makanan padi → tikus → ular → elang. Energi yang tersimpan pada padi 10.000 kJ. Berapa energi yang sampai ke elang?
  hints:
    - step: 1
      conceptCode: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
      lead: "Energi mengalir satu arah dari produsen ke konsumen, dan berkurang setiap kali pindah. Hitung panahnya: berapa kali energi berpindah?"
      note: jumlah perpindahan = jumlah panah
    - step: 2
      conceptCode: BIO.C26.D.EKOLOGI.RANTAI_DAN_JARING_MAKANAN
      lead: Padi produsen, tikus konsumen I, ular konsumen II, elang konsumen III. Tiap naik satu tingkat, cuma sekitar 10% energi yang diteruskan.
      note: energi berikutnya = 10% × energi sebelumnya
  answerFormat: NUMBER
  answerExample: energi di elang = … kJ
rubric:
  schemaVersion: 1
  evaluator: numeric-v1
  answer:
    value: 10
    unit: kJ
    tolerance:
      relative: 0.02
      floor: 1
    thousandsDot: true
  acceptedForms:
    - 10 kJ
    - 10.000 → 1.000 → 100 → 10 kJ
  solutionPaths:
    - code: UTAMA
      label: langkah per inti
      steps:
        - code: S1
          description: "Ada 3 panah: padi → tikus → ular → elang, jadi energi berpindah 3 kali"
          concepts:
            - code: BIO.C26.D.EKOLOGI.INTERAKSI_DAN_ALIRAN_ENERGI
              role: REQUIRED
        - code: S2
          description: "Tiap perpindahan 10%: 10.000 → 1.000 → 100 → 10 kJ"
          concepts:
            - code: BIO.C26.D.EKOLOGI.RANTAI_DAN_JARING_MAKANAN
              role: REQUIRED
