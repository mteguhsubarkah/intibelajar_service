body:
  schemaVersion: 1
  prompt: Sebuah menara setinggi 20 m dilihat dari sebuah titik dengan sudut depresi 30°. Berapa jarak mendatar titik itu ke kaki menara?
  hints:
    - step: 1
      conceptCode: MAT.TRI.SEGITIGA_SIKU_SIKU
      lead: Namai sisinya dari sudut 30°.
      note: Menara 20 m berdiri di depan sudut, itu sisi depan. Jarak mendatar menempel di tanah, itu sisi samping.
    - step: 2
      conceptCode: MAT.TRI.DEFINISI_SIN_COS_TAN
      lead: Pilih perbandingan yang cocok dengan sisi yang kamu punya.
    - step: 3
      conceptCode: MAT.TRI.SUDUT_ISTIMEWA
      lead: Sudut 30° punya nilai yang rapi.
      note: Nilainya bisa kamu hitung tanpa kalkulator — dipakai di langkah terakhir, saat angkanya dihitung.
  answerFormat: TEXT
rubric:
  schemaVersion: 1
  evaluator: tower-v1
