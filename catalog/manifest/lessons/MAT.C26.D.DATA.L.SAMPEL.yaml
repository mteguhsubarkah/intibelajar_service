    text: Populasi dan sampel
  - type: text
    slide: 0
    text: "**Populasi** adalah seluruh objek yang ingin diketahui; **sampel** adalah sebagian yang benar-benar diambil datanya."
  - type: text
    slide: 0
    text: Sampel **representatif** mewakili ciri populasi, misalnya dipilih acak dari semua kelas, bukan hanya dari satu kelas.
  - type: math
    slide: 0
    name: sampel representatif
    expression: semua anggota berpeluang sama terpilih
    highlight: true
  - type: heading
    slide: 1
    text: Waspada bias
  - type: text
    slide: 1
    text: Sampel **bias** jika cara memilihnya condong ke kelompok tertentu.
  - type: text
    slide: 1
    text: Menanyakan olahraga favorit hanya kepada anggota klub basket akan membuat basket tampak paling populer di sekolah.
  - type: math
    slide: 1
    name: memperkirakan populasi
    expression: proporsi sampel × ukuran populasi
    highlight: true
  - type: tip
    slide: 1
    text: "Tanyakan: apakah setiap anggota populasi punya kesempatan yang sama untuk terpilih?"
