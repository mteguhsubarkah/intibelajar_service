blocks:
  - type: heading
    slide: 0
    text: Getaran
  - type: text
    slide: 0
    text: Getaran adalah gerak bolak-balik melalui titik setimbang.
  - type: text
    slide: 0
    text: Periode (T) = waktu satu getaran; frekuensi (f) = banyak getaran per sekon, satuannya hertz (Hz). f = 1/T.
  - type: math
    slide: 0
    name: frekuensi
    expression: f = n / t = 1 / T
    highlight: true
  - type: heading
    slide: 1
    text: Gelombang
  - type: text
    slide: 1
    text: Gelombang merambatkan energi tanpa memindahkan mediumnya.
  - type: text
    slide: 1
    text: "**Transversal**: arah getar tegak lurus arah rambat (gelombang tali). **Longitudinal**: arah getar searah arah rambat (bunyi, slinki yang didorong)."
  - type: math
    slide: 1
    name: cepat rambat
    expression: v = λ × f
    highlight: true
  - type: tip
    slide: 1
    text: "λ (lambda) adalah panjang satu gelombang: satu bukit + satu lembah, atau satu rapatan + satu renggangan."
