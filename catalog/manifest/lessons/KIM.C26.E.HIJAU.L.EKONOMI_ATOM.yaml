blocks:
  - type: heading
    slide: 0
    text: Pengertian ekonomi atom
  - type: text
    slide: 0
    text: "**Ekonomi atom** mengukur berapa bagian atom pereaksi yang menjadi produk yang diinginkan."
  - type: text
    slide: 0
    text: Ekonomi atom = (Mr produk yang diinginkan ÷ jumlah Mr semua pereaksi) × 100%.
  - type: math
    slide: 0
    name: ekonomi atom
    expression: Mr produk ÷ Σ Mr pereaksi × 100%
    highlight: true
  - type: heading
    slide: 1
    text: Menilai reaksi
  - type: text
    slide: 1
    text: Reaksi adisi seperti C₂H₄ + H₂O → C₂H₅OH memiliki ekonomi atom 100% karena semua atom pereaksi masuk ke produk.
  - type: text
    slide: 1
    text: Reaksi yang menghasilkan banyak produk samping memiliki ekonomi atom rendah dan menghasilkan lebih banyak limbah.
  - type: tip
    slide: 1
    text: Rendemen tinggi belum tentu ekonomi atomnya tinggi; keduanya mengukur hal yang berbeda.
