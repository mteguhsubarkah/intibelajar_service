blocks:
  - type: heading
    slide: 0
    text: Kurva normal
  - type: text
    slide: 0
    text: Distribusi normal berbentuk lonceng dan simetris terhadap rataan μ. Lebar kurvanya ditentukan simpangan baku σ.
  - type: text
    slide: 0
    text: "Aturan empiris: sekitar **68%** data berada dalam μ ± σ, **95%** dalam μ ± 2σ, dan **99,7%** dalam μ ± 3σ."
  - type: math
    slide: 0
    name: 68–95–99,7
    expression: μ ± σ, μ ± 2σ, μ ± 3σ
    highlight: true
  - type: heading
    slide: 1
    text: Nilai baku z
  - type: text
    slide: 1
    text: "Ubah nilai x ke nilai baku: **z = (x − μ) / σ**. Nilai z menyatakan berapa simpangan baku x berada di atas atau di bawah rataan."
  - type: text
    slide: 1
    text: Peluang dibaca dari tabel distribusi normal baku, misalnya P(Z < 1) ≈ 0,8413. Luas seluruh daerah di bawah kurva = 1.
  - type: math
    slide: 1
    name: nilai baku
    expression: z = (x − μ) / σ
    highlight: true
  - type: math
    slide: 1
    name: luas total
    expression: "1"
  - type: tip
    slide: 1
    text: Karena simetris, P(Z > a) = P(Z < −a) dan P(Z < 0) = 0,5.
