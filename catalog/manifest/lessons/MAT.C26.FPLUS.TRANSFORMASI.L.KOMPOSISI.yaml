schemaVersion: 1
code: MAT.C26.FPLUS.TRANSFORMASI.L.KOMPOSISI
title: Komposisi transformasi dengan matriks
estimatedMinutes: 5
aliases: []
concepts:
  - MAT.C26.FPLUS.TRANSFORMASI.KOMPOSISI_TRANSFORMASI_DENGAN_MATRIKS
blocks:
  - type: heading
    slide: 0
    text: Matriks transformasi
  - type: text
    slide: 0
    text: "Transformasi linear di bidang dapat ditulis sebagai perkalian matriks: (x′, y′) = M · (x, y)."
  - type: text
    slide: 0
    text: "Contoh: refleksi sumbu x M = [[1, 0], [0, −1]], rotasi 90° M = [[0, −1], [1, 0]], dilatasi [O, k] M = [[k, 0], [0, k]]."
  - type: math
    slide: 0
    name: bayangan
    expression: (x′, y′) = M · (x, y)
    highlight: true
  - type: heading
    slide: 1
    text: Urutan komposisi
  - type: text
    slide: 1
    text: "Transformasi M₁ dilanjutkan M₂ setara dengan satu matriks **M₂ · M₁**: matriks yang dikerjakan pertama ditulis paling kanan."
  - type: text
    slide: 1
    text: "Determinan matriks komposisi memberi faktor perubahan luas: luas bayangan = |det M| × luas awal."
  - type: math
    slide: 1
    name: komposisi
    expression: M = M₂ · M₁
    highlight: true
  - type: math
    slide: 1
    name: luas
    expression: "|det M| × luas awal"
  - type: tip
    slide: 1
    text: Perkalian matriks tidak komutatif, jadi urutan transformasi penting.
