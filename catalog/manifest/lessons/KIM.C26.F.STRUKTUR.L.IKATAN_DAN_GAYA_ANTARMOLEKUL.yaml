    text: Ion atau kovalen
  - type: text
    slide: 0
    text: "**Ikatan ion**: serah-terima elektron, biasanya logam + nonlogam (NaCl). **Ikatan kovalen**: pemakaian bersama pasangan elektron, nonlogam + nonlogam (H₂O, CO₂)."
  - type: math
    slide: 0
    name: logam + nonlogam
    expression: ikatan ion
    highlight: true
  - type: math
    slide: 0
    name: nonlogam + nonlogam
    expression: ikatan kovalen
  - type: heading
    slide: 1
    text: Ikatan hidrogen
  - type: text
    slide: 1
    text: Molekul yang memiliki H terikat pada **F, O, atau N** membentuk **ikatan hidrogen** antarmolekul yang kuat, sehingga titik didihnya tinggi.
  - type: text
    slide: 1
    text: Itulah sebabnya H₂O (100°C) mendidih jauh di atas H₂S.
  - type: math
    slide: 1
    name: ikatan hidrogen
    expression: H–F, H–O, H–N
    highlight: true
  - type: tip
    slide: 1
    text: Gaya antarmolekul memengaruhi titik didih; ikatan dalam molekul tidak putus saat mendidih.
