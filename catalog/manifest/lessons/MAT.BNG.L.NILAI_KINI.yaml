blocks:
  - type: heading
    slide: 0
    text: Nilai mendatang
  - type: text
    slide: 0
    text: "**Nilai mendatang** (future value) adalah nilai uang di masa depan: **FV = PV(1 + i)ⁿ**."
  - type: text
    slide: 0
    text: "Contoh: Rp4.000.000, 5% per tahun, 2 tahun ⇒ 4.000.000 × 1,1025 = Rp4.410.000."
  - type: math
    slide: 0
    name: FV
    expression: PV(1 + i)ⁿ
    highlight: true
  - type: heading
    slide: 1
    text: Nilai kini
  - type: text
    slide: 1
    text: "**Nilai kini** (present value) menjawab: berapa yang perlu ditabung sekarang? **PV = FV / (1 + i)ⁿ**."
  - type: text
    slide: 1
    text: "Contoh: ingin Rp12.100.000 dalam 2 tahun dengan bunga 10% ⇒ PV = 12.100.000 / 1,21 = Rp10.000.000."
  - type: math
    slide: 1
    name: PV
    expression: FV / (1 + i)ⁿ
    highlight: true
  - type: tip
    slide: 1
    text: Nilai kini selalu lebih kecil dari nilai mendatang bila bunganya positif.
