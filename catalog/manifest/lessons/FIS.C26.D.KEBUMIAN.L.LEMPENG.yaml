    text: Tiga jenis batas lempeng
  - type: text
    slide: 0
    text: "**Divergen**: lempeng saling menjauh (punggung tengah samudra). **Konvergen**: lempeng saling mendekat dan bertumbukan, membentuk pegunungan, palung, dan gunung api. **Transform**: lempeng saling bergeser."
  - type: text
    slide: 0
    text: Pada batas konvergen, lempeng samudra dapat menunjam ke bawah lempeng lain (subduksi).
