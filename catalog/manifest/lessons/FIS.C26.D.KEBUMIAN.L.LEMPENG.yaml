    text: Indonesia di pertemuan lempeng
  - type: text
    slide: 1
    text: Indonesia berada di pertemuan Lempeng Eurasia, Indo-Australia, dan Pasifik.
  - type: text
    slide: 1
    text: Akibatnya banyak gunung api dan gempa, tetapi juga tanah yang subur dan kaya mineral.
  - type: math
