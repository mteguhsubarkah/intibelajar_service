blocks:
  - type: heading
    slide: 0
    text: Bentuk umum
  - type: text
    slide: 0
    text: Jika dijabarkan, persamaan lingkaran menjadi **x² + y² + Ax + By + C = 0**.
  - type: text
    slide: 0
    text: Pusatnya (−A/2, −B/2) dan jari-jarinya r = √(A²/4 + B²/4 − C). Lingkaran nyata hanya ada bila nilai di bawah akar positif.
  - type: math
    slide: 0
    name: pusat
    expression: (−A/2, −B/2)
    highlight: true
  - type: math
    slide: 0
    name: jari-jari
    expression: √(A²/4 + B²/4 − C)
  - type: heading
    slide: 1
    text: Melengkapkan kuadrat
  - type: text
    slide: 1
    text: "Cara lain: kelompokkan x dan y, lalu lengkapkan kuadrat. x² + y² − 6x + 4y − 3 = 0 menjadi (x − 3)² + (y + 2)² = 16."
  - type: text
    slide: 1
    text: Dari bentuk itu langsung terbaca pusat (3, −2) dan r = 4.
  - type: math
    slide: 1
    name: contoh
    expression: (x − 3)² + (y + 2)² = 16
    highlight: true
  - type: tip
    slide: 1
    text: Koefisien x² dan y² harus 1; jika belum, bagi dulu seluruh persamaan.
