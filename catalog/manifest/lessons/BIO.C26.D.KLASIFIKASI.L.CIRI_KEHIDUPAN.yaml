    text: Ciri makhluk hidup
  - type: text
    slide: 0
    text: Makhluk hidup bernapas, bergerak, memerlukan nutrisi, tumbuh dan berkembang, berkembang biak, peka terhadap rangsang, mengeluarkan zat sisa, dan beradaptasi.
  - type: math
    slide: 0
    name: iritabilitas
    expression: peka terhadap rangsang
    highlight: true
  - type: heading
    slide: 1
    text: Hidup atau tidak hidup?
  - type: text
    slide: 1
    text: Benda tak hidup bisa menunjukkan satu ciri, misalnya mobil bergerak atau api membesar, tetapi makhluk hidup memiliki semua ciri tersebut.
  - type: text
    slide: 1
    text: "Tumbuhan juga bergerak, walaupun lambat: daun putri malu menutup saat disentuh."
  - type: math
    slide: 1
    name: makhluk hidup
    expression: memiliki semua ciri kehidupan
    highlight: true
  - type: tip
    slide: 1
    text: Satu ciri saja tidak cukup untuk menyebut sesuatu hidup.
