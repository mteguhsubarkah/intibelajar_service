blocks:
  - type: heading
    slide: 0
    text: Sel surya
  - type: text
    slide: 0
    text: "**Sel surya** (fotovoltaik) mengubah energi cahaya langsung menjadi energi listrik arus searah. Beberapa sel disusun menjadi panel surya."
  - type: text
    slide: 0
    text: Daya keluarannya bergantung pada intensitas cahaya, luas panel, dan **efisiensi** panel.
  - type: math
    slide: 0
    name: daya keluaran
    expression: P = efisiensi × intensitas × luas
    highlight: true
  - type: heading
    slide: 1
    text: Menghitung dan menilai
  - type: text
    slide: 1
    text: "Contoh: panel seluas 2 m² menerima 1.000 W/m² dengan efisiensi 20%. Daya listriknya 0,20 × 1.000 × 2 = 400 W."
  - type: text
    slide: 1
    text: "Kelebihan: bersih dan cocok untuk Indonesia yang tropis. Keterbatasan: tidak menghasilkan listrik di malam hari, sehingga perlu baterai atau jaringan listrik."
  - type: tip
    slide: 1
    text: Efisiensi panel surya umumnya sekitar 15–22%.
