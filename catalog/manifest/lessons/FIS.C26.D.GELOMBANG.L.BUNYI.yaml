blocks:
  - type: heading
    slide: 0
    text: Bunyi
  - type: text
    slide: 0
    text: Bunyi adalah gelombang longitudinal yang memerlukan medium, sehingga tidak dapat merambat di ruang hampa.
  - type: text
    slide: 0
    text: Tinggi nada ditentukan frekuensi; kuat bunyi ditentukan amplitudo. Telinga manusia mendengar 20–20.000 Hz (audiosonik); di bawahnya infrasonik, di atasnya ultrasonik.
  - type: math
    slide: 0
    name: audiosonik
    expression: 20 – 20.000 Hz
    highlight: true
  - type: heading
    slide: 1
    text: Pantulan bunyi
  - type: text
    slide: 1
    text: Bunyi pantul dapat memperkuat bunyi asli (pantulan dari dinding dekat), menimbulkan gaung (sebagian bersamaan dengan bunyi asli), atau gema (terdengar jelas setelah bunyi asli selesai).
  - type: text
    slide: 1
    text: Sonar dan USG memanfaatkan pantulan bunyi ultrasonik untuk mengukur jarak atau melihat bagian dalam tubuh.
  - type: math
    slide: 1
    name: kedalaman sonar
    expression: d = v × t / 2
    highlight: true
  - type: tip
    slide: 1
    text: Waktu sonar dibagi 2 karena bunyi berangkat lalu kembali.
