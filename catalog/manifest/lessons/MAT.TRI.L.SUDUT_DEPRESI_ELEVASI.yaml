    text: Sudut dibaca dari garis horizontal
  - type: text
    slide: 0
    text: Sudut **elevasi** dihitung dari garis horizontal **ke atas**. Sudut **depresi** dihitung dari garis horizontal **ke bawah**.
  - type: text
    slide: 0
    text: Patokannya selalu garis horizontal — bukan tembok, bukan tanah.
  - type: math
    slide: 0
    name: Elevasi
    expression: horizontal → atas
  - type: math
    slide: 0
    name: Depresi
    expression: horizontal → bawah
  - type: heading
    slide: 1
    text: Contoh dari puncak menara
  - type: text
    slide: 1
    text: Pengamat di puncak menara melihat mobil dengan sudut depresi **30°**.
  - type: text
    slide: 1
    text: Tarik garis horizontal dari posisi pengamat. Sudut 30° diukur dari garis itu, **bukan dari tembok menara**.
  - type: math
    slide: 1
    name: Depresi dari atas
    expression: = elevasi dari bawah
    highlight: true
