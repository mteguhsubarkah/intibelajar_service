blocks:
  - type: heading
    slide: 0
    text: Pipa organa
  - type: text
    slide: 0
    text: "Pipa **terbuka** (kedua ujung terbuka): fₙ = n · v / 2L. Pipa **tertutup**: f = (2n − 1) · v / 4L, hanya harmonik ganjil."
  - type: text
    slide: 0
    text: "Contoh: pipa terbuka 50 cm, v = 340 m/s ⇒ nada dasar 340 Hz."
  - type: math
    slide: 0
    name: terbuka
    expression: f₁ = v / 2L
    highlight: true
  - type: math
    slide: 0
    name: tertutup
    expression: f₁ = v / 4L
  - type: heading
    slide: 1
    text: Lensa
  - type: text
    slide: 1
    text: "Persamaan lensa: **1/f = 1/s + 1/s′**. Lensa cembung f positif. s′ positif berarti bayangan nyata di belakang lensa."
  - type: text
    slide: 1
    text: "Contoh: s = 30 cm, f = 20 cm ⇒ s′ = 60 cm."
  - type: math
    slide: 1
    name: 1/f
    expression: 1/s + 1/s′
    highlight: true
  - type: math
    slide: 1
    name: perbesaran
    expression: M = s′ / s
  - type: tip
    slide: 1
    text: Pakai satuan yang sama (cm) untuk s, s′, dan f.
