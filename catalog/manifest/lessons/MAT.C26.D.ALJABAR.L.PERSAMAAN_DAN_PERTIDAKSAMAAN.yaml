blocks:
  - type: heading
    slide: 0
    text: Persamaan dan pertidaksamaan
  - type: text
    slide: 0
    text: "**Persamaan** memakai tanda =, penyelesaiannya satu nilai: x + 4 = 9, jadi x = 5."
  - type: text
    slide: 0
    text: "**Pertidaksamaan** memakai <, >, ≤, atau ≥, penyelesaiannya sekumpulan nilai: x + 4 > 9, jadi x > 5."
  - type: math
    slide: 0
    name: persamaan
    expression: x + 4 = 9 → x = 5
    highlight: true
  - type: math
    slide: 0
    name: pertidaksamaan
    expression: x + 4 > 9 → x > 5
  - type: heading
    slide: 1
    text: Hati-hati dengan tanda
  - type: text
    slide: 1
    text: Menambah atau mengurangi kedua ruas tidak mengubah tanda pertidaksamaan.
  - type: text
    slide: 1
    text: "Tetapi saat kedua ruas **dikali atau dibagi bilangan negatif**, tandanya dibalik: −2x < 6 menjadi x > −3."
  - type: math
    slide: 1
    name: bagi dengan negatif
    expression: balik tanda pertidaksamaan
    highlight: true
  - type: tip
    slide: 1
    text: Cek jawabanmu dengan satu angka dari himpunan penyelesaian.
