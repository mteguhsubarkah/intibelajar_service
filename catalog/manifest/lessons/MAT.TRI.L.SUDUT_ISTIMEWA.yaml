schemaVersion: 1
code: MAT.TRI.L.SUDUT_ISTIMEWA
title: Sudut Istimewa
estimatedMinutes: 6
aliases:
  - ns: ROUTE
    value: sudut-istimewa
concepts:
  - MAT.TRI.SUDUT_ISTIMEWA
blocks:
  - type: heading
    slide: 0
    text: Asal sudut 30° dan 60°
  - type: text
    slide: 0
    text: Sudut **30°, 45°, dan 60°** disebut sudut istimewa. Nilai sin, cos, dan tan-nya bisa dicari tanpa kalkulator.
  - type: text
    slide: 0
    text: Ambil segitiga sama sisi yang sisinya 2. Potong tepat di tengah. Separuhnya adalah segitiga siku-siku dengan sudut **30°** dan **60°**.
  - type: text
    slide: 0
    text: Sisi miringnya tetap **2**. Alasnya jadi **1**, separuh dari 2. Tingginya **√3**.
  - type: figure
    slide: 0
    figureRef: sama-sisi
  - type: heading
    slide: 1
    text: Baca nilainya dari sudut 30°
  - type: text
    slide: 1
    text: Berdiri di sudut 30°. Sisi depan **1**, sisi samping **√3**, sisi miring **2**.
  - type: text
    slide: 1
    text: "Masukkan ke rumus: **sin = depan / miring**, **cos = samping / miring**, **tan = depan / samping**."
  - type: text
    slide: 1
    text: Untuk 60°, pakai segitiga yang sama, tapi berdiri di sudut 60°. Depan dan samping bertukar.
  - type: figure
    slide: 1
    figureRef: tri-3060
  - type: math
    slide: 1
    name: sin 30°
    expression: 1/2
  - type: math
    slide: 1
    name: cos 30°
    expression: √3/2
  - type: math
    slide: 1
    name: tan 30°
    expression: 1/√3 = √3/3
    highlight: true
  - type: math
    slide: 1
    name: sin 60°
    expression: √3/2
  - type: heading
    slide: 2
    text: Asal sudut 45°
  - type: text
    slide: 2
    text: Ambil persegi yang sisinya 1. Potong menurut diagonalnya. Separuhnya adalah segitiga siku-siku dengan dua sudut **45°**.
  - type: text
    slide: 2
    text: "Dua sisi tegaknya sama: **1** dan **1**. Sisi miringnya **√2**."
  - type: text
    slide: 2
    text: Depan dan samping sama panjang, jadi **tan 45° = 1/1 = 1**.
  - type: figure
    slide: 2
    figureRef: persegi
  - type: math
    slide: 2
    name: sin 45°
    expression: 1/√2 = √2/2
  - type: math
    slide: 2
    name: cos 45°
    expression: 1/√2 = √2/2
  - type: math
    slide: 2
    name: tan 45°
    expression: "1"
    highlight: true
  - type: heading
    slide: 3
    text: Lupa? Pakai pola ini
  - type: text
    slide: 3
    text: Tulis angka **0, 1, 2, 3, 4** untuk sudut 0°, 30°, 45°, 60°, 90°.
  - type: text
    slide: 3
    text: "Akarkan, lalu bagi 2. Hasilnya nilai **sin**: √0/2, √1/2, √2/2, √3/2, √4/2. Artinya 0, 1/2, √2/2, √3/2, 1."
  - type: text
    slide: 3
    text: Nilai **cos** sama, tapi urutannya dibalik.
  - type: figure
    slide: 3
    figureRef: pola
