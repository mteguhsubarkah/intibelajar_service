blocks:
  - type: heading
    slide: 0
    text: Lima kingdom (Whittaker)
  - type: text
    slide: 0
    text: "**Monera** (prokariota, misalnya bakteri), **Protista** (eukariota sederhana, misalnya amoeba dan alga), **Fungi** (jamur, heterotrof, dinding sel kitin), **Plantae** (berfotosintesis), dan **Animalia** (heterotrof, tanpa dinding sel)."
  - type: text
    slide: 0
    text: "Dasar pengelompokannya: ada tidaknya membran inti, jumlah sel, dan cara memperoleh makanan."
  - type: heading
    slide: 1
    text: Tiga domain (Woese)
  - type: text
    slide: 1
    text: "Berdasarkan RNA ribosom, makhluk hidup dibagi menjadi tiga domain: **Bacteria**, **Archaea**, dan **Eukarya**."
  - type: text
    slide: 1
    text: Archaea sering hidup di lingkungan ekstrem seperti sumber air panas, dan secara molekuler lebih dekat dengan Eukarya daripada dengan Bacteria.
  - type: tip
    slide: 1
    text: Sistem klasifikasi berubah seiring bertambahnya data, terutama data molekuler.
