blocks:
  - type: heading
    slide: 0
    text: Translasi
  - type: text
    slide: 0
    text: "**Translasi** (pergeseran) oleh T = (a, b) memindahkan setiap titik (x, y) ke (x + a, y + b). Bentuk dan ukuran bangun tidak berubah."
  - type: text
    slide: 0
    text: "Dalam bentuk vektor kolom: bayangan = titik + vektor translasi."
  - type: math
    slide: 0
    name: translasi
    expression: (x, y) → (x + a, y + b)
    highlight: true
  - type: heading
    slide: 1
    text: Refleksi
  - type: text
    slide: 1
    text: "**Refleksi** (pencerminan) membalik bangun terhadap garis cermin. Terhadap sumbu x: (x, y) → (x, −y); terhadap sumbu y: (x, y) → (−x, y)."
  - type: text
    slide: 1
    text: "Terhadap garis y = x: (x, y) → (y, x); terhadap garis y = −x: (x, y) → (−y, −x)."
  - type: math
    slide: 1
    name: cermin y = x
    expression: (x, y) → (y, x)
    highlight: true
  - type: math
    slide: 1
    name: matriks cermin sumbu x
    expression: "[[1, 0], [0, −1]]"
  - type: tip
    slide: 1
    text: Jarak titik ke cermin sama dengan jarak bayangannya ke cermin.
