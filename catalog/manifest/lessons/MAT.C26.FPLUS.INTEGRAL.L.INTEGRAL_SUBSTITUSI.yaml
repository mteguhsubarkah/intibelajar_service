blocks:
  - type: heading
    slide: 0
    text: Ide substitusi
  - type: text
    slide: 0
    text: Jika integran memuat suatu fungsi dan turunannya, misalkan **u = g(x)** sehingga du = g′(x) dx.
  - type: text
    slide: 0
    text: "Contoh: ∫2x(x² + 1)³ dx. Misalkan u = x² + 1 dan du = 2x dx, sehingga integralnya ∫u³ du = u⁴/4 + C = (x² + 1)⁴/4 + C."
  - type: math
    slide: 0
    name: substitusi
    expression: u = g(x), du = g′(x) dx
    highlight: true
  - type: heading
    slide: 1
    text: Menyesuaikan konstanta
  - type: text
    slide: 1
    text: "Jika turunannya hanya berbeda konstanta, sesuaikan. Pada ∫x√(x² + 3) dx dengan u = x² + 3: du = 2x dx, jadi x dx = ½ du."
  - type: text
    slide: 1
    text: Hasilnya ½ ∫u^(1/2) du = ⅓(x² + 3)^(3/2) + C. Selalu kembalikan ke variabel x di akhir.
  - type: math
    slide: 1
    name: contoh
    expression: ∫x√(x² + 3) dx = ⅓(x² + 3)^(3/2) + C
    highlight: true
  - type: tip
    slide: 1
    text: Periksa hasil integral dengan menurunkannya kembali.
