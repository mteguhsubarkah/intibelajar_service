blocks:
  - type: heading
    slide: 0
    text: Rumus umum
  - type: text
    slide: 0
    text: Jika **sin x = sin α**, maka x = α + k · 360° atau x = (180° − α) + k · 360°.
  - type: text
    slide: 0
    text: Jika **cos x = cos α**, maka x = ±α + k · 360°. Jika **tan x = tan α**, maka x = α + k · 180°.
  - type: math
    slide: 0
    name: sin x = sin α
    expression: x = α atau 180° − α (+ k · 360°)
    highlight: true
  - type: math
    slide: 0
    name: cos x = cos α
    expression: x = ±α (+ k · 360°)
  - type: math
    slide: 0
    name: tan x = tan α
    expression: x = α (+ k · 180°)
  - type: heading
    slide: 1
    text: Langkah menyelesaikan
  - type: text
    slide: 1
    text: 1) Ubah nilainya menjadi sudut acuan, misalnya sin x = ½ memberi sudut acuan 30°. 2) Tentukan kuadran yang sesuai dengan tandanya. 3) Tulis sudut di setiap kuadran itu. 4) Ambil hanya yang berada di interval soal.
  - type: text
    slide: 1
    text: "Contoh: cos x = ½ untuk 0° ≤ x ≤ 360° memberi x = 60° atau x = 300°."
  - type: math
    slide: 1
    name: cos x = ½
    expression: x = 60° atau 300°
    highlight: true
  - type: tip
    slide: 1
    text: Satu nilai sinus atau cosinus biasanya punya dua jawaban dalam satu putaran. Jangan berhenti di jawaban pertama.
