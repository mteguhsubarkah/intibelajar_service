    text: Sel hewan dan tumbuhan
  - type: text
    slide: 1
    text: "Hanya sel tumbuhan: **dinding sel**, **kloroplas**, **vakuola besar**. Hanya sel hewan: **sentriol** dan lisosom yang menonjol."
