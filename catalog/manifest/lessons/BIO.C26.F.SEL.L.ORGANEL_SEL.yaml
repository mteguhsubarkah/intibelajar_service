    text: Fungsi organel
  - type: text
    slide: 0
    text: "**Mitokondria**: respirasi sel, menghasilkan ATP. **Ribosom**: sintesis protein. **Retikulum endoplasma**: transpor dan sintesis. **Badan Golgi**: sekresi. **Lisosom**: pencernaan intrasel. **Nukleus**: pengendali sel."
