blocks:
  - type: heading
    slide: 0
    text: Torsi = gaya × lengan
  - type: text
    slide: 0
    text: "Torsi (momen gaya) membuat benda berputar: **τ = F · r · sin θ**. Jika gaya tegak lurus lengan, τ = F · r."
  - type: text
    slide: 0
    text: "Contoh: 10 N tegak lurus kunci inggris 0,2 m ⇒ τ = 2 N·m."
  - type: math
    slide: 0
    name: τ
    expression: F · r · sin θ
    highlight: true
  - type: heading
    slide: 1
    text: Syarat seimbang
  - type: text
    slide: 1
    text: Benda seimbang bila **ΣF = 0** dan **Στ = 0** terhadap titik mana pun.
  - type: text
    slide: 1
    text: "Jungkat-jungkit: m₁ · r₁ = m₂ · r₂. Contoh: 30 kg pada 2 m seimbang dengan 40 kg pada 1,5 m."
  - type: math
    slide: 1
    name: seimbang
    expression: ΣF = 0 dan Στ = 0
    highlight: true
  - type: tip
    slide: 1
    text: Pilih poros di titik yang gayanya tidak diketahui agar torsinya nol.
