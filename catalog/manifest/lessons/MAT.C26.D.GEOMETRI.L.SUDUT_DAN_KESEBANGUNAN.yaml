    text: Hubungan antarsudut
  - type: text
    slide: 0
    text: Sudut **berpelurus** jumlahnya 180°; sudut **berpenyiku** jumlahnya 90°.
  - type: text
    slide: 0
    text: "Dua garis sejajar dipotong garis lain: sudut sehadap sama besar, sudut dalam berseberangan sama besar."
  - type: math
    slide: 0
    name: berpelurus
    expression: a + b = 180°
    highlight: true
  - type: math
    slide: 0
    name: berpenyiku
    expression: a + b = 90°
  - type: heading
    slide: 1
    text: Bangun yang sebangun
  - type: text
    slide: 1
    text: Dua bangun **sebangun** jika sudut-sudut yang bersesuaian sama besar dan sisi-sisi yang bersesuaian sebanding.
  - type: text
    slide: 1
    text: Foto 4 cm × 6 cm yang diperbesar menjadi 8 cm × 12 cm sebangun dengan faktor skala 2.
  - type: math
    slide: 1
    name: sebangun
    expression: a/a′ = b/b′ = c/c′
    highlight: true
  - type: tip
    slide: 1
    text: Pasangkan sisi yang berhadapan dengan sudut yang sama besar.
