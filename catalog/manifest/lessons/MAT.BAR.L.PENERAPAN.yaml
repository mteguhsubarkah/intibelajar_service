    text: Aritmetika atau geometri?
  - type: text
    slide: 0
    text: Bertambah **jumlah tetap** (Rp50.000 per bulan, 15 unit per bulan) ⇒ aritmetika. Bertambah **persentase tetap** (10% per tahun) ⇒ geometri.
