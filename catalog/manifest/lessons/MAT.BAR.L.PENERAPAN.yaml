  - type: heading
    slide: 1
    text: Total atau satu waktu?
  - type: text
    slide: 1
    text: '"Produksi bulan ke-12" menanyakan **suku** Uₙ. "Total produksi selama setahun" menanyakan **jumlah** Sₙ.'
  - type: text
    slide: 1
    text: "Contoh: 120 unit bulan pertama, naik 15 per bulan: S₁₂ = 6 × (240 + 165) = 2.430."
  - type: math
    slide: 1
    name: S₁₂
    expression: 6(2a + 11b)
    highlight: true
  - type: tip
    slide: 1
    text: Garis bawahi kata "selama" (jumlah) dan "pada" (suku).
