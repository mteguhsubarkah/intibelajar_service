blocks:
  - type: heading
    slide: 0
    text: Siapa yang habis duluan?
  - type: text
    slide: 0
    text: Bagi mol setiap pereaksi dengan koefisiennya. **Hasil bagi terkecil = pereaksi pembatas** (habis), yang lain bersisa.
  - type: text
    slide: 0
    text: "Contoh: 2H₂ + O₂ → 2H₂O dengan 2 mol H₂ dan 2 mol O₂: H₂ → 2/2 = 1, O₂ → 2/1 = 2. H₂ pembatas."
  - type: math
    slide: 0
    name: pembatas
    expression: mol/koefisien terkecil
    highlight: true
  - type: heading
    slide: 1
    text: Hitung hasil dari pembatas
  - type: text
    slide: 1
    text: "Semua produk dihitung dari pereaksi pembatas. Dari contoh tadi: H₂O = 2 mol, O₂ terpakai 1 mol, sisa O₂ 1 mol."
  - type: math
    slide: 1
    name: produk
    expression: dari pereaksi pembatas
    highlight: true
  - type: tip
    slide: 1
    text: Tabel mula–reaksi–sisa (MRS) membantu agar tidak salah hitung.
