blocks:
  - type: heading
    slide: 0
    text: "Zat tunggal: unsur dan senyawa"
  - type: text
    slide: 0
    text: "**Unsur** adalah zat tunggal yang tidak dapat diuraikan lagi secara kimia, misalnya besi (Fe) dan oksigen (O₂)."
  - type: text
    slide: 0
    text: "**Senyawa** adalah gabungan dua unsur atau lebih dengan perbandingan tetap, misalnya air (H₂O) dan garam dapur (NaCl). Sifat senyawa berbeda dari sifat unsur penyusunnya."
  - type: math
    slide: 0
    name: air
    expression: H₂O
    highlight: true
  - type: math
    slide: 0
    name: garam dapur
    expression: NaCl
  - type: heading
    slide: 1
    text: Campuran
  - type: text
    slide: 1
    text: Campuran tersusun dari beberapa zat tanpa perbandingan tetap, dan sifat zat penyusunnya masih ada.
  - type: text
    slide: 1
    text: "**Homogen**: tampak menyatu (larutan gula, udara). **Heterogen**: komponennya masih terlihat (pasir dan air, salad buah)."
  - type: math
    slide: 1
    name: campuran
    expression: komposisi berubah-ubah
    highlight: true
  - type: tip
    slide: 1
    text: Rumus kimianya tetap → senyawa. Komposisinya bisa berubah-ubah → campuran.
