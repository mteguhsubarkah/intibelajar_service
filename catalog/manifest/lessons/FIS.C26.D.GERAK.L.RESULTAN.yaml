blocks:
  - type: heading
    slide: 0
    text: Resultan gaya
  - type: text
    slide: 0
    text: Gaya yang searah dijumlahkan; gaya yang berlawanan dikurangkan.
  - type: text
    slide: 0
    text: Tarik tambang 300 N ke kanan dan 250 N ke kiri menghasilkan resultan 50 N ke kanan. Jika resultannya nol, benda diam atau bergerak lurus beraturan.
  - type: math
    slide: 0
    name: gaya searah
    expression: R = F₁ + F₂
    highlight: true
  - type: math
    slide: 0
    name: gaya berlawanan
    expression: R = F₁ − F₂
  - type: heading
    slide: 1
    text: Inersia dan hukum Newton
  - type: text
    slide: 1
    text: "**Hukum I Newton**: benda cenderung mempertahankan keadaannya (inersia). Saat bus mengerem mendadak, penumpang terdorong ke depan."
  - type: text
    slide: 1
    text: "**Hukum II Newton**: percepatan sebanding dengan resultan gaya dan berbanding terbalik dengan massa."
  - type: math
    slide: 1
    name: hukum II Newton
    expression: a = ΣF / m
    highlight: true
  - type: tip
    slide: 1
    text: Sabuk pengaman melawan efek inersia saat kendaraan berhenti mendadak.
