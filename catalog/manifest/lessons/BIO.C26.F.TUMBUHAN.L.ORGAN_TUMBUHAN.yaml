blocks:
  - type: heading
    slide: 0
    text: Akar, batang, daun
  - type: text
    slide: 0
    text: "**Akar** menyerap air dan mineral serta menambatkan tumbuhan. Rambut akar memperluas permukaan penyerapan."
  - type: text
    slide: 0
    text: "**Batang** menyangga tubuh dan menjadi jalur pengangkutan; **daun** adalah tempat utama fotosintesis dan penguapan."
  - type: heading
    slide: 1
    text: Struktur daun
  - type: text
    slide: 1
    text: Daun tersusun atas epidermis atas dan bawah, **jaringan palisade** (banyak kloroplas), **jaringan bunga karang** (banyak ruang antarsel), serta tulang daun berisi xilem dan floem.
  - type: text
    slide: 1
    text: Stomata umumnya lebih banyak di epidermis bawah dan dijaga sel penjaga yang mengatur bukaannya.
  - type: tip
    slide: 1
    text: Bunga, buah, dan biji adalah organ reproduksi generatif tumbuhan.
