blocks:
  - type: heading
    slide: 0
    text: Suhu dan termometer
  - type: text
    slide: 0
    text: "Suhu menyatakan derajat panas suatu benda. Skala Kelvin: K = °C + 273."
  - type: text
    slide: 0
    text: Pada tekanan 1 atm, air membeku pada 0 °C (273 K) dan mendidih pada 100 °C (373 K).
  - type: math
    slide: 0
    name: Celsius ke Kelvin
    expression: K = °C + 273
    highlight: true
  - type: heading
    slide: 1
    text: Tiga cara perpindahan kalor
  - type: text
    slide: 1
    text: "**Konduksi**: kalor merambat melalui zat tanpa zatnya berpindah (sendok yang ujungnya panas)."
  - type: text
    slide: 1
    text: "**Konveksi**: kalor berpindah bersama aliran zat (air mendidih, angin laut). **Radiasi**: tanpa medium (panas Matahari)."
  - type: math
    slide: 1
    name: konduksi
    expression: merambat
    highlight: true
  - type: math
    slide: 1
    name: konveksi
    expression: mengalir
  - type: math
    slide: 1
    name: radiasi
    expression: memancar
  - type: tip
    slide: 1
    text: Konduksi menempel, konveksi mengalir, radiasi memancar.
