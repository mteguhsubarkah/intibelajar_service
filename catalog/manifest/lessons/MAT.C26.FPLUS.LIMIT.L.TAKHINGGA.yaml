blocks:
  - type: heading
    slide: 0
    text: Fungsi rasional di tak hingga
  - type: text
    slide: 0
    text: Untuk x → ∞, bagi pembilang dan penyebut dengan pangkat tertinggi penyebut, karena 1/xⁿ → 0.
  - type: text
    slide: 0
    text: "Hasilnya: derajat pembilang < penyebut → 0; derajat sama → perbandingan koefisien utama; derajat pembilang > penyebut → ∞ atau −∞."
  - type: math
    slide: 0
    name: derajat sama
    expression: a/b (koefisien utama)
    highlight: true
  - type: heading
    slide: 1
    text: Selisih akar
  - type: text
    slide: 1
    text: Bentuk √(ax² + bx + c) − √(ax² + qx + r) untuk x → ∞ bernilai **(b − q)/(2√a)**.
  - type: text
    slide: 1
    text: Rumus ini berasal dari perkalian sekawan dan hanya berlaku jika koefisien x² di kedua akar sama.
  - type: math
    slide: 1
    name: selisih akar
    expression: (b − q) / (2√a)
    highlight: true
  - type: tip
    slide: 1
    text: Limit di tak hingga menggambarkan asimtot datar grafik.
