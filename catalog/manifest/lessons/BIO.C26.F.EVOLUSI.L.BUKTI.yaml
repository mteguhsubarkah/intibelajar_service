    text: "**Organ homolog**: asal-usulnya sama, fungsinya bisa berbeda (tangan manusia, sayap kelelawar, sirip paus). **Organ analog**: fungsinya sama, asal-usulnya berbeda (sayap burung dan sayap serangga)."
