  - type: math
    slide: 0
    name: log bⁿ
    expression: n · log b
  - type: heading
    slide: 1
    text: Mengganti basis
  - type: text
    slide: 1
    text: "**ᵃlog b = log b / log a**. Rantai basis saling menghapus: **ᵃlog b · ᵇlog c = ᵃlog c**."
  - type: text
    slide: 1
    text: "Contoh: ²log 9 · ³log 16 = 2 · ²log 3 · 4 · ³log 2 = 8."
  - type: math
    slide: 1
    name: ᵃlog b
    expression: log b / log a
    highlight: true
  - type: math
    slide: 1
    name: ᵃlog b · ᵇlog c
    expression: ᵃlog c
  - type: tip
    slide: 1
    text: Gabungkan semua suku menjadi satu logaritma dulu, baru hitung.
