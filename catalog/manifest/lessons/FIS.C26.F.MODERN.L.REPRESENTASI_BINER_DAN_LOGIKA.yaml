    text: Bilangan biner
  - type: text
    slide: 0
    text: "Komputer menyimpan data dengan dua keadaan: 0 dan 1. Nilai posisi biner dari kanan: 1, 2, 4, 8, 16, …"
  - type: text
    slide: 0
    text: "Contoh: 1011₂ = 8 + 0 + 2 + 1 = 11."
