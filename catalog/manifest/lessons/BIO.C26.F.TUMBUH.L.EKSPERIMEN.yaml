    text: "Contoh pertanyaan: apakah intensitas cahaya memengaruhi tinggi kecambah?"
  - type: text
    slide: 0
    text: "**Variabel bebas**: yang sengaja diubah (intensitas cahaya). **Variabel terikat**: yang diukur (tinggi kecambah). **Variabel kontrol**: yang dibuat sama (jenis biji, air, media, suhu, lama pengamatan)."
