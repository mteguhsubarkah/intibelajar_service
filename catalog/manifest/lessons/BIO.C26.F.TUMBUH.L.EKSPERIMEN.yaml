    text: Membaca data pertumbuhan
  - type: text
    slide: 1
    text: Ukur pada waktu yang sama setiap hari, pakai beberapa biji untuk tiap perlakuan, lalu hitung rata-ratanya.
  - type: text
    slide: 1
    text: "Kurva pertumbuhan umumnya berbentuk S (sigmoid): lambat di awal, cepat di tengah, lalu melambat dan konstan."
  - type: math
    slide: 1
