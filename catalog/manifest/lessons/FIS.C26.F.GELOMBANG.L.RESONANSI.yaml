blocks:
  - type: heading
    slide: 0
    text: Pipa organa
  - type: text
    slide: 0
    text: "Pipa **terbuka** (kedua ujung terbuka): fₙ = n · v / 2L. Pipa **tertutup**: f = (2n − 1) · v / 4L, hanya harmonik ganjil."
  - type: text
    slide: 0
    text: "Contoh: pipa terbuka 50 cm, v = 340 m/s ⇒ nada dasar 340 Hz."
  - type: math
    slide: 0
    name: terbuka
    expression: f₁ = v / 2L
    highlight: true
  - type: math
    slide: 0
    name: tertutup
    expression: f₁ = v / 4L
  - type: heading
    slide: 1
    text: Dawai dan resonansi
  - type: text
    slide: 1
    text: Dawai yang kedua ujungnya terikat bergetar dengan **fₙ = n · v / 2L**. Senar yang ditegangkan lebih kencang membuat v lebih besar sehingga nadanya lebih tinggi.
  - type: text
    slide: 1
    text: "**Resonansi**: benda ikut bergetar bila frekuensi alaminya sama dengan frekuensi sumber. Kolom udara di atas air beresonansi dengan garpu tala saat panjangnya L = λ/4, 3λ/4, 5λ/4, …"
  - type: math
    slide: 1
    name: dawai
    expression: fₙ = n · v / 2L
    highlight: true
  - type: math
    slide: 1
    name: resonansi kolom udara
    expression: L = (2n − 1) · λ / 4
  - type: tip
    slide: 1
    text: Resonansi pertama kolom udara terjadi pada seperempat panjang gelombang.
