    text: Baris kali kolom
  - type: text
    slide: 0
    text: Elemen baris i kolom j dari AB = **baris i dari A dikali kolom j dari B** (kalikan pasangan lalu jumlahkan).
  - type: text
    slide: 0
    text: "Contoh: [1 2; 3 4] · [2; 1] = [1·2 + 2·1; 3·2 + 4·1] = [4; 10]."
  - type: math
    slide: 0
    name: (AB)ᵢⱼ
    expression: baris i · kolom j
    highlight: true
  - type: heading
    slide: 1
    text: Syarat dan ordo hasil
  - type: text
    slide: 1
    text: AB terdefinisi jika **kolom A = baris B**. Ordo (m × n)(n × p) menghasilkan **m × p**.
  - type: text
    slide: 1
    text: Umumnya **AB ≠ BA**.
  - type: math
    slide: 1
    name: (m × n)(n × p)
    expression: m × p
    highlight: true
  - type: tip
    slide: 1
    text: "Tulis ordo kedua matriks berdampingan: angka tengah harus sama."
