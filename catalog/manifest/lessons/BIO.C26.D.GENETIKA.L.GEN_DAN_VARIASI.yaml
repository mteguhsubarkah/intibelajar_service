    text: Gen, DNA, dan kromosom
  - type: text
    slide: 0
    text: Sifat diturunkan dari orang tua melalui **gen**. Gen adalah bagian DNA yang terdapat pada kromosom di dalam inti sel.
  - type: text
    slide: 0
    text: Sel tubuh manusia memiliki 46 kromosom (23 pasang).
  - type: math
    slide: 0
    name: manusia
