    highlight: true
  - type: heading
    slide: 1
    text: Variasi
  - type: text
    slide: 1
    text: Variasi adalah perbedaan sifat di antara individu sejenis, seperti warna kulit, golongan darah, dan bentuk rambut.
  - type: text
    slide: 1
    text: "Sumbernya: gen dari kedua orang tua dan pengaruh lingkungan."
  - type: math
    slide: 1
    name: variasi
    expression: gen + lingkungan
    highlight: true
  - type: tip
    slide: 1
    text: Golongan darah ditentukan gen; berat badan dipengaruhi gen dan lingkungan.
