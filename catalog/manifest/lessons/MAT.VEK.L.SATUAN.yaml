    text: "**i, j, k** adalah vektor satuan pada sumbu x, y, z. Setiap vektor bisa ditulis sebagai kombinasi ketiganya."
  - type: text
    slide: 1
    text: "Contoh: a = i + 2j + 2k, |a| = 3 ⇒ â = (1/3)(i + 2j + 2k)."
