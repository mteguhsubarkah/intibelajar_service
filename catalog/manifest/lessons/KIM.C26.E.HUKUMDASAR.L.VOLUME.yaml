blocks:
  - type: heading
    slide: 0
    text: Hukum Gay-Lussac
  - type: text
    slide: 0
    text: Pada suhu dan tekanan yang sama, perbandingan **volume gas** pereaksi dan hasil reaksi merupakan bilangan bulat sederhana yang sama dengan **perbandingan koefisien** reaksinya.
  - type: text
    slide: 0
    text: "Contoh: N₂ + 3H₂ → 2NH₃. Satu liter N₂ bereaksi dengan 3 liter H₂ menghasilkan 2 liter NH₃."
  - type: math
    slide: 0
    name: Gay-Lussac
    expression: "V₁ : V₂ = koefisien₁ : koefisien₂"
    highlight: true
  - type: heading
    slide: 1
    text: Hipotesis Avogadro
  - type: text
    slide: 1
    text: "**Avogadro**: pada suhu dan tekanan yang sama, gas-gas bervolume sama mengandung jumlah molekul yang sama."
  - type: text
    slide: 1
    text: Jadi perbandingan volume gas = perbandingan jumlah molekul = perbandingan mol.
  - type: tip
    slide: 1
    text: Perbandingan volume hanya berlaku untuk zat berwujud gas.
