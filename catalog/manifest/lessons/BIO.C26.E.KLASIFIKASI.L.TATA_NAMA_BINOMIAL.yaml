blocks:
  - type: heading
    slide: 0
    text: Nama ganda Linnaeus
  - type: text
    slide: 0
    text: "**Carolus Linnaeus** memperkenalkan **tata nama ganda (binomial nomenklatur)**: nama ilmiah terdiri atas dua kata, yaitu nama genus dan penunjuk spesies."
  - type: text
    slide: 0
    text: "Contoh: Oryza sativa (padi) dan Homo sapiens (manusia)."
  - type: heading
    slide: 1
    text: Aturan penulisan
  - type: text
    slide: 1
    text: Huruf pertama nama genus kapital, penunjuk spesies huruf kecil semua, dan seluruh nama dicetak miring atau digarisbawahi terpisah.
  - type: text
    slide: 1
    text: Nama ilmiah memakai bahasa Latin atau yang dilatinkan, sehingga berlaku sama di seluruh dunia.
  - type: tip
    slide: 1
    text: Dua makhluk dengan kata pertama nama ilmiah yang sama berarti satu genus.
