  - type: text
    slide: 1
    text: Terjadi saat Bumi berada di antara Matahari dan Bulan, sehingga Bulan masuk ke bayangan Bumi. Hanya mungkin saat purnama.
  - type: text
    slide: 1
    text: Gerhana tidak terjadi setiap bulan karena orbit Bulan miring sekitar 5° terhadap orbit Bumi.
  - type: math
    slide: 1
