  - type: text
    slide: 0
    text: Terjadi saat Bulan berada di antara Matahari dan Bumi, sehingga bayangan Bulan jatuh ke Bumi.
  - type: text
    slide: 0
    text: Hanya mungkin terjadi pada fase bulan baru. Ada gerhana Matahari total, sebagian, dan cincin.
