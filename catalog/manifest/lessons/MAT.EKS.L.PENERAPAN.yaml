  - type: text
    slide: 1
    text: "Keasaman: **pH = −log [H⁺]**. Skala Richter: naik 1 angka berarti amplitudo gempa **10 kali** lebih besar."
  - type: text
    slide: 1
    text: "Contoh: [H⁺] = 10⁻³ M memberi pH = 3."
  - type: math
    slide: 1
