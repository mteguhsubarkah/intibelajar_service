blocks:
  - type: heading
    slide: 0
    text: Mengapa mengelompokkan?
  - type: text
    slide: 0
    text: Klasifikasi memudahkan kita mengenali dan mempelajari makhluk hidup yang sangat beragam.
  - type: text
    slide: 0
    text: Dasarnya persamaan dan perbedaan ciri, misalnya bertulang belakang atau tidak, berbunga atau tidak, bersel satu atau bersel banyak.
  - type: math
    slide: 0
    name: dasar klasifikasi
    expression: persamaan dan perbedaan ciri
    highlight: true
  - type: heading
    slide: 1
    text: Lima kingdom
  - type: text
    slide: 1
    text: "**Monera** (bakteri, tanpa membran inti), **Protista** (bersel satu bermembran inti, misalnya amoeba dan alga), **Fungi** (jamur), **Plantae** (tumbuhan berklorofil), **Animalia** (hewan)."
  - type: text
    slide: 1
    text: Hewan dibagi menjadi vertebrata (ikan, amfibi, reptil, burung, mamalia) dan invertebrata.
  - type: math
    slide: 1
    name: vertebrata
    expression: bertulang belakang
    highlight: true
  - type: tip
    slide: 1
    text: Mulailah dari ciri yang paling membedakan, lalu ke ciri yang lebih rinci.
