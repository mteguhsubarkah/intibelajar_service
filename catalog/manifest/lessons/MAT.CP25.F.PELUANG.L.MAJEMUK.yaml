blocks:
  - type: heading
    slide: 0
    text: Gabungan kejadian
  - type: text
    slide: 0
    text: "**P(A ∪ B) = P(A) + P(B) − P(A ∩ B)**. Untuk kejadian **saling lepas** (tidak bisa terjadi bersamaan), P(A ∩ B) = 0."
  - type: text
    slide: 0
    text: "Kejadian **saling bebas**: P(A ∩ B) = P(A) × P(B)."
  - type: math
    slide: 0
    name: P(A ∪ B)
    expression: P(A) + P(B) − P(A ∩ B)
    highlight: true
  - type: math
    slide: 0
    name: saling bebas
    expression: P(A ∩ B) = P(A)P(B)
  - type: heading
    slide: 1
    text: Frekuensi harapan
  - type: text
    slide: 1
    text: Jika percobaan dilakukan n kali, kejadian A diharapkan muncul **Fₕ = n × P(A)** kali.
  - type: text
    slide: 1
    text: "Contoh: dadu dilempar 120 kali, mata prima (2, 3, 5) peluangnya 1/2 ⇒ harapan 60 kali."
  - type: math
    slide: 1
    name: Fₕ
    expression: n × P(A)
    highlight: true
  - type: tip
    slide: 1
    text: Untuk dua dadu, buat tabel 6 × 6 supaya tidak ada pasangan yang terlewat.
