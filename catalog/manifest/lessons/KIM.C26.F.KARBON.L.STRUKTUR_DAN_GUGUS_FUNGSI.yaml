    text: Gugus fungsi menentukan sifat
  - type: text
    slide: 0
    text: "**–OH** alkohol, **–O–** eter, **–CHO** aldehida, **–CO–** keton, **–COOH** asam karboksilat, **–COO–** ester."
  - type: text
    slide: 0
    text: "Contoh: CH₃–CH₂–OH adalah etanol (alkohol)."
  - type: math
    slide: 0
    name: –OH
    expression: alkohol
    highlight: true
  - type: math
    slide: 0
    name: –COOH
    expression: asam karboksilat
  - type: heading
    slide: 1
    text: Penamaan alkana bercabang
  - type: text
    slide: 1
    text: Pilih rantai terpanjang, beri nomor dari ujung terdekat cabang, sebut cabang dulu lalu nama rantai induk.
  - type: text
    slide: 1
    text: "Contoh: CH₃–CH(CH₃)–CH₃ = 2-metilpropana."
  - type: math
    slide: 1
    name: CH₃–CH(CH₃)–CH₃
    expression: 2-metilpropana
    highlight: true
  - type: tip
    slide: 1
    text: "Alkana: CₙH₂ₙ₊₂, berakhiran -ana."
