blocks:
  - type: heading
    slide: 0
    text: Bunyi
  - type: text
    slide: 0
    text: Bunyi adalah gelombang longitudinal yang memerlukan medium, sehingga tidak dapat merambat di ruang hampa.
  - type: text
    slide: 0
    text: Tinggi nada ditentukan frekuensi; kuat bunyi ditentukan amplitudo. Telinga manusia mendengar 20–20.000 Hz (audiosonik).
  - type: math
    slide: 0
    name: audiosonik
    expression: 20 – 20.000 Hz
    highlight: true
  - type: heading
    slide: 1
    text: Pantulan bunyi dan alat optik
  - type: text
    slide: 1
    text: "Gema dan sonar memanfaatkan pantulan bunyi: kedalaman = v × t : 2."
  - type: text
    slide: 1
    text: Mata, lup, dan kamera membentuk bayangan dengan lensa. Rabun jauh (miopi) dibantu lensa cekung, rabun dekat (hipermetropi) dibantu lensa cembung.
  - type: math
    slide: 1
    name: kedalaman sonar
    expression: d = v × t / 2
    highlight: true
  - type: tip
    slide: 1
    text: Waktu sonar dibagi 2 karena bunyi berangkat lalu kembali.
