    text: DNA rekombinan
  - type: text
    slide: 0
    text: Gen yang diinginkan dipotong dengan **enzim restriksi**, disisipkan ke **plasmid** bakteri, lalu disambung dengan **enzim ligase**. Bakteri yang membawa plasmid itu memproduksi protein yang diinginkan.
  - type: text
    slide: 0
    text: "Contoh: insulin manusia diproduksi oleh *E. coli*."
