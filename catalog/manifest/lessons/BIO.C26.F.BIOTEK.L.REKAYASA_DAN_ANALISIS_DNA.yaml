    text: Analisis DNA
  - type: text
    slide: 1
    text: Potongan DNA dipisahkan dengan **elektroforesis** menurut ukurannya. Pola pita DNA dipakai untuk tes paternitas dan forensik.
  - type: math
    slide: 1
    name: elektroforesis
