  - type: text
    slide: 0
    text: Air bendungan yang jatuh mengubah **energi potensial** menjadi energi kinetik yang memutar turbin dan generator.
  - type: text
    slide: 0
    text: Daya listriknya P = η · ρ · Q · g · h, dengan Q debit air (m³/s), h tinggi jatuh air, dan η efisiensi pembangkit.
  - type: math
    slide: 0
    name: daya PLTA
    expression: P = η ρ Q g h
    highlight: true
  - type: heading
    slide: 1
    text: PLTB (bayu)
  - type: text
    slide: 1
    text: Angin memutar baling-baling turbin; energi kinetik udara diubah menjadi energi listrik oleh generator.
  - type: text
    slide: 1
    text: Dayanya sebanding dengan **pangkat tiga kecepatan angin**, sehingga angin dua kali lebih kencang memberi daya delapan kali lebih besar.
  - type: math
    slide: 1
    name: daya angin
    expression: P ∝ v³
    highlight: true
  - type: tip
    slide: 1
    text: PLTB Sidrap di Sulawesi Selatan adalah salah satu pembangkit tenaga bayu besar di Indonesia.
