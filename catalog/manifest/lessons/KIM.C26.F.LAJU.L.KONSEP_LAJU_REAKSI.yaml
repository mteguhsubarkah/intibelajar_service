blocks:
  - type: heading
    slide: 0
    text: Pengertian laju reaksi
  - type: text
    slide: 0
    text: "**Laju reaksi** adalah perubahan konsentrasi pereaksi atau hasil reaksi per satuan waktu, biasanya dalam M/s."
  - type: text
    slide: 0
    text: "Laju berkurangnya pereaksi diberi tanda negatif, sedangkan laju bertambahnya produk bertanda positif: v = −Δ[A]/Δt = +Δ[B]/Δt."
  - type: math
    slide: 0
    name: laju
    expression: v = Δ[konsentrasi] / Δt
    highlight: true
  - type: heading
    slide: 1
    text: Hubungan dengan koefisien
  - type: text
    slide: 1
    text: Untuk reaksi N₂ + 3H₂ → 2NH₃, laju berkurangnya H₂ tiga kali laju berkurangnya N₂, dan laju terbentuknya NH₃ dua kali laju berkurangnya N₂.
  - type: text
    slide: 1
    text: Perbandingan laju sama dengan perbandingan koefisien reaksi.
  - type: math
    slide: 1
    name: "N₂ : H₂ : NH₃"
    expression: "1 : 3 : 2"
    highlight: true
  - type: tip
    slide: 1
    text: Konsentrasi molar M = mol zat terlarut per liter larutan.
