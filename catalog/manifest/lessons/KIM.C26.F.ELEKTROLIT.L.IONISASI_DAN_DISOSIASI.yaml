blocks:
  - type: heading
    slide: 0
    text: Dari mana ion dalam larutan
  - type: text
    slide: 0
    text: "Senyawa ion seperti NaCl **terdisosiasi** di dalam air: ion-ionnya terlepas, NaCl → Na⁺ + Cl⁻."
  - type: text
    slide: 0
    text: "Senyawa kovalen polar seperti HCl **terionisasi** saat bereaksi dengan air: HCl → H⁺ + Cl⁻."
  - type: math
    slide: 0
    name: NaCl(aq)
    expression: Na⁺ + Cl⁻
    highlight: true
  - type: math
    slide: 0
    name: HCl(aq)
    expression: H⁺ + Cl⁻
  - type: heading
    slide: 1
    text: Yang tidak menghasilkan ion
  - type: text
    slide: 1
    text: Gula (C₁₂H₂₂O₁₁), urea, dan alkohol larut sebagai molekul utuh, sehingga tidak ada ion yang terbentuk.
  - type: text
    slide: 1
    text: "Saat menulis reaksi ionisasi, hitung jumlah ionnya. Contoh: CaCl₂ → Ca²⁺ + 2Cl⁻ menghasilkan 3 ion."
  - type: math
    slide: 1
    name: CaCl₂
    expression: Ca²⁺ + 2Cl⁻ (3 ion)
    highlight: true
  - type: tip
    slide: 1
    text: Jumlah muatan positif dan negatif hasil ionisasi selalu seimbang.
