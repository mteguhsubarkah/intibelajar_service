blocks:
  - type: heading
    slide: 0
    text: Mengapa diklasifikasikan
  - type: text
    slide: 0
    text: "**Klasifikasi** mengelompokkan makhluk hidup berdasarkan persamaan dan perbedaan ciri, sehingga keanekaragamannya lebih mudah dipelajari."
  - type: text
    slide: 0
    text: "**Takson** dari yang tertinggi: domain, kingdom, filum (divisio untuk tumbuhan), kelas, ordo, famili, genus, spesies."
  - type: math
    slide: 0
    name: urutan takson
    expression: kingdom → filum → kelas → ordo → famili → genus → spesies
    highlight: true
  - type: heading
    slide: 1
    text: Makin rendah takson
  - type: text
    slide: 1
    text: Makin rendah tingkat takson, makin banyak persamaan ciri anggotanya tetapi makin sedikit jumlah anggotanya.
  - type: text
    slide: 1
    text: Spesies adalah kelompok yang anggotanya dapat kawin dan menghasilkan keturunan fertil.
  - type: tip
    slide: 1
    text: Kucing rumah dan harimau satu famili (Felidae), tetapi berbeda genus.
