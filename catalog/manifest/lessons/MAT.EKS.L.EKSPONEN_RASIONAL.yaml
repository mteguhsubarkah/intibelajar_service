    slide: 1
    name: 8^(2/3)
    expression: "4"
    highlight: true
  - type: math
    slide: 1
    name: 16^(−3/4)
    expression: 1/8
  - type: tip
    slide: 1
    text: Akar dulu, pangkat kemudian. Lebih ringan daripada memangkatkan bilangan besar.
