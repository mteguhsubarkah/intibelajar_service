    text: Akar sebagai pangkat pecahan
  - type: text
    slide: 0
    text: "Akar pangkat n sama dengan pangkat 1/n: **a^(1/n) = ⁿ√a**. Pangkat m/n berarti akar n lalu pangkat m."
  - type: math
    slide: 0
    name: a^(m/n)
    expression: ⁿ√(aᵐ) = (ⁿ√a)ᵐ
    highlight: true
  - type: math
    slide: 0
    name: ∛(x²)
    expression: x^(2/3)
  - type: heading
    slide: 1
    text: Menghitung tanpa kalkulator
  - type: text
    slide: 1
    text: "Hitung akarnya dulu supaya angkanya kecil: 8^(2/3) = (∛8)² = 2² = 4."
  - type: text
    slide: 1
    text: "Pangkat negatif tetap berarti kebalikan: 16^(−3/4) = 1/(⁴√16)³ = 1/8."
