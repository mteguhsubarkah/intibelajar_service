    text: Molekul **polar** bila bentuknya tidak simetris sehingga momen dipol tidak saling meniadakan (H₂O, NH₃).
  - type: text
    slide: 1
    text: Molekul simetris seperti CH₄ dan CO₂ **nonpolar** walau ikatannya polar.
