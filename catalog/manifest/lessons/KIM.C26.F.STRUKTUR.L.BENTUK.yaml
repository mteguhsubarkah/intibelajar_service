    text: Pasangan elektron di sekitar atom pusat saling tolak sejauh mungkin. Hitung **PEI** (pasangan terikat) dan **PEB** (pasangan bebas).
  - type: text
    slide: 0
    text: "4 PEI, 0 PEB: tetrahedral (CH₄). 3 PEI, 1 PEB: piramida trigonal (NH₃). 2 PEI, 2 PEB: bentuk V (H₂O)."
