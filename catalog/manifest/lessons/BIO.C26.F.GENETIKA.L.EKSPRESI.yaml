blocks:
  - type: heading
    slide: 0
    text: Dari DNA ke mRNA
  - type: text
    slide: 0
    text: "**Transkripsi** di **nukleus**: DNA cetakan disalin menjadi mRNA. Pasangan basanya sama, kecuali **A pada DNA berpasangan dengan U** pada RNA."
  - type: text
    slide: 0
    text: "Contoh: DNA cetakan TAC GGA ⇒ mRNA AUG CCU."
  - type: math
    slide: 0
    name: transkripsi
    expression: DNA → mRNA (nukleus)
    highlight: true
  - type: heading
    slide: 1
    text: Dari mRNA ke protein
  - type: text
    slide: 1
    text: "**Translasi** di **ribosom**: setiap **kodon** (3 basa mRNA) diterjemahkan menjadi satu asam amino, dibawa oleh tRNA. AUG adalah kodon awal."
  - type: math
    slide: 1
    name: translasi
    expression: mRNA → protein (ribosom)
    highlight: true
  - type: math
    slide: 1
    name: kodon
    expression: 3 basa
  - type: tip
    slide: 1
    text: Transkripsi = menyalin; translasi = menerjemahkan.
