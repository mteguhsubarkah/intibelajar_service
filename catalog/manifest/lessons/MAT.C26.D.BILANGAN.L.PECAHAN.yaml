    slide: 1
    text: "**Kali**: pembilang × pembilang, penyebut × penyebut."
  - type: text
    slide: 1
    text: "**Bagi**: kalikan dengan kebalikan pembagi. 3/4 : 1/2 = 3/4 × 2/1 = 6/4 = 1½."
