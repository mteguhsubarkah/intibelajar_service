    text: Menjumlah dan mengurangi pecahan
  - type: text
    slide: 0
    text: Samakan dulu penyebutnya dengan KPK, lalu jumlahkan atau kurangkan pembilangnya.
  - type: text
    slide: 0
    text: "Contoh: 2/3 + 1/4 = 8/12 + 3/12 = 11/12."
