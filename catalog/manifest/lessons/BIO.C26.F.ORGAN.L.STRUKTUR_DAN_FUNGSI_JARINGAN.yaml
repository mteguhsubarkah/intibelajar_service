  - type: heading
    slide: 0
    text: Empat jaringan hewan
  - type: text
    slide: 0
    text: "**Epitel** melapisi permukaan dan rongga (kulit, lapisan usus). **Ikat** menghubungkan dan menyokong (tulang, tulang rawan, darah). **Otot** berkontraksi. **Saraf** menghantarkan impuls."
  - type: math
    slide: 0
    name: epitel
    expression: pelapis
    highlight: true
  - type: math
    slide: 0
    name: ikat
    expression: penyokong, penghubung
  - type: heading
    slide: 1
    text: Struktur sesuai fungsi
  - type: text
    slide: 1
    text: Otot dibedakan menjadi otot lurik (rangka, bekerja sadar), otot polos (organ dalam, tak sadar), dan otot jantung (lurik, tak sadar).
  - type: text
    slide: 1
    text: "Bentuk sel menyesuaikan fungsinya: epitel usus memiliki mikrovili untuk menyerap, dan neuron memiliki akson panjang untuk menghantar impuls."
  - type: math
    slide: 1
    name: otot jantung
    expression: lurik, bekerja tak sadar
    highlight: true
  - type: tip
    slide: 1
    text: Satu organ tersusun dari beberapa jaringan sekaligus; lambung punya epitel, otot polos, jaringan ikat, dan saraf.
