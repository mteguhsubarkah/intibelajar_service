    text: Contoh dan cara menguji
  - type: text
    slide: 1
    text: Penjualan es krim dan kasus tenggelam sama-sama naik di musim panas. Penyebabnya cuaca panas, bukan es krim.
  - type: text
    slide: 1
    text: "Untuk menguji sebab-akibat diperlukan eksperimen terkontrol: kelompok dibagi acak, hanya satu perlakuan yang diubah, dan kondisi lain dijaga sama."
