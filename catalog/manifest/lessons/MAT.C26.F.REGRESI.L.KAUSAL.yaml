    text: Berhubungan belum tentu menyebabkan
  - type: text
    slide: 0
    text: Korelasi yang kuat hanya menunjukkan dua variabel bergerak bersama. Itu **bukan bukti** bahwa yang satu menyebabkan yang lain.
  - type: text
    slide: 0
    text: Bisa ada **variabel ketiga** (variabel perancu) yang memengaruhi keduanya.
