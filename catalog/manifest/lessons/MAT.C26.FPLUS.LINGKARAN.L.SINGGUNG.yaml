blocks:
  - type: heading
    slide: 0
    text: Singgung di titik pada lingkaran
  - type: text
    slide: 0
    text: Garis singgung di titik (x₁, y₁) pada x² + y² = r² adalah **x₁x + y₁y = r²**.
  - type: text
    slide: 0
    text: "Untuk (x − a)² + (y − b)² = r²: (x₁ − a)(x − a) + (y₁ − b)(y − b) = r². Garis singgung selalu tegak lurus jari-jari di titik singgungnya."
  - type: math
    slide: 0
    name: pusat O
    expression: x₁x + y₁y = r²
    highlight: true
  - type: heading
    slide: 1
    text: Singgung dengan gradien m
  - type: text
    slide: 1
    text: Garis singgung bergradien m pada x² + y² = r² adalah **y = mx ± r√(1 + m²)**.
  - type: text
    slide: 1
    text: "Untuk pusat (a, b): y − b = m(x − a) ± r√(1 + m²). Selalu ada dua garis singgung yang sejajar."
  - type: math
    slide: 1
    name: gradien m, pusat O
    expression: y = mx ± r√(1 + m²)
    highlight: true
  - type: tip
    slide: 1
    text: Periksa dulu bahwa titik yang diketahui memang terletak pada lingkaran.
