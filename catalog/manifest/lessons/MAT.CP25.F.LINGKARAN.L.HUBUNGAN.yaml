    text: Sudut pusat dan sudut keliling
  - type: text
    slide: 0
    text: Sudut keliling yang menghadap busur yang sama besarnya **setengah sudut pusat**.
  - type: text
    slide: 0
    text: Sudut keliling yang menghadap **diameter** selalu **90°**. Sudut-sudut keliling yang menghadap busur yang sama besarnya sama.
  - type: math
    slide: 0
    name: sudut keliling
    expression: ½ × sudut pusat
    highlight: true
  - type: math
    slide: 0
    name: menghadap diameter
    expression: 90°
  - type: heading
    slide: 1
    text: Segiempat tali busur
  - type: text
    slide: 1
    text: "Segiempat yang keempat titik sudutnya pada lingkaran: **sudut yang berhadapan berjumlah 180°**."
  - type: text
    slide: 1
    text: "Contoh: ∠A = 75° ⇒ ∠C = 105°."
  - type: math
    slide: 1
    name: ∠A + ∠C
    expression: 180°
    highlight: true
  - type: tip
    slide: 1
    text: Tandai busur yang dihadap sudut; dua sudut yang menghadap busur sama saling terhubung.
