blocks:
  - type: heading
    slide: 0
    text: Percobaan binomial
  - type: text
    slide: 0
    text: Percobaan binomial diulang n kali, setiap percobaan hanya punya dua hasil (sukses atau gagal), peluang sukses p tetap, dan antarpercobaan saling bebas.
  - type: text
    slide: 0
    text: Variabel acak X = banyak sukses dalam n percobaan, nilainya 0, 1, 2, …, n.
  - type: math
    slide: 0
    name: syarat
    expression: n tetap, dua hasil, p tetap, saling bebas
    highlight: true
  - type: heading
    slide: 1
    text: Peluang binomial
  - type: text
    slide: 1
    text: "**P(X = k) = C(n, k) · pᵏ · (1 − p)ⁿ⁻ᵏ**, dengan C(n, k) = n! / (k!(n − k)!)."
  - type: text
    slide: 1
    text: "Contoh: koin dilempar 4 kali, peluang tepat 2 gambar = C(4, 2) · (½)² · (½)² = 6/16 = 3/8."
  - type: math
    slide: 1
    name: P(X = k)
    expression: C(n, k) pᵏ (1 − p)ⁿ⁻ᵏ
    highlight: true
  - type: tip
    slide: 1
    text: C(n, k) menghitung banyak urutan; pᵏ(1 − p)ⁿ⁻ᵏ adalah peluang satu urutan tertentu.
