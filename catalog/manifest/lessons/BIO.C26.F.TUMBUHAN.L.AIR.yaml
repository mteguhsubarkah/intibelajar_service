blocks:
  - type: heading
    slide: 0
    text: Dari tanah ke daun
  - type: text
    slide: 0
    text: Air masuk ke akar secara **osmosis**, lalu bergerak melewati korteks dan endodermis menuju xilem.
  - type: text
    slide: 0
    text: Di xilem, air naik ke daun karena tarikan **transpirasi** (penguapan di daun), daya **kohesi** antarmolekul air, dan **adhesi** air pada dinding pembuluh.
  - type: math
    slide: 0
    name: pendorong utama
    expression: tarikan transpirasi
    highlight: true
  - type: heading
    slide: 1
    text: Faktor transpirasi
  - type: text
    slide: 1
    text: Transpirasi meningkat bila cahaya terang, suhu tinggi, angin kencang, dan kelembapan udara rendah.
  - type: text
    slide: 1
    text: "**Tekanan akar** juga membantu, terlihat dari gutasi: tetesan air di tepi daun pada pagi hari."
  - type: tip
    slide: 1
    text: Daun yang layu saat siang terik menunjukkan transpirasi lebih cepat daripada penyerapan air.
