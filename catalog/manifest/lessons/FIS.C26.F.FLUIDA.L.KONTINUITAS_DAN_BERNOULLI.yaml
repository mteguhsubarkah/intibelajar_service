blocks:
  - type: heading
    slide: 0
    text: Persamaan kontinuitas
  - type: text
    slide: 0
    text: "Debit tetap di sepanjang pipa: **A₁v₁ = A₂v₂**. Pipa menyempit ⇒ aliran makin cepat."
  - type: text
    slide: 0
    text: "Contoh: 20 cm² dengan 2 m/s menyempit ke 5 cm² ⇒ v = 8 m/s."
  - type: math
    slide: 0
    name: Q
    expression: A · v
    highlight: true
  - type: math
    slide: 0
    name: A₁v₁
    expression: A₂v₂
  - type: heading
    slide: 1
    text: Persamaan Bernoulli
  - type: text
    slide: 1
    text: "**P + ½ρv² + ρgh = tetap**. Di tempat alirannya cepat, tekanannya kecil (gaya angkat sayap pesawat)."
  - type: text
    slide: 1
    text: "Teorema Torricelli: air keluar dari lubang sedalam h di bawah permukaan dengan **v = √(2gh)**."
  - type: math
    slide: 1
    name: P + ½ρv² + ρgh
    expression: tetap
    highlight: true
  - type: math
    slide: 1
    name: Torricelli
    expression: v = √(2gh)
  - type: tip
    slide: 1
    text: h pada Torricelli diukur dari permukaan air ke lubang, bukan dari dasar.
