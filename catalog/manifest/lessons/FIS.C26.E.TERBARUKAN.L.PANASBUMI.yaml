blocks:
  - type: heading
    slide: 0
    text: Panas bumi
  - type: text
    slide: 0
    text: "**PLTP** memanfaatkan uap panas dari dalam Bumi untuk memutar turbin. Indonesia yang berada di jalur gunung api memiliki potensi panas bumi yang sangat besar."
  - type: text
    slide: 0
    text: "Kelebihannya: dapat beroperasi siang dan malam tanpa bergantung cuaca."
  - type: heading
    slide: 1
    text: Bioenergi dan menilai pilihan
  - type: text
    slide: 1
    text: "**Bioenergi** berasal dari biomassa: biogas dari kotoran ternak, biodiesel dari minyak sawit, atau limbah pertanian. Karbonnya berasal dari tumbuhan yang baru tumbuh."
  - type: text
    slide: 1
    text: Setiap sumber punya syarat lokasi dan dampak, sehingga pilihan energi dinilai dari ketersediaan, biaya, kestabilan pasokan, dan dampak lingkungannya.
  - type: tip
    slide: 1
    text: Biomassa disebut terbarukan jika tanamannya ditanam kembali secara berkelanjutan.
