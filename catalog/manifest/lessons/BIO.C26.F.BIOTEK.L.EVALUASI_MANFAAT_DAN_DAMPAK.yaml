  - type: text
    slide: 0
    text: Tanaman **transgenik** tahan hama (misalnya jagung Bt) mengurangi penggunaan pestisida. Obat seperti insulin dan vaksin rekombinan menjadi lebih mudah diproduksi.
  - type: math
