  - type: text
    slide: 1
    text: "Kekhawatiran: gen sisipan **menyebar ke tumbuhan liar**, hama menjadi resisten, berkurangnya keanekaragaman varietas lokal, dan isu keamanan pangan."
  - type: text
    slide: 1
    text: Karena itu produk transgenik harus melalui uji keamanan hayati sebelum dilepas.
