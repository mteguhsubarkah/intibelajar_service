    text: Perubahan fisika
  - type: text
    slide: 0
    text: Perubahan fisika tidak menghasilkan zat baru; biasanya hanya bentuk, ukuran, atau wujudnya yang berubah.
  - type: text
    slide: 0
    text: "Contoh: es mencair, kertas digunting, gula larut dalam air, lilin meleleh."
  - type: math
    slide: 0
    name: perubahan fisika
    expression: tidak ada zat baru
    highlight: true
  - type: heading
    slide: 1
    text: Perubahan kimia
  - type: text
    slide: 1
    text: "Perubahan kimia menghasilkan zat baru dengan sifat berbeda: kayu terbakar, besi berkarat, nasi basi, kue dipanggang."
  - type: text
    slide: 1
    text: Sifat kimia, seperti mudah terbakar atau mudah berkarat, terlihat saat zat berubah menjadi zat lain.
  - type: math
    slide: 1
    name: perubahan kimia
    expression: terbentuk zat baru
    highlight: true
  - type: tip
    slide: 1
    text: "Tanyakan: apakah terbentuk zat baru? Jika ya, itu perubahan kimia."
