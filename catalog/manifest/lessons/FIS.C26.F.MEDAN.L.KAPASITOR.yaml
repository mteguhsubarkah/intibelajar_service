blocks:
  - type: heading
    slide: 0
    text: Kapasitas kapasitor
  - type: text
    slide: 0
    text: Kapasitor menyimpan muatan. Kapasitasnya **C = Q / V**, satuannya farad (F).
  - type: text
    slide: 0
    text: "Untuk keping sejajar: **C = ε₀A / d**. Kapasitas makin besar jika luas keping A besar, jarak keping d kecil, atau di antara keping diberi bahan dielektrik."
  - type: math
    slide: 0
    name: kapasitas
    expression: C = Q / V
    highlight: true
  - type: math
    slide: 0
    name: keping sejajar
    expression: C = ε₀A / d
  - type: heading
    slide: 1
    text: Susunan dan energi
  - type: text
    slide: 1
    text: "**Paralel**: C_total = C₁ + C₂ + … (tegangannya sama). **Seri**: 1/C_total = 1/C₁ + 1/C₂ + … (muatannya sama)."
  - type: text
    slide: 1
    text: "Energi yang tersimpan: **W = ½CV² = ½QV**."
  - type: math
    slide: 1
    name: paralel
    expression: C₁ + C₂
    highlight: true
  - type: math
    slide: 1
    name: seri
    expression: 1/C = 1/C₁ + 1/C₂
  - type: math
    slide: 1
    name: energi
    expression: W = ½CV²
  - type: tip
    slide: 1
    text: Rumus kapasitor seri dan paralel kebalikan dari rumus resistor.
