  - type: text
    slide: 1
    text: "Gabungkan perkalian skalar dan penjumlahan. Contoh: a = (1, 2), b = (3, −1) ⇒ 2a − 3b = (2, 4) − (9, −3) = (−7, 7)."
  - type: math
    slide: 1
