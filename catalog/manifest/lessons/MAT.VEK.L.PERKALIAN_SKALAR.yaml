    text: "**k · a** mengalikan setiap komponen dengan k. Bila k > 0 arahnya tetap; bila k < 0 arahnya **berlawanan**."
  - type: text
    slide: 0
    text: "Contoh: 3(2, −1) = (6, −3)."
