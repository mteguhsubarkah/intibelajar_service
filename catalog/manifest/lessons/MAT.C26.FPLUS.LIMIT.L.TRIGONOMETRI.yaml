    text: Limit dasar
  - type: text
    slide: 0
    text: Untuk x dalam radian berlaku **lim x→0 sin x / x = 1** dan lim x→0 tan x / x = 1.
  - type: text
    slide: 0
    text: Akibatnya lim x→0 sin(ax)/(bx) = a/b dan lim x→0 tan(ax)/sin(bx) = a/b.
  - type: math
    slide: 0
    name: limit dasar
    expression: lim x→0 sin x / x = 1
    highlight: true
  - type: math
    slide: 0
    name: bentuk umum
    expression: lim x→0 sin(ax)/(bx) = a/b
  - type: heading
    slide: 1
    text: Mengubah bentuk
  - type: text
    slide: 1
    text: "Ubah fungsi dengan identitas agar muncul bentuk dasar. Contoh: 1 − cos 2x = 2 sin² x."
  - type: text
    slide: 1
    text: Sehingga lim x→0 (1 − cos 2x)/x² = lim 2 sin² x / x² = 2.
  - type: math
    slide: 1
    name: identitas
    expression: 1 − cos 2x = 2 sin² x
    highlight: true
  - type: tip
    slide: 1
    text: Rumus limit trigonometri ini hanya berlaku jika x dalam radian.
