blocks:
  - type: heading
    slide: 0
    text: Kuat medan listrik
  - type: text
    slide: 0
    text: Medan listrik adalah daerah di sekitar muatan tempat muatan lain mengalami gaya. Kuat medan **E = F / q**, satuannya N/C.
  - type: text
    slide: 0
    text: "Untuk muatan titik Q: **E = k · Q / r²**."
  - type: math
    slide: 0
    name: kuat medan
    expression: E = F / q = kQ / r²
    highlight: true
  - type: heading
    slide: 1
    text: Arah dan garis medan
  - type: text
    slide: 1
    text: Garis medan keluar dari muatan positif dan masuk ke muatan negatif. Makin rapat garisnya, makin kuat medannya.
  - type: text
    slide: 1
    text: Muatan positif mengalami gaya searah medan; muatan negatif mengalami gaya berlawanan arah medan.
  - type: math
    slide: 1
    name: arah medan
    expression: keluar dari +, masuk ke −
    highlight: true
  - type: tip
    slide: 1
    text: Medan dari beberapa muatan dijumlahkan sebagai vektor, jadi perhatikan arahnya.
