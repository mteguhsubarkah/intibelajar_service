    text: Kesimpulan berbasis bukti
  - type: text
    slide: 1
    text: Ulangi pengukuran beberapa kali dan ambil rata-ratanya, lalu sajikan dalam tabel atau grafik.
  - type: text
    slide: 1
    text: Simpulkan hanya yang didukung data. Hipotesis yang ditolak oleh data tetap merupakan hasil yang berharga.
  - type: math
    slide: 1
    name: nilai terbaik
    expression: rata-rata pengukuran berulang
    highlight: true
  - type: tip
    slide: 1
    text: Ubah satu variabel saja dalam satu percobaan.
