  - type: heading
    slide: 0
    text: Tiga jenis variabel
  - type: text
    slide: 0
    text: "**Variabel bebas**: yang sengaja diubah. **Variabel terikat**: yang diukur sebagai akibatnya. **Variabel kontrol**: dijaga tetap agar percobaan adil."
  - type: text
    slide: 0
    text: "Contoh: pengaruh banyak cahaya (bebas) terhadap tinggi tanaman (terikat), dengan jenis tanaman, air, dan pot dibuat sama (kontrol)."
