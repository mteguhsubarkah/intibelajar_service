blocks:
  - type: heading
    slide: 0
    text: Sisa pinjaman
  - type: text
    slide: 0
    text: Setelah pembayaran ke-n, **sisa pinjaman = sisa sebelumnya − angsuran ke-n**.
  - type: text
    slide: 0
    text: "Contoh: 10.000.000 − 800.000 = Rp9.200.000 setelah bulan pertama."
  - type: math
    slide: 0
    name: sisa
    expression: Mₙ₋₁ − aₙ
    highlight: true
  - type: heading
    slide: 1
    text: Angsuran naik geometris
  - type: text
    slide: 1
    text: "Pada anuitas, angsuran membentuk barisan geometri: **aₙ = a₁(1 + i)ⁿ⁻¹**."
  - type: text
    slide: 1
    text: "Contoh: a₁ = Rp800.000, i = 2% ⇒ a₂ = 816.000."
  - type: math
    slide: 1
    name: aₙ
    expression: a₁(1 + i)ⁿ⁻¹
    highlight: true
  - type: tip
    slide: 1
    text: Bunga bulan kedua dihitung dari sisa pinjaman, bukan dari pinjaman awal.
