blocks:
  - type: heading
    slide: 0
    text: Tiga jenis partikel
  - type: text
    slide: 0
    text: "**Atom** adalah partikel terkecil unsur dan netral. **Ion** adalah atom yang bermuatan karena melepas atau menerima elektron. **Molekul** adalah gabungan dua atom atau lebih."
  - type: text
    slide: 0
    text: Melepas elektron ⇒ ion positif (**kation**), misalnya Na⁺. Menerima elektron ⇒ ion negatif (**anion**), misalnya Cl⁻.
  - type: math
    slide: 0
    name: kation
    expression: melepas elektron
    highlight: true
  - type: math
    slide: 0
    name: anion
    expression: menerima elektron
  - type: heading
    slide: 1
    text: Molekul unsur dan molekul senyawa
  - type: text
    slide: 1
    text: "**Molekul unsur** tersusun atas atom sejenis (O₂, N₂). **Molekul senyawa** tersusun atas atom berbeda jenis (H₂O, CO₂)."
  - type: math
    slide: 1
    name: O₂
    expression: molekul unsur
    highlight: true
  - type: math
    slide: 1
    name: H₂O
    expression: molekul senyawa
  - type: tip
    slide: 1
    text: Logam seperti Fe ditulis sebagai atom, bukan molekul.
