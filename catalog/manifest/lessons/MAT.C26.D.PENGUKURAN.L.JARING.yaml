  - type: text
    slide: 0
    text: Jaring-jaring adalah bangun datar yang didapat dengan membuka (menggunting) permukaan bangun ruang.
  - type: text
    slide: 0
    text: Jaring-jaring kubus terdiri dari 6 persegi yang kongruen. Tidak semua susunan 6 persegi bisa dilipat menjadi kubus.
