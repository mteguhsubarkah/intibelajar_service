    text: Luas permukaan
  - type: text
    slide: 1
    text: Luas permukaan = jumlah luas semua sisinya.
  - type: text
    slide: 1
    text: Kubus 6s², balok 2(pl + pt + lt), tabung 2πr² + 2πrt.
  - type: math
    slide: 1
    name: luas permukaan balok
    expression: 2(pl + pt + lt)
    highlight: true
  - type: tip
    slide: 1
    text: Bayangkan jaring-jaringnya supaya tidak ada sisi yang terlewat atau terhitung dua kali.
