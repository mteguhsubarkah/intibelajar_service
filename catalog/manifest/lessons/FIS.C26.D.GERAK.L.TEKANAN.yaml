  - type: text
    slide: 1
    text: "Tekanan hidrostatis bertambah dengan kedalaman: P = ρ × g × h. Karena itu dinding bendungan dibuat makin tebal ke bawah."
  - type: text
    slide: 1
    text: Tekanan udara makin kecil di tempat yang makin tinggi.
  - type: math
    slide: 1
