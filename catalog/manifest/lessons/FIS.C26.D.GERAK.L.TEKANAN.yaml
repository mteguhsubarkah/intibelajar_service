    text: Tekanan zat padat
  - type: text
    slide: 0
    text: "Tekanan = gaya : luas bidang tekan, satuannya pascal (1 Pa = 1 N/m²)."
  - type: text
    slide: 0
    text: Pisau yang tajam memotong lebih mudah karena luas bidang tekannya kecil, sehingga tekanannya besar.
