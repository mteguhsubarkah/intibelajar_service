    text: "Rantai makanan menunjukkan urutan makan-dimakan: padi → tikus → ular → elang."
  - type: text
    slide: 0
    text: Produsen berada di awal, diikuti konsumen I, konsumen II, dan seterusnya. Pengurai menguraikan organisme yang mati.
