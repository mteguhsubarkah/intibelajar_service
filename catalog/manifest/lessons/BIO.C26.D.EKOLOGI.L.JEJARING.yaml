    text: Jaring makanan dan piramida energi
  - type: text
    slide: 1
    text: Jaring makanan adalah gabungan beberapa rantai makanan yang saling terhubung.
  - type: text
    slide: 1
    text: Pada piramida energi, energi makin kecil di tingkat atas; hanya sekitar 10% yang diteruskan. Jika satu populasi hilang, populasi lain ikut terpengaruh.
  - type: math
    slide: 1
