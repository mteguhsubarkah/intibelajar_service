concepts:
  - MAT.C26.FPLUS.TRANSFORMASI.ROTASI
blocks:
  - type: heading
    slide: 0
    text: Rotasi terhadap titik asal
  - type: text
    slide: 0
    text: "**Rotasi** sebesar θ berlawanan arah jarum jam terhadap O(0, 0) memetakan (x, y) ke (x cos θ − y sin θ, x sin θ + y cos θ)."
  - type: text
    slide: 0
    text: "Kasus khusus: rotasi 90° memetakan (x, y) → (−y, x); rotasi 180° memetakan (x, y) → (−x, −y)."
  - type: math
    slide: 0
    name: matriks rotasi
    expression: "[[cos θ, −sin θ], [sin θ, cos θ]]"
    highlight: true
  - type: math
    slide: 0
    name: rotasi 90°
    expression: (x, y) → (−y, x)
  - type: heading
    slide: 1
    text: Arah dan pusat lain
  - type: text
    slide: 1
    text: "Sudut positif berarti berlawanan arah jarum jam; rotasi searah jarum jam memakai sudut negatif, misalnya −90°: (x, y) → (y, −x)."
  - type: text
    slide: 1
    text: "Untuk pusat P(a, b): geser dulu sehingga P ke titik asal, putar, lalu geser kembali."
  - type: math
    slide: 1
    name: rotasi −90°
    expression: (x, y) → (y, −x)
    highlight: true
  - type: tip
    slide: 1
    text: Rotasi tidak mengubah jarak titik ke pusat rotasi.
