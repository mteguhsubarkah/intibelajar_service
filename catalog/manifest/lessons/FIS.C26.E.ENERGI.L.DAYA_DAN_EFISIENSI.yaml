blocks:
  - type: heading
    slide: 0
    text: Daya = usaha per waktu
  - type: text
    slide: 0
    text: "**P = W / t**, satuannya watt (J/s). Mengangkat beban: W = m · g · h."
  - type: text
    slide: 0
    text: "Contoh: 50 kg diangkat 10 m dalam 20 s ⇒ P = 50 × 10 × 10 / 20 = 250 W."
  - type: math
    slide: 0
    name: P
    expression: W / t
    highlight: true
  - type: math
    slide: 0
    name: W angkat
    expression: m · g · h
  - type: heading
    slide: 1
    text: Efisiensi
  - type: text
    slide: 1
    text: Tidak ada mesin yang mengubah seluruh energi menjadi energi berguna. **η = energi keluaran berguna / energi masukan × 100%**.
  - type: text
    slide: 1
    text: "Contoh: lampu 60 W memancarkan 9 W cahaya ⇒ η = 15%; sisanya menjadi panas."
  - type: math
    slide: 1
    name: η
    expression: P keluaran / P masukan × 100%
    highlight: true
  - type: tip
    slide: 1
    text: Efisiensi selalu kurang dari 100%.
