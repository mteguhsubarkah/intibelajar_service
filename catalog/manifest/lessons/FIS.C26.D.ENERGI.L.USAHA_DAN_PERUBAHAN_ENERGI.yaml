    text: "Usaha dilakukan jika gaya memindahkan benda searah gaya: W = F × s, satuannya joule (J)."
  - type: text
    slide: 0
    text: "Mendorong tembok yang tidak bergeser: usahanya 0 walaupun terasa lelah."
