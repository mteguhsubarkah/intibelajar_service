    text: Energi berubah bentuk
  - type: text
    slide: 1
    text: Energi potensial gravitasi Ep = m × g × h; energi kinetik Ek = ½ × m × v².
  - type: text
    slide: 1
    text: Energi tidak dapat diciptakan atau dimusnahkan, hanya berubah bentuk. Buah yang jatuh mengubah energi potensial menjadi energi kinetik.
