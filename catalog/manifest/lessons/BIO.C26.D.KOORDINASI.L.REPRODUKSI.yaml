    text: Organ reproduksi
  - type: text
    slide: 0
    text: "Laki-laki: testis menghasilkan sperma dan hormon testosteron. Perempuan: ovarium menghasilkan sel telur dan hormon estrogen; rahim tempat janin berkembang."
  - type: text
    slide: 0
    text: Fertilisasi adalah peleburan sel sperma dengan sel telur.
  - type: math
    slide: 0
    name: fertilisasi
