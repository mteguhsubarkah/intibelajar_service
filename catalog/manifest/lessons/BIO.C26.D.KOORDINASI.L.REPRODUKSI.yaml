    highlight: true
  - type: heading
    slide: 1
    text: Pubertas dan kesehatan reproduksi
  - type: text
    slide: 1
    text: Pubertas ditandai perubahan fisik, seperti tumbuh rambut, suara berubah, dan menstruasi, yang dipengaruhi hormon.
  - type: text
    slide: 1
    text: Jaga kebersihan organ reproduksi, kenali batasan tubuh, dan cari informasi dari tenaga kesehatan atau orang dewasa tepercaya.
  - type: math
    slide: 1
    name: testosteron
    expression: ciri kelamin sekunder laki-laki
    highlight: true
  - type: tip
    slide: 1
    text: Perubahan saat pubertas itu normal, dan waktunya bisa berbeda pada setiap orang.
