    text: Rumus kosinus sudut
  - type: text
    slide: 0
    text: "**cos θ = (a · b) / (|a||b|)**. Hitung perkalian titik, hitung kedua panjang, lalu cari sudut dari nilai cos."
  - type: math
    slide: 0
    name: cos θ
    expression: (a · b) / (|a||b|)
    highlight: true
  - type: heading
    slide: 1
    text: Membaca nilai cos
  - type: text
    slide: 1
    text: cos θ = 1 ⇒ 0° (searah). cos θ = 0 ⇒ 90°. cos θ = −1 ⇒ 180° (berlawanan). cos θ = ½√2 ⇒ 45°.
  - type: text
    slide: 1
    text: "Contoh: a = (1, 0), b = (1, 1) ⇒ cos θ = 1/√2 ⇒ θ = 45°."
  - type: math
    slide: 1
    name: cos θ = 1/√2
    expression: θ = 45°
    highlight: true
  - type: tip
    slide: 1
    text: Bila a · b = 0, langsung simpulkan 90° tanpa menghitung panjang.
