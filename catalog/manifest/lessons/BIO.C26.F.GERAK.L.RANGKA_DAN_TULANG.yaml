blocks:
  - type: heading
    slide: 0
    text: Fungsi rangka
  - type: text
    slide: 0
    text: Rangka manusia menegakkan tubuh, melindungi organ (tengkorak melindungi otak, rusuk melindungi jantung dan paru-paru), menjadi tempat melekat otot, dan tempat pembentukan sel darah di sumsum merah.
  - type: text
    slide: 0
    text: Rangka dibagi menjadi **rangka aksial** (tengkorak, tulang belakang, rusuk) dan **rangka apendikular** (anggota gerak beserta gelangnya).
  - type: heading
    slide: 1
    text: Jenis tulang
  - type: text
    slide: 1
    text: "**Tulang rawan** (kartilago) lentur, misalnya di daun telinga dan ujung hidung. **Tulang keras** kaku karena mengandung kalsium fosfat."
  - type: text
    slide: 1
    text: Pembentukan tulang keras dari tulang rawan disebut **osifikasi**, yang memerlukan kalsium dan vitamin D.
  - type: tip
    slide: 1
    text: Tulang pipa (lengan, paha) bertambah panjang di cakram epifisis selama masa pertumbuhan.
