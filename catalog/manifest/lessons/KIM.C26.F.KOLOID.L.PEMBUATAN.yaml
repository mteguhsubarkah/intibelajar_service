blocks:
  - type: heading
    slide: 0
    text: Kondensasi dan dispersi
  - type: text
    slide: 0
    text: "Cara **kondensasi**: partikel kecil (ion atau molekul) digabung menjadi partikel koloid, misalnya hidrolisis FeCl₃ dalam air panas yang membentuk sol Fe(OH)₃."
  - type: text
    slide: 0
    text: "Cara **dispersi**: partikel besar dipecah menjadi seukuran koloid, misalnya dengan penggilingan (mekanik), peptisasi, atau busur Bredig."
  - type: heading
    slide: 1
    text: Pengemulsi dan penerapan
  - type: text
    slide: 1
    text: "**Pengemulsi** menstabilkan emulsi. Sabun dan kuning telur (lesitin) membuat minyak dapat bercampur dengan air."
  - type: text
    slide: 1
    text: Koloid banyak dipakai dalam makanan, kosmetik, obat, dan cat. Pengemulsi dalam mayones mencegah minyak dan cuka memisah.
  - type: tip
    slide: 1
    text: Sabun membersihkan lemak karena satu ujung molekulnya suka air dan ujung lainnya suka minyak.
