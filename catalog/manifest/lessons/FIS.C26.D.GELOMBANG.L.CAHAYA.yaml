  - type: text
    slide: 1
    text: "Cahaya dibelokkan saat melewati dua medium dengan kerapatan berbeda: pensil tampak patah di dalam air, kolam tampak lebih dangkal."
  - type: text
    slide: 1
    text: Untuk lensa dan cermin lengkung berlaku 1/f = 1/s + 1/s′.
