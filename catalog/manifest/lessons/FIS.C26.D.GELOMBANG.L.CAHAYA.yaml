    text: "Hukum pemantulan: sudut datang = sudut pantul, keduanya diukur dari garis normal."
  - type: text
    slide: 0
    text: Cermin datar membentuk bayangan maya, tegak, dan sama besar. Cermin cembung (spion) selalu membentuk bayangan maya, tegak, diperkecil.
