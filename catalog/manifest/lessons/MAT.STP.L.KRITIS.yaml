    text: Rata-rata atau median?
  - type: text
    slide: 1
    text: "Bila ada pencilan, **median** lebih mewakili. Contoh gaji 4, 4, 5, 5, 32 juta: rata-rata 10 juta, padahal 4 dari 5 orang bergaji ≤ 5 juta. Median 5 juta lebih jujur."
