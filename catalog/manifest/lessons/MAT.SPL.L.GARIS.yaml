    text: Garis dari dua titik potong
  - type: text
    slide: 0
    text: Garis yang memotong sumbu x di (a, 0) dan sumbu y di (0, b) mempunyai persamaan **bx + ay = ab**.
  - type: text
    slide: 0
    text: "Contoh: melalui (4, 0) dan (0, 3) ⇒ 3x + 4y = 12."
  - type: math
    slide: 0
    name: melalui (a, 0) dan (0, b)
    expression: bx + ay = ab
    highlight: true
  - type: heading
    slide: 1
    text: Dari persamaan ke gambar
  - type: text
    slide: 1
    text: "Untuk menggambar 2x + 5y = 10, cari titik potongnya: x = 0 ⇒ y = 2, y = 0 ⇒ x = 5. Hubungkan kedua titik."
  - type: math
    slide: 1
    name: 2x + 5y = 10
    expression: (5, 0) dan (0, 2)
    highlight: true
  - type: tip
    slide: 1
    text: Angka di depan x berpasangan dengan titik potong sumbu y, dan sebaliknya.
