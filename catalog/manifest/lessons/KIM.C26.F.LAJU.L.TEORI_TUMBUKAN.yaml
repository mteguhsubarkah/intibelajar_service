blocks:
  - type: heading
    slide: 0
    text: Tumbukan efektif
  - type: text
    slide: 0
    text: Reaksi terjadi jika partikel pereaksi **bertumbukan**. Tidak semua tumbukan menghasilkan reaksi; yang berhasil disebut **tumbukan efektif**.
  - type: text
    slide: 0
    text: Tumbukan efektif terjadi bila partikel memiliki energi yang cukup, setidaknya sebesar **energi aktivasi (Ea)**, dan arah tumbukannya tepat.
  - type: math
    slide: 0
    name: syarat
    expression: energi ≥ Ea + arah tepat
    highlight: true
  - type: heading
    slide: 1
    text: Diagram energi
  - type: text
    slide: 1
    text: Energi aktivasi digambarkan sebagai bukit energi yang harus dilewati pereaksi sebelum menjadi produk.
  - type: text
    slide: 1
    text: Makin rendah Ea, makin banyak tumbukan yang efektif, sehingga reaksi makin cepat.
  - type: tip
    slide: 1
    text: Frekuensi tumbukan dan energi partikel adalah dua kunci untuk menjelaskan semua faktor laju.
