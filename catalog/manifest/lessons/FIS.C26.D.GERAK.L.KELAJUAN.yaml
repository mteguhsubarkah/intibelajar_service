blocks:
  - type: heading
    slide: 0
    text: Jarak dan perpindahan
  - type: text
    slide: 0
    text: "**Jarak** adalah panjang lintasan yang ditempuh (skalar). **Perpindahan** adalah perubahan posisi dari awal ke akhir, beserta arahnya (vektor)."
  - type: text
    slide: 0
    text: "Lari satu putaran lapangan 400 m: jaraknya 400 m, tetapi perpindahannya 0 karena kembali ke titik awal."
  - type: math
    slide: 0
    name: jarak
    expression: panjang lintasan
    highlight: true
  - type: math
    slide: 0
    name: perpindahan
    expression: posisi akhir − posisi awal
  - type: heading
    slide: 1
    text: Kelajuan dan kecepatan
  - type: text
    slide: 1
    text: "Kelajuan rata-rata = jarak total : waktu total. Kecepatan rata-rata = perpindahan : waktu."
  - type: text
    slide: 1
    text: "Gerak lurus beraturan (GLB): kelajuan tetap. Gerak lurus berubah beraturan (GLBB): kelajuan berubah secara teratur."
  - type: math
    slide: 1
    name: kelajuan rata-rata
    expression: "jarak total : waktu total"
    highlight: true
  - type: tip
    slide: 1
    text: Kelajuan rata-rata bukan rata-rata dari beberapa kelajuan; hitung dari jarak total dan waktu total.
