blocks:
  - type: heading
    slide: 0
    text: Turunan dasar
  - type: text
    slide: 0
    text: "Dengan x dalam radian: (sin x)′ = cos x, (cos x)′ = −sin x, dan (tan x)′ = sec² x."
  - type: text
    slide: 0
    text: "Dengan aturan rantai: (sin ax)′ = a cos ax dan (cos ax)′ = −a sin ax."
  - type: math
    slide: 0
    name: sinus
    expression: (sin x)′ = cos x
    highlight: true
  - type: math
    slide: 0
    name: kosinus
    expression: (cos x)′ = −sin x
  - type: heading
    slide: 1
    text: Menggabungkan aturan
  - type: text
    slide: 1
    text: "Gabungkan dengan aturan perkalian atau rantai. Contoh: y = sin² x = (sin x)² memberi y′ = 2 sin x cos x = sin 2x."
  - type: text
    slide: 1
    text: "Contoh lain: y = x sin x memberi y′ = sin x + x cos x."
  - type: math
    slide: 1
    name: contoh
    expression: (sin² x)′ = sin 2x
    highlight: true
  - type: tip
    slide: 1
    text: Tanda negatif muncul pada turunan kosinus, bukan pada turunan sinus.
