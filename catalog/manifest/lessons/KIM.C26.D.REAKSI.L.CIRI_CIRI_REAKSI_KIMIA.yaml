    text: Contoh sehari-hari
  - type: text
    slide: 1
    text: Tablet vitamin C effervescent dimasukkan ke air → muncul gelembung gas. Apel yang dipotong menjadi cokelat → perubahan warna. Kayu dibakar → panas dan cahaya.
  - type: math
    slide: 1
