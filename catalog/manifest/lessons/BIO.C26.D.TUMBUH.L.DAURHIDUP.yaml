blocks:
  - type: heading
    slide: 0
    text: Metamorfosis
  - type: text
    slide: 0
    text: "**Metamorfosis sempurna**: telur → larva → pupa → imago (kupu-kupu, nyamuk). **Metamorfosis tidak sempurna**: telur → nimfa → imago (belalang, kecoak)."
  - type: text
    slide: 0
    text: "Katak mengalami metamorfosis: telur → berudu → katak muda → katak dewasa."
  - type: math
    slide: 0
    name: sempurna
    expression: telur → larva → pupa → imago
    highlight: true
  - type: math
    slide: 0
    name: tidak sempurna
    expression: telur → nimfa → imago
  - type: heading
    slide: 1
    text: Daur hidup tumbuhan dan manfaatnya
  - type: text
    slide: 1
    text: "Tumbuhan berbiji: biji → kecambah → tumbuhan muda → tumbuhan dewasa → berbunga → buah dan biji."
  - type: text
    slide: 1
    text: Memahami daur hidup membantu mengendalikan hama, misalnya memutus daur hidup nyamuk dengan menguras penampungan air (3M).
  - type: math
    slide: 1
    name: 3M
    expression: menguras, menutup, mendaur ulang
    highlight: true
  - type: tip
    slide: 1
    text: Ada tahap pupa → metamorfosis sempurna.
