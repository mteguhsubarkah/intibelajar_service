blocks:
  - type: heading
    slide: 0
    text: Apa itu polinomial
  - type: text
    slide: 0
    text: "**Polinomial** berderajat n: P(x) = aₙxⁿ + aₙ₋₁xⁿ⁻¹ + … + a₁x + a₀, dengan aₙ ≠ 0 dan pangkat x bilangan cacah."
  - type: text
    slide: 0
    text: "**Derajat** adalah pangkat tertinggi; aₙ disebut koefisien utama dan a₀ suku tetap. Bentuk 3/x atau √x bukan suku polinomial."
  - type: math
    slide: 0
    name: derajat n
    expression: aₙxⁿ + … + a₀
    highlight: true
  - type: heading
    slide: 1
    text: Nilai dan operasi
  - type: text
    slide: 1
    text: "**Nilai** polinomial dicari dengan substitusi, misalnya P(x) = x³ − 2x + 5 memberi P(2) = 8 − 4 + 5 = 9."
  - type: text
    slide: 1
    text: "Jumlah dan selisih: gabungkan suku sejenis. Hasil kali dua polinomial berderajat m dan n berderajat m + n."
  - type: math
    slide: 1
    name: derajat hasil kali
    expression: m + n
    highlight: true
  - type: tip
    slide: 1
    text: Jumlah semua koefisien P(x) sama dengan P(1).
