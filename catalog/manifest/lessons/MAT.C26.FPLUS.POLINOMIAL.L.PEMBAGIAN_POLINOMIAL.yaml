blocks:
  - type: heading
    slide: 0
    text: Hasil bagi dan sisa
  - type: text
    slide: 0
    text: "Membagi P(x) dengan pembagi Q(x) menghasilkan **hasil bagi** H(x) dan **sisa** S(x): P(x) = Q(x) · H(x) + S(x)."
  - type: text
    slide: 0
    text: Derajat sisa selalu lebih kecil daripada derajat pembagi. Jika pembaginya linear (x − k), sisanya berupa konstanta.
  - type: math
    slide: 0
    name: pembagian
    expression: P(x) = Q(x) · H(x) + S(x)
    highlight: true
  - type: heading
    slide: 1
    text: Cara Horner
  - type: text
    slide: 1
    text: Untuk pembagi x − k, tulis koefisien P(x) berurutan (isi 0 untuk suku yang hilang), lalu turunkan koefisien pertama.
  - type: text
    slide: 1
    text: Kalikan dengan k, jumlahkan ke koefisien berikutnya, ulangi. Bilangan terakhir adalah sisa; bilangan sebelumnya adalah koefisien hasil bagi.
  - type: math
    slide: 1
    name: skema Horner
    expression: kalikan k, jumlahkan
    highlight: true
  - type: tip
    slide: 1
    text: Lupa menulis 0 untuk suku yang hilang adalah kesalahan paling sering.
