  - type: heading
    slide: 0
    text: Akar polinomial
  - type: text
    slide: 0
    text: Polinomial berderajat n memiliki paling banyak n akar real. Akar-akar dapat dicari lewat teorema faktor lalu Horner berulang.
  - type: text
    slide: 0
    text: Grafik y = P(x) memotong sumbu x tepat di akar-akar realnya.
  - type: math
    slide: 0
    name: jumlah akar maksimum
    expression: n akar
    highlight: true
  - type: heading
    slide: 1
    text: Rumus Vieta derajat tiga
  - type: text
    slide: 1
    text: Untuk ax³ + bx² + cx + d = 0 dengan akar x₁, x₂, x₃ berlaku x₁ + x₂ + x₃ = −b/a.
  - type: text
    slide: 1
    text: Juga x₁x₂ + x₁x₃ + x₂x₃ = c/a dan x₁x₂x₃ = −d/a. Rumus ini dipakai tanpa harus menghitung akarnya satu per satu.
  - type: math
    slide: 1
    name: jumlah akar
    expression: −b/a
    highlight: true
  - type: math
    slide: 1
    name: hasil kali akar
    expression: −d/a
  - type: tip
    slide: 1
    text: "Tandanya berganti: −b/a, +c/a, −d/a."
