blocks:
  - type: heading
    slide: 0
    text: Aldehida dan keton
  - type: text
    slide: 0
    text: "**Aldehida** memiliki gugus **–CHO** di ujung rantai dan nama IUPAC berakhiran **-al**, contohnya metanal (formaldehida) dan etanal."
  - type: text
    slide: 0
    text: "**Keton** memiliki gugus karbonil **–CO–** di tengah rantai dan nama berakhiran **-on**, contohnya propanon (aseton)."
  - type: math
    slide: 0
    name: aldehida
    expression: R–CHO (-al)
    highlight: true
  - type: math
    slide: 0
    name: keton
    expression: R–CO–R′ (-on)
  - type: heading
    slide: 1
    text: Membedakan keduanya
  - type: text
    slide: 1
    text: Aldehida dan keton dengan jumlah C sama adalah isomer fungsi, misalnya propanal dan propanon (C₃H₆O).
  - type: text
    slide: 1
    text: Aldehida mudah dioksidasi sehingga memberi hasil positif pada **uji Tollens** (cermin perak) dan **uji Fehling** (endapan merah bata); keton tidak.
  - type: tip
    slide: 1
    text: Formalin adalah larutan metanal sekitar 37%, dipakai untuk mengawetkan spesimen, bukan makanan.
