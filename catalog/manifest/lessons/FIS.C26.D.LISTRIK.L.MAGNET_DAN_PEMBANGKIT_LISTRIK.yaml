    text: Kutub magnet senama tolak-menolak; kutub tak senama tarik-menarik.
  - type: text
    slide: 0
    text: Arus listrik menimbulkan medan magnet. Kumparan berarus (elektromagnet) dipakai pada bel listrik dan derek pengangkat besi.
