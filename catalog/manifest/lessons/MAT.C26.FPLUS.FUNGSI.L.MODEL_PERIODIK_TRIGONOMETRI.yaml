blocks:
  - type: heading
    slide: 0
    text: Bentuk umum model periodik
  - type: text
    slide: 0
    text: Fenomena berulang seperti pasang surut, suhu harian, dan putaran roda dimodelkan dengan y = A sin(B(x − C)) + D.
  - type: text
    slide: 0
    text: "**Amplitudo** |A| = setengah selisih nilai maksimum dan minimum; **garis tengah** y = D = rata-rata maksimum dan minimum; **periode** = 2π/B (atau 360°/B)."
  - type: math
    slide: 0
    name: model
    expression: y = A sin(B(x − C)) + D
    highlight: true
  - type: math
    slide: 0
    name: periode
    expression: 2π / B
  - type: heading
    slide: 1
    text: Membaca data
  - type: text
    slide: 1
    text: "Contoh: tinggi air laut berkisar 1 m sampai 5 m dan berulang tiap 12 jam. Maka A = 2, D = 3, dan B = 2π/12 = π/6."
  - type: text
    slide: 1
    text: C menggeser grafik mendatar sehingga puncak atau titik awalnya tepat pada waktu yang diketahui.
  - type: math
    slide: 1
    name: amplitudo
    expression: (maks − min)/2
    highlight: true
  - type: math
    slide: 1
    name: garis tengah
    expression: (maks + min)/2
  - type: tip
    slide: 1
    text: "Satuan periode mengikuti satuan x: jam, menit, atau hari."
