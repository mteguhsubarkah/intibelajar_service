    text: Sistem gerak
  - type: text
    slide: 0
    text: Tulang adalah alat gerak pasif; otot adalah alat gerak aktif.
  - type: text
    slide: 0
    text: "Sendi menghubungkan tulang: sendi engsel (siku, lutut), sendi peluru (bahu, pangkal paha), dan sendi putar (leher)."
