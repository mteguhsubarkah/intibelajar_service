    expression: bahu, pangkal paha
  - type: heading
    slide: 1
    text: Gangguan dan cara menjaganya
  - type: text
    slide: 1
    text: "Skoliosis: tulang belakang bengkok ke samping, antara lain karena posisi duduk yang salah. Osteoporosis: tulang keropos karena kekurangan kalsium. Kram: otot menegang tiba-tiba."
  - type: text
    slide: 1
    text: Cegah dengan postur tubuh yang baik, olahraga teratur, serta cukup kalsium dan vitamin D.
  - type: math
    slide: 1
    name: osteoporosis
    expression: kekurangan kalsium
    highlight: true
  - type: tip
    slide: 1
    text: Gangguan pada satu sistem organ dapat memengaruhi sistem lain.
