blocks:
  - type: heading
    slide: 0
    text: Rumus ABC
  - type: text
    slide: 0
    text: "Bila sulit difaktorkan: **x = (−b ± √D) / 2a** dengan **D = b² − 4ac**."
  - type: text
    slide: 0
    text: "Contoh: 2x² + 3x − 2 = 0 ⇒ D = 9 + 16 = 25 ⇒ x = (−3 ± 5)/4, yaitu 1/2 atau −2."
  - type: math
    slide: 0
    name: x₁,₂
    expression: (−b ± √D) / 2a
    highlight: true
  - type: math
    slide: 0
    name: D
    expression: b² − 4ac
  - type: heading
    slide: 1
    text: Membaca jenis akar dari D
  - type: text
    slide: 1
    text: "**D > 0**: dua akar real berbeda. **D = 0**: akar kembar. **D < 0**: tidak punya akar real (parabola tidak memotong sumbu x)."
  - type: math
    slide: 1
    name: D = 0
    expression: akar kembar
    highlight: true
  - type: math
    slide: 1
    name: D < 0
    expression: tidak ada akar real
  - type: tip
    slide: 1
    text: Soal "akar kembar" atau "menyinggung sumbu x" selalu berarti D = 0.
