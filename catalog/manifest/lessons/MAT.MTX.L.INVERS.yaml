  - type: heading
    slide: 0
    text: Rumus invers
  - type: text
    slide: 0
    text: "**A⁻¹ = 1/(ad − bc) · [d −b; −c a]**: tukar elemen diagonal utama, ubah tanda diagonal samping, bagi dengan determinan."
  - type: text
    slide: 0
    text: "Contoh: A = [4 3; 1 1], det = 1 ⇒ A⁻¹ = [1 −3; −1 4]."
  - type: math
    slide: 0
    name: A⁻¹
    expression: 1/(ad − bc) · [d −b; −c a]
    highlight: true
  - type: heading
    slide: 1
    text: Menyelesaikan AX = B
  - type: text
    slide: 1
    text: "Kalikan kedua ruas dari kiri dengan A⁻¹: **X = A⁻¹B**."
  - type: text
    slide: 1
    text: "Contoh: A = [2 1; 1 1], B = [5; 3] ⇒ A⁻¹ = [1 −1; −1 2] ⇒ X = [2; 1]."
  - type: math
    slide: 1
    name: AX = B
    expression: X = A⁻¹B
    highlight: true
  - type: math
    slide: 1
    name: XA = B
    expression: X = BA⁻¹
  - type: tip
    slide: 1
    text: "Cek: A · A⁻¹ harus menghasilkan matriks identitas."
