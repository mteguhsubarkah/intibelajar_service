title: Permutasi dan kombinasi
estimatedMinutes: 5
aliases: []
concepts:
  - MAT.CP25.F.PELUANG.PERMUTASI_DAN_KOMBINASI
blocks:
  - type: heading
    slide: 0
    text: Urutan penting atau tidak?
  - type: text
    slide: 0
    text: "**Permutasi** dipakai bila urutan penting (ketua, sekretaris, bendahara): **P(n, r) = n!/(n − r)!**."
  - type: text
    slide: 0
    text: "**Kombinasi** dipakai bila urutan tidak penting (memilih tim): **C(n, r) = n!/(r!(n − r)!)**."
  - type: math
    slide: 0
    name: P(n, r)
    expression: n! / (n − r)!
    highlight: true
  - type: math
    slide: 0
    name: C(n, r)
    expression: n! / (r!(n − r)!)
  - type: heading
    slide: 1
    text: Aturan perkalian
  - type: text
    slide: 1
    text: Jika langkah pertama punya m cara dan langkah kedua n cara, totalnya **m × n** cara.
  - type: text
    slide: 1
    text: "Contoh: bilangan ganjil 3 angka berbeda dari 1–5: angka satuan 3 pilihan (1, 3, 5), lalu 4 dan 3 pilihan ⇒ 36."
  - type: math
    slide: 1
    name: m langkah
    expression: kalikan banyak cara
    highlight: true
  - type: tip
    slide: 1
    text: Isi dulu posisi yang punya syarat (misalnya angka satuan ganjil).
