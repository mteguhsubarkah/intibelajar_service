blocks:
  - type: heading
    slide: 0
    text: Pythagoras untuk vektor
  - type: text
    slide: 0
    text: "Panjang (besar) vektor a = (x, y) adalah **|a| = √(x² + y²)**. Di ruang: **|a| = √(x² + y² + z²)**."
  - type: text
    slide: 0
    text: "Contoh: |(3, −4)| = √(9 + 16) = 5."
  - type: math
    slide: 0
    name: "|a|"
    expression: √(x² + y² + z²)
    highlight: true
  - type: heading
    slide: 1
    text: Jarak dua titik
  - type: text
    slide: 1
    text: "Jarak A ke B sama dengan panjang vektor AB. Contoh: A(1, 2), B(7, 10) ⇒ AB = (6, 8) ⇒ |AB| = 10."
  - type: math
    slide: 1
    name: "|AB|"
    expression: √((x₂ − x₁)² + (y₂ − y₁)²)
    highlight: true
  - type: tip
    slide: 1
    text: Komponen negatif tetap dikuadratkan menjadi positif.
