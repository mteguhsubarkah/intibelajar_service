blocks:
  - type: heading
    slide: 0
    text: Biokatalis
  - type: text
    slide: 0
    text: "**Enzim** adalah protein yang mempercepat reaksi metabolisme tanpa ikut bereaksi. Enzim bekerja **spesifik**: satu enzim untuk substrat tertentu (model gembok–kunci)."
  - type: text
    slide: 0
    text: "Contoh: amilase menguraikan amilum, tetapi tidak menguraikan protein."
  - type: math
    slide: 0
    name: enzim
    expression: protein, spesifik
    highlight: true
  - type: heading
    slide: 1
    text: Faktor yang memengaruhi
  - type: text
    slide: 1
    text: Suhu, pH, konsentrasi substrat, dan inhibitor. Suhu terlalu tinggi menyebabkan **denaturasi** (struktur protein rusak), sehingga enzim tidak berfungsi lagi.
  - type: math
    slide: 1
    name: suhu tinggi
    expression: denaturasi
    highlight: true
  - type: tip
    slide: 1
    text: Setiap enzim punya suhu dan pH optimum.
