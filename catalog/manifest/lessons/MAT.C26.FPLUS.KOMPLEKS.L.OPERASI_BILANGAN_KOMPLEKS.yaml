blocks:
  - type: heading
    slide: 0
    text: Jumlah, selisih, dan kali
  - type: text
    slide: 0
    text: "Jumlahkan atau kurangkan bagian real dengan real, imajiner dengan imajiner: (a + bi) + (c + di) = (a + c) + (b + d)i."
  - type: text
    slide: 0
    text: "Perkalian memakai sifat distributif lalu ganti i² dengan −1: (a + bi)(c + di) = (ac − bd) + (ad + bc)i."
  - type: math
    slide: 0
    name: penjumlahan
    expression: (a + c) + (b + d)i
    highlight: true
  - type: math
    slide: 0
    name: perkalian
    expression: (ac − bd) + (ad + bc)i
  - type: heading
    slide: 1
    text: Pembagian
  - type: text
    slide: 1
    text: Untuk membagi, kalikan pembilang dan penyebut dengan **sekawan** penyebut agar penyebut menjadi bilangan real.
  - type: text
    slide: 1
    text: "Contoh: (1 + i)/(1 − i) = (1 + i)²/((1 − i)(1 + i)) = 2i/2 = i."
  - type: math
    slide: 1
    name: pembagian
    expression: (a + bi)/(c + di) × (c − di)/(c − di)
    highlight: true
  - type: tip
    slide: 1
    text: Dua bilangan kompleks sama jika bagian real dan imajinernya masing-masing sama.
