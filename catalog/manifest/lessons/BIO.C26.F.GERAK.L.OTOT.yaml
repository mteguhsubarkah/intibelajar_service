blocks:
  - type: heading
    slide: 0
    text: Jenis otot
  - type: text
    slide: 0
    text: "Ada tiga jenis otot: **otot rangka** (lurik, sadar), **otot polos** (pada organ dalam, tidak sadar), dan **otot jantung** (lurik, tidak sadar)."
  - type: text
    slide: 0
    text: "Otot rangka bekerja berpasangan secara **antagonis**: saat biseps berkontraksi lengan menekuk, saat trisep berkontraksi lengan lurus."
  - type: heading
    slide: 1
    text: Mekanisme kontraksi
  - type: text
    slide: 1
    text: Serabut otot berisi filamen **aktin** dan **miosin**. Saat kontraksi, aktin bergeser di antara miosin sehingga otot memendek (teori pergeseran filamen).
  - type: text
    slide: 1
    text: Energinya berasal dari **ATP**. Bila oksigen kurang, terbentuk asam laktat yang dapat menyebabkan rasa lelah.
  - type: tip
    slide: 1
    text: Otot hanya dapat menarik, tidak dapat mendorong; karena itu dibutuhkan pasangan antagonis.
