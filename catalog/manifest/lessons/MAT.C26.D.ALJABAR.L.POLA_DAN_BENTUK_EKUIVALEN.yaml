blocks:
  - type: heading
    slide: 0
    text: Pola dan bentuk aljabar
  - type: text
    slide: 0
    text: Pola 3, 7, 11, 15, … selalu bertambah 4, sehingga suku ke-n = 4n − 1.
  - type: text
    slide: 0
    text: "Dalam 4n − 1: **n** adalah variabel, **4** koefisien, dan **−1** konstanta."
  - type: math
    slide: 0
    name: suku ke-n pola bertambah 4
    expression: 4n − 1
    highlight: true
  - type: heading
    slide: 1
    text: Bentuk yang ekuivalen
  - type: text
    slide: 1
    text: Dua bentuk aljabar **ekuivalen** jika nilainya selalu sama untuk setiap nilai variabel.
  - type: text
    slide: 1
    text: "Contoh: 3(x + 2) = 3x + 6 (sifat distributif) dan 2x + 5x = 7x (menggabung suku sejenis)."
  - type: math
    slide: 1
    name: distributif
    expression: a(b + c) = ab + ac
    highlight: true
  - type: tip
    slide: 1
    text: Uji dengan satu angka, misalnya x = 1. Jika hasilnya berbeda, pasti tidak ekuivalen.
