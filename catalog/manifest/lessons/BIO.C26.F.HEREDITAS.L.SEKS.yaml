blocks:
  - type: heading
    slide: 0
    text: Kromosom kelamin
  - type: text
    slide: 0
    text: Pada manusia, perempuan memiliki kromosom kelamin **XX** dan laki-laki **XY**. Sel telur selalu membawa X, sedangkan sperma membawa X atau Y, sehingga peluang anak laki-laki atau perempuan 50%.
  - type: text
    slide: 0
    text: "**Pautan seks** terjadi bila gen terletak pada kromosom kelamin, terutama kromosom X."
  - type: heading
    slide: 1
    text: Buta warna dan hemofilia
  - type: text
    slide: 1
    text: "**Buta warna** dan **hemofilia** disebabkan gen resesif tertaut X. Perempuan bisa normal, **karier** (XᴺXⁿ), atau penderita (XⁿXⁿ); laki-laki hanya normal (XᴺY) atau penderita (XⁿY)."
  - type: text
    slide: 1
    text: "Karena itu penderita laki-laki lebih banyak: satu alel resesif di kromosom X sudah cukup."
  - type: math
    slide: 1
    name: perempuan karier
    expression: XᴺXⁿ
    highlight: true
  - type: tip
    slide: 1
    text: Ayah tidak menurunkan kromosom X kepada anak laki-lakinya.
