    text: Bukti pemanasan global
  - type: text
    slide: 0
    text: Pengukuran menunjukkan suhu rata-rata permukaan Bumi kini lebih dari 1°C di atas masa praindustri.
  - type: text
    slide: 0
    text: "Bukti lainnya: gletser dan es laut Arktik menyusut, permukaan laut naik, dan gelombang panas makin sering."
  - type: math
    slide: 0
    name: kenaikan suhu
    expression: "> 1°C sejak praindustri"
    highlight: true
  - type: heading
    slide: 1
    text: Penyebab
  - type: text
    slide: 1
    text: Penyebab utamanya adalah pembakaran **bahan bakar fosil** (batu bara, minyak, gas) yang melepaskan CO₂, serta **deforestasi** yang mengurangi penyerap CO₂.
  - type: text
    slide: 1
    text: Peternakan, sawah, dan sampah organik menambah metana, sedangkan pupuk menambah N₂O.
  - type: tip
    slide: 1
    text: Konsentrasi CO₂ di atmosfer kini jauh lebih tinggi daripada sebelum revolusi industri.
