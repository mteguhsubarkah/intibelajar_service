blocks:
  - type: heading
    slide: 0
    text: Pangkat = perkalian berulang
  - type: text
    slide: 0
    text: "**aⁿ** berarti a dikalikan dengan dirinya sendiri sebanyak **n faktor**. a disebut basis, n disebut pangkat."
  - type: text
    slide: 0
    text: "Contoh: 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. Bukan 2 × 5."
  - type: math
    slide: 0
    name: aⁿ
    expression: a × a × … × a (n faktor)
    highlight: true
  - type: math
    slide: 0
    name: 2⁵
    expression: "32"
  - type: heading
    slide: 1
    text: Pangkat nol dan negatif
  - type: text
    slide: 1
    text: "Untuk a ≠ 0, **a⁰ = 1**. Pangkat negatif berarti kebalikan: **a⁻ⁿ = 1/aⁿ**."
  - type: text
    slide: 1
    text: "Contoh: 2⁻³ = 1/2³ = 1/8."
  - type: math
    slide: 1
    name: a⁰
    expression: "1"
    highlight: true
  - type: math
    slide: 1
    name: a⁻ⁿ
    expression: 1/aⁿ
  - type: tip
    slide: 1
    text: "Perhatikan tanda kurung: (−2)⁴ = 16, tetapi −2⁴ = −16."
