blocks:
  - type: heading
    slide: 0
    text: Tyndall dan Brown
  - type: text
    slide: 0
    text: "**Efek Tyndall**: berkas cahaya terlihat jelas saat melewati koloid karena dihamburkan partikel koloid, misalnya sorot lampu mobil di udara berkabut."
  - type: text
    slide: 0
    text: "**Gerak Brown**: partikel koloid bergerak zig-zag karena ditumbuk partikel medium dari berbagai arah. Gerak ini membuat koloid tidak mengendap."
  - type: heading
    slide: 1
    text: Adsorpsi, koagulasi, dialisis
  - type: text
    slide: 1
    text: "**Adsorpsi**: permukaan partikel koloid menyerap ion atau zat lain, seperti norit yang menyerap racun di usus. **Koagulasi**: penggumpalan koloid, misalnya lateks yang menggumpal dengan asam format."
  - type: text
    slide: 1
    text: "**Dialisis**: pemisahan ion pengganggu dari koloid dengan selaput semipermeabel, prinsip mesin cuci darah."
  - type: tip
    slide: 1
    text: Penjernihan air dengan tawas memanfaatkan koagulasi dan adsorpsi.
