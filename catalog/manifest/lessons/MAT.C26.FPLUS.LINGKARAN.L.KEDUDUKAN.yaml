blocks:
  - type: heading
    slide: 0
    text: Kedudukan titik
  - type: text
    slide: 0
    text: Substitusi titik (p, q) ke ruas kiri (x − a)² + (y − b)², lalu bandingkan hasilnya dengan r².
  - type: text
    slide: 0
    text: "Lebih kecil dari r²: titik **di dalam**; sama dengan r²: **pada** lingkaran; lebih besar: **di luar**."
  - type: math
    slide: 0
    name: di dalam
    expression: (p − a)² + (q − b)² < r²
    highlight: true
  - type: heading
    slide: 1
    text: Kedudukan garis
  - type: text
    slide: 1
    text: Substitusi persamaan garis ke persamaan lingkaran sehingga terbentuk persamaan kuadrat satu variabel, lalu hitung diskriminannya D.
  - type: text
    slide: 1
    text: "D > 0: garis **memotong** di dua titik; D = 0: garis **menyinggung**; D < 0: garis **tidak memotong**."
  - type: math
    slide: 1
    name: menyinggung
    expression: D = 0
    highlight: true
  - type: tip
    slide: 1
    text: "Cara lain: bandingkan jarak pusat ke garis dengan jari-jari."
