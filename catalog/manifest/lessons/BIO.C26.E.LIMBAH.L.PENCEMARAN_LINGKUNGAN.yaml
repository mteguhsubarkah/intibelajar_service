blocks:
  - type: heading
    slide: 0
    text: Pencemaran dan polutan
  - type: text
    slide: 0
    text: "**Pencemaran** adalah masuknya zat, energi, atau makhluk hidup ke lingkungan sehingga kualitas lingkungan turun. Zat pencemarnya disebut **polutan**."
  - type: text
    slide: 0
    text: "Jenisnya: pencemaran **air** (limbah industri, deterjen), **tanah** (plastik, pestisida), dan **udara** (asap kendaraan, pembakaran sampah)."
  - type: heading
    slide: 1
    text: Eutrofikasi dan indikator
  - type: text
    slide: 1
    text: "Limbah pupuk dan deterjen kaya fosfat memicu **eutrofikasi**: alga tumbuh berlebihan, lalu mati dan diuraikan bakteri, sehingga oksigen terlarut habis dan ikan mati."
  - type: text
    slide: 1
    text: Kualitas air dapat dinilai dari kadar oksigen terlarut (DO), BOD, dan keberadaan hewan indikator seperti larva capung.
  - type: math
    slide: 1
    name: BOD tinggi
    expression: banyak bahan organik → oksigen cepat habis
    highlight: true
  - type: tip
    slide: 1
    text: Lumut kerak jarang tumbuh di udara yang tercemar belerang dioksida.
