blocks:
  - type: heading
    slide: 0
    text: Dua fokus
  - type: text
    slide: 0
    text: Elips adalah himpunan titik yang **jumlah jaraknya ke dua fokus tetap**, yaitu 2a.
  - type: text
    slide: 0
    text: "Elips berpusat di (0, 0) dengan sumbu mayor mendatar: **x²/a² + y²/b² = 1**, dengan a > b. Fokusnya (±c, 0) dengan **c² = a² − b²**."
  - type: math
    slide: 0
    name: elips
    expression: x²/a² + y²/b² = 1
    highlight: true
  - type: math
    slide: 0
    name: fokus
    expression: c² = a² − b²
  - type: heading
    slide: 1
    text: Unsur-unsur elips
  - type: text
    slide: 1
    text: Panjang sumbu mayor 2a, sumbu minor 2b, dan puncaknya (±a, 0). Jika penyebut di bawah y² yang lebih besar, sumbu mayornya tegak.
  - type: text
    slide: 1
    text: "Eksentrisitas **e = c/a**, dengan 0 < e < 1: makin dekat ke 0, elips makin mendekati lingkaran."
  - type: math
    slide: 1
    name: eksentrisitas
    expression: e = c / a
    highlight: true
  - type: tip
    slide: 1
    text: Pada elips, a² adalah penyebut terbesar. Jangan tertukar dengan hiperbola, yang memakai c² = a² + b².
