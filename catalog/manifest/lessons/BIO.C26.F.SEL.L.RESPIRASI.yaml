blocks:
  - type: heading
    slide: 0
    text: Empat tahap respirasi aerob
  - type: text
    slide: 0
    text: "**Glikolisis** (sitoplasma) → **dekarboksilasi oksidatif** → **siklus Krebs** (matriks mitokondria) → **transpor elektron** (membran dalam mitokondria)."
  - type: text
    slide: 0
    text: ATP terbanyak dihasilkan pada **transpor elektron**; totalnya sekitar 36–38 ATP per glukosa.
  - type: math
    slide: 0
    name: glikolisis
    expression: sitoplasma
    highlight: true
  - type: math
    slide: 0
    name: ATP terbanyak
    expression: transpor elektron
  - type: heading
    slide: 1
    text: "Tanpa oksigen: fermentasi"
  - type: text
    slide: 1
    text: Jika oksigen kurang, sel melakukan **fermentasi**. Pada otot manusia menghasilkan **asam laktat** (pegal). Pada ragi menghasilkan **alkohol** dan CO₂.
  - type: math
    slide: 1
    name: otot kekurangan O₂
    expression: asam laktat
    highlight: true
  - type: tip
    slide: 1
    text: Fermentasi hanya menghasilkan 2 ATP dari glikolisis.
