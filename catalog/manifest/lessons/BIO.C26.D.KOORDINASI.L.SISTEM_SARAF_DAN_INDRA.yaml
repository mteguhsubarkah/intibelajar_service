blocks:
  - type: heading
    slide: 0
    text: Sistem saraf
  - type: text
    slide: 0
    text: Sel saraf (neuron) menghantarkan impuls. Sistem saraf pusat terdiri dari otak dan sumsum tulang belakang.
  - type: text
    slide: 0
    text: Gerak sadar dikendalikan otak. Gerak refleks lebih cepat karena impulsnya tidak diolah otak terlebih dahulu, misalnya menarik tangan dari benda panas.
  - type: math
    slide: 0
    name: gerak refleks
    expression: tidak melalui otak lebih dahulu
    highlight: true
  - type: heading
    slide: 1
    text: Alat indra
  - type: text
    slide: 1
    text: Mata (cahaya), telinga (bunyi dan keseimbangan), hidung (bau), lidah (rasa), dan kulit (sentuhan, suhu, nyeri).
  - type: text
    slide: 1
    text: Rangsang diterima reseptor, lalu impulsnya diteruskan ke sistem saraf pusat.
  - type: math
    slide: 1
    name: indra keseimbangan
    expression: telinga bagian dalam
    highlight: true
  - type: tip
    slide: 1
    text: "Jalur refleks: reseptor → saraf sensorik → sumsum tulang belakang → saraf motorik → otot."
