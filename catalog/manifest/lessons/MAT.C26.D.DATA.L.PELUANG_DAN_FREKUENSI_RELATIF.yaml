    text: Peluang teoretis
  - type: text
    slide: 0
    text: "Jika setiap hasil sama mungkin terjadi, peluang kejadian A = banyak hasil yang diharapkan : banyak semua hasil yang mungkin."
  - type: text
    slide: 0
    text: Pada sebuah dadu, P(bilangan genap) = 3/6 = 1/2.
  - type: math
