    text: Frekuensi relatif
  - type: text
    slide: 1
    text: "Frekuensi relatif = banyak kejadian muncul : banyak percobaan."
  - type: text
    slide: 1
    text: Makin banyak percobaan dilakukan, frekuensi relatif makin mendekati peluang teoretisnya.
  - type: math
    slide: 1
    name: frekuensi relatif
    expression: banyak kejadian / banyak percobaan
    highlight: true
  - type: tip
    slide: 1
    text: Peluang selalu bernilai dari 0 (mustahil) sampai 1 (pasti).
