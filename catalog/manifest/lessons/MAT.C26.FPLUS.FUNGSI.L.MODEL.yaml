blocks:
  - type: heading
    slide: 0
    text: Ciri tiap model
  - type: text
    slide: 0
    text: "**Linear**: selisih nilai y tetap untuk langkah x yang sama. **Kuadrat**: selisih keduanya tetap. **Eksponensial**: rasio nilai y berurutan tetap."
  - type: text
    slide: 0
    text: "**Trigonometri**: nilai naik-turun berulang dengan periode tertentu. **Rasional**: mendekati suatu nilai tetapi tidak pernah mencapainya."
  - type: math
    slide: 0
    name: linear
    expression: selisih tetap
    highlight: true
  - type: math
    slide: 0
    name: eksponensial
    expression: rasio tetap
  - type: heading
    slide: 1
    text: Menguji model
  - type: text
    slide: 1
    text: Hitung selisih atau rasio dari tabel, pilih model, lalu tentukan parameternya dari dua atau tiga titik.
  - type: text
    slide: 1
    text: Periksa model dengan titik lain dan pertimbangkan batas wajarnya. Jumlah bakteri, misalnya, tidak bisa tumbuh eksponensial selamanya.
  - type: tip
    slide: 1
    text: Model yang cocok dengan data belum tentu cocok untuk meramal jauh di luar rentang data.
