blocks:
  - type: heading
    slide: 0
    text: Fungsi di dalam fungsi
  - type: text
    slide: 0
    text: "Untuk y = f(g(x)), turunannya **y′ = f′(g(x)) · g′(x)**: turunkan fungsi luar dengan bagian dalam tetap, lalu kalikan turunan bagian dalam."
  - type: text
    slide: 0
    text: "Contoh: y = (3x + 1)⁴ memberi y′ = 4(3x + 1)³ · 3 = 12(3x + 1)³."
  - type: math
    slide: 0
    name: aturan rantai
    expression: y′ = f′(g(x)) · g′(x)
    highlight: true
  - type: heading
    slide: 1
    text: Bentuk akar dan pangkat
  - type: text
    slide: 1
    text: Tulis akar sebagai pangkat pecahan. y = √(x² + 5) = (x² + 5)^(1/2), sehingga y′ = ½(x² + 5)^(−1/2) · 2x = x/√(x² + 5).
  - type: text
    slide: 1
    text: Untuk y = [u(x)]ⁿ berlaku y′ = n[u(x)]ⁿ⁻¹ · u′(x).
  - type: math
    slide: 1
    name: pangkat fungsi
    expression: (uⁿ)′ = n uⁿ⁻¹ u′
    highlight: true
  - type: tip
    slide: 1
    text: Kesalahan yang sering terjadi adalah lupa mengalikan dengan turunan bagian dalam.
