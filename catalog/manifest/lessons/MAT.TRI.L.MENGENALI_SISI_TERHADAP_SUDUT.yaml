blocks:
  - type: text
    slide: 0
    text: Semuanya bergantung pada sudut acuan — sudut tempat kita berdiri dan melihat. Ganti sudut acuannya, sisi depan dan sampingnya ikut bertukar.
  - type: text
    slide: 0
    text: "Sisi depan adalah sisi yang berhadapan dengan sudut acuan: dia tidak menyentuh sudut itu sama sekali."
  - type: text
    slide: 0
    text: Sisi samping adalah sisi yang menyentuh sudut acuan, tapi bukan sisi miring. Sisi miring selalu yang terpanjang, dan selalu berada di depan sudut siku-siku.
  - type: text
    slide: 0
    text: Karena itu arah gambar tidak menentukan apa-apa. Kalau segitiganya diputar, sisi depan tetap sisi depan selama sudut acuannya tidak berubah.
