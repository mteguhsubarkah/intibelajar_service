    text: Isolasi reproduksi
  - type: text
    slide: 0
    text: Spesies baru terbentuk jika satu populasi terpisah lalu tidak lagi dapat saling kawin dan menghasilkan keturunan fertil.
  - type: text
    slide: 0
    text: Isolasi **geografis** (sungai, gunung, laut) memisahkan populasi; lama-kelamaan perbedaan genetiknya bertambah karena mutasi dan seleksi yang berbeda.
  - type: math
    slide: 0
    name: spesiasi alopatrik
    expression: didahului isolasi geografis
    highlight: true
  - type: heading
    slide: 1
    text: Mekanisme isolasi dan keanekaragaman
  - type: text
    slide: 1
    text: Isolasi reproduksi bisa berupa perbedaan waktu kawin, tingkah laku kawin, bentuk alat kelamin, atau keturunan hibrida yang mandul, seperti bagal dari kuda dan keledai.
  - type: text
    slide: 1
    text: Contoh terkenal adalah burung finch di Kepulauan Galapagos dengan bentuk paruh yang berbeda di tiap pulau.
  - type: math
    slide: 1
    name: bagal
    expression: hibrida mandul
    highlight: true
  - type: tip
    slide: 1
    text: Dua populasi dianggap spesies berbeda jika tidak dapat menghasilkan keturunan yang fertil.
