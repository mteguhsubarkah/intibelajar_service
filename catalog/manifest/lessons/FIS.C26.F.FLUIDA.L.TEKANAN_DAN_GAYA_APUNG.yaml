blocks:
  - type: heading
    slide: 0
    text: Tekanan hidrostatis
  - type: text
    slide: 0
    text: "Tekanan zat cair bertambah dengan kedalaman: **Pₕ = ρ · g · h**."
  - type: text
    slide: 0
    text: "Contoh: kedalaman 5 m di air (ρ = 1.000 kg/m³) ⇒ Pₕ = 50.000 Pa."
  - type: math
    slide: 0
    name: Pₕ
    expression: ρ · g · h
    highlight: true
  - type: heading
    slide: 1
    text: Hukum Archimedes
  - type: text
    slide: 1
    text: "Benda yang tercelup mendapat gaya ke atas sebesar berat zat cair yang dipindahkan: **Fₐ = ρ_f · g · V_tercelup**."
  - type: text
    slide: 1
    text: "Benda terapung: berat = Fₐ, sehingga ρ_benda · V = ρ_f · V_tercelup."
  - type: math
    slide: 1
    name: Fₐ
    expression: ρ_f · g · V_tercelup
    highlight: true
  - type: math
    slide: 1
    name: terapung
    expression: ρ_b / ρ_f = V_tercelup / V
  - type: tip
    slide: 1
    text: Yang dipakai adalah volume yang tercelup, bukan volume seluruh benda.
