blocks:
  - type: heading
    slide: 0
    text: Mutagen
  - type: text
    slide: 0
    text: "Mutasi dapat terjadi secara spontan atau dipicu **mutagen**: fisik (sinar UV, sinar X, radiasi radioaktif), kimia (zat dalam asap rokok, pestisida tertentu), dan biologi (beberapa virus)."
  - type: text
    slide: 0
    text: Paparan sinar UV berlebihan dapat merusak DNA sel kulit dan meningkatkan risiko kanker kulit.
  - type: heading
    slide: 1
    text: Merugikan dan menguntungkan
  - type: text
    slide: 1
    text: Sebagian besar mutasi netral atau merugikan, misalnya kanker dan penyakit genetik.
  - type: text
    slide: 1
    text: Namun mutasi juga menjadi sumber **variasi** bagi evolusi dan dimanfaatkan dalam pemuliaan, misalnya varietas tanaman unggul hasil iradiasi.
  - type: tip
    slide: 1
    text: Tabir surya mengurangi paparan UV yang dapat menyebabkan mutasi pada sel kulit.
