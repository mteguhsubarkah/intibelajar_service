    text: Hubungan dengan dua titik
  - type: text
    slide: 1
    text: AB = OB − OA = b − a. Jadi pengurangan vektor posisi memberi vektor antara dua titik.
  - type: text
    slide: 1
    text: "Contoh: A(2, 3), B(6, 1) ⇒ BA = a − b = (−4, 2)."
