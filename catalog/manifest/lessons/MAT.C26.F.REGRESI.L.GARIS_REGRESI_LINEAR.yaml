blocks:
  - type: heading
    slide: 0
    text: Garis kecocokan terbaik
  - type: text
    slide: 0
    text: Garis regresi **ŷ = a + bx** adalah garis yang paling dekat dengan titik-titik data (metode kuadrat terkecil).
  - type: text
    slide: 0
    text: "b adalah gradien: perubahan rata-rata y untuk setiap kenaikan x sebesar 1 satuan. a adalah nilai ŷ saat x = 0."
  - type: math
    slide: 0
    name: garis regresi
    expression: ŷ = a + bx
    highlight: true
  - type: math
    slide: 0
    name: gradien b
    expression: perubahan ŷ per satuan x
  - type: heading
    slide: 1
    text: Garis melewati titik rata-rata
  - type: text
    slide: 1
    text: Garis regresi selalu melewati titik (x̄, ȳ). Jadi jika b diketahui, a = ȳ − b · x̄.
  - type: text
    slide: 1
    text: "Contoh: x̄ = 4, ȳ = 20, dan b = 3, maka a = 20 − 12 = 8 dan ŷ = 8 + 3x."
  - type: math
    slide: 1
    name: titik rata-rata
    expression: (x̄, ȳ)
    highlight: true
  - type: math
    slide: 1
    name: a
    expression: ȳ − b · x̄
  - type: tip
    slide: 1
    text: Makna gradien ditulis dengan satuannya, misalnya "setiap tambahan 1 jam belajar, nilai naik rata-rata 3 poin".
