code: MAT.C26.FPLUS.FUNGSI.L.FUNGSI_RASIONAL_DAN_ASIMTOT
title: Fungsi rasional dan asimtot
estimatedMinutes: 5
aliases: []
concepts:
  - MAT.C26.FPLUS.FUNGSI.FUNGSI_RASIONAL_DAN_ASIMTOT
blocks:
  - type: heading
    slide: 0
    text: Fungsi rasional
  - type: text
    slide: 0
    text: "**Fungsi rasional** adalah hasil bagi dua polinomial, f(x) = P(x)/Q(x), dengan Q(x) ≠ 0. Contoh: f(x) = (2x + 1)/(x − 3)."
  - type: text
    slide: 0
    text: Daerah asal tidak memuat nilai x yang membuat penyebut nol.
  - type: math
    slide: 0
    name: fungsi rasional
    expression: f(x) = P(x)/Q(x)
    highlight: true
  - type: heading
    slide: 1
    text: Asimtot
  - type: text
    slide: 1
    text: "**Asimtot tegak** x = a muncul jika penyebut nol di a tetapi pembilang tidak. **Asimtot datar**: jika derajat pembilang sama dengan derajat penyebut, y = perbandingan koefisien utama."
  - type: text
    slide: 1
    text: "Jika derajat pembilang lebih kecil, asimtot datarnya y = 0. Contoh f(x) = (2x + 1)/(x − 3): asimtot x = 3 dan y = 2."
  - type: math
    slide: 1
    name: asimtot datar (derajat sama)
    expression: y = aₙ/bₙ
    highlight: true
  - type: tip
    slide: 1
    text: Grafik tidak pernah menyentuh asimtot tegak, tetapi boleh memotong asimtot datar.
