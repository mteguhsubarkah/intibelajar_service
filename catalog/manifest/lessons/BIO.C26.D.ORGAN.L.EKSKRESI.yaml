    text: "**Ginjal** menyaring darah dan menghasilkan urine. **Kulit** mengeluarkan keringat. **Paru-paru** mengeluarkan karbon dioksida dan uap air. **Hati** menghasilkan empedu dan menguraikan zat beracun."
