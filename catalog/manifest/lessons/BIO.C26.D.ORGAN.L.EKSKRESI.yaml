  - type: text
    slide: 1
    text: "Ginjal mengatur jumlah air dalam tubuh: saat kurang minum urine pekat dan sedikit; saat banyak minum urine encer."
  - type: text
    slide: 1
    text: "Gangguan: batu ginjal dan gagal ginjal. Minum air yang cukup dan batasi garam berlebih."
