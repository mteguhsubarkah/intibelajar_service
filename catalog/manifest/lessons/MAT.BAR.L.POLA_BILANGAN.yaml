blocks:
  - type: heading
    slide: 0
    text: Mencari aturan
  - type: text
    slide: 0
    text: "Pola bilangan punya **aturan tetap** antarsuku. Lihat selisihnya: 2, 5, 8, 11 (selalu +3). Bila selisihnya berubah, lihat selisih tingkat dua."
  - type: text
    slide: 0
    text: "Contoh: 3, 7, 13, 21 memiliki selisih 4, 6, 8, naik 2 setiap langkah."
  - type: math
    slide: 0
    name: selisih tetap
    expression: pola aritmetika
    highlight: true
  - type: heading
    slide: 1
    text: Pola bangun
  - type: text
    slide: 1
    text: "Pola persegi: **n²** (1, 4, 9, 16). Pola segitiga: **n(n + 1)/2** (1, 3, 6, 10). Pola persegi panjang: **n(n + 1)** (2, 6, 12, 20)."
  - type: math
    slide: 1
    name: segitiga
    expression: n(n + 1)/2
    highlight: true
  - type: math
    slide: 1
    name: persegi
    expression: n²
  - type: tip
    slide: 1
    text: Uji rumus pada n = 1 dan n = 2 sebelum dipakai untuk n besar.
