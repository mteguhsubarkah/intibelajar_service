  - type: text
    slide: 0
    text: "Banyak masalah nyata berbentuk kuadrat: tinggi benda yang dilempar, luas dengan keliling tetap, keuntungan dari harga jual."
  - type: text
    slide: 0
    text: "Langkah: tulis besaran yang dicari sebagai fungsi satu variabel, lalu cari puncaknya."
  - type: math
    slide: 0
