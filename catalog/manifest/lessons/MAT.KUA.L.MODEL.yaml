  - type: heading
    slide: 1
    text: Contoh luas maksimum
  - type: text
    slide: 1
    text: Keliling persegi panjang 40 cm ⇒ p + l = 20 ⇒ L = p(20 − p) = −p² + 20p.
  - type: text
    slide: 1
    text: Puncak di p = 10, jadi L maksimum = 100 cm² (persegi).
  - type: math
    slide: 1
    name: L(p)
    expression: −p² + 20p
    highlight: true
  - type: math
    slide: 1
