blocks:
  - type: heading
    slide: 0
    text: Lensa
  - type: text
    slide: 0
    text: "Persamaan lensa: **1/f = 1/s + 1/s′**. Lensa cembung f positif. s′ positif berarti bayangan nyata di belakang lensa."
  - type: text
    slide: 0
    text: "Contoh: s = 30 cm, f = 20 cm ⇒ s′ = 60 cm."
  - type: math
    slide: 0
    name: 1/f
    expression: 1/s + 1/s′
    highlight: true
  - type: math
    slide: 0
    name: perbesaran
    expression: M = s′ / s
  - type: tip
    slide: 0
    text: Pakai satuan yang sama (cm) untuk s, s′, dan f.
  - type: heading
    slide: 1
    text: Alat optik
  - type: text
    slide: 1
    text: "**Mata**: titik dekat normal 25 cm. Penderita rabun dekat dibantu lensa cembung berkekuatan P = 100/25 − 100/PP dioptri (PP titik dekatnya dalam cm)."
  - type: text
    slide: 1
    text: "**Lup**: perbesaran tanpa akomodasi M = 25/f. **Mikroskop**: perbesaran total M = M objektif × M okuler."
  - type: math
    slide: 1
    name: kacamata rabun dekat
    expression: P = 100/25 − 100/PP
    highlight: true
  - type: math
    slide: 1
    name: lup
    expression: M = 25 / f
  - type: tip
    slide: 1
    text: "Kekuatan lensa dalam dioptri: P = 1/f dengan f dalam meter."
