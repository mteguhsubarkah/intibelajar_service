  - type: text
    slide: 1
    text: Jika semua ukuran panjang dikali k, luasnya menjadi k² kali dan volumenya k³ kali.
  - type: text
    slide: 1
    text: Kubus bersisi 2 cm bervolume 8 cm³; kubus bersisi 4 cm bervolume 64 cm³, yaitu 8 kali lebih besar.
