    text: Vektor posisi titik A adalah **a = OA**, dari titik asal O ke A. Komponennya sama dengan koordinat A.
  - type: text
    slide: 0
    text: "Di ruang tiga dimensi: A(x, y, z) ⇒ a = xi + yj + zk."
