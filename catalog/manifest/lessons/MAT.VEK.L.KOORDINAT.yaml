    expression: (x, y, z)
    highlight: true
  - type: heading
    slide: 1
    text: Vektor antara dua titik di ruang
  - type: text
    slide: 1
    text: "Sama seperti di bidang: **PQ = q − p**. Contoh: P(2, −1, 3), Q(5, 3, 1) ⇒ PQ = (3, 4, −2)."
  - type: math
    slide: 1
    name: PQ
    expression: q − p
    highlight: true
  - type: tip
    slide: 1
    text: "Kurangkan komponen yang sejenis: x dengan x, y dengan y, z dengan z."
