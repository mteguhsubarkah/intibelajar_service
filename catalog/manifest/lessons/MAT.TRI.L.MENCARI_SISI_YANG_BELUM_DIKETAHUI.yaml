    text: "Rasio sudah benar, tapi angkanya belum ketemu. Di sinilah langkah yang paling sering keliru: tan θ = depan / samping itu sebuah **persamaan**, bukan perintah mengali. Sisi yang kamu cari sering berada di penyebut, dan memindahkannya bukan perkalian."
  - type: text
    slide: 0
    text: "Contohnya tan 30° = 20 / x. Karena x ada di bawah, kalikan silang dulu: x · tan 30° = 20. Baru setelah itu x = 20 ÷ tan 30° ≈ 34,6. Kuncinya satu: kalau sisi yang dicari berada di penyebut, langkah terakhirnya selalu membagi."
