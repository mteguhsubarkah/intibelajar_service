schemaVersion: 1
code: MAT.C26.FPLUS.TURUNAN.L.STASIONER
title: Titik stasioner dan kemonotonan
estimatedMinutes: 5
aliases: []
concepts:
  - MAT.C26.FPLUS.TURUNAN.TITIK_STASIONER_DAN_KEMONOTONAN
blocks:
  - type: heading
    slide: 0
    text: Naik, turun, stasioner
  - type: text
    slide: 0
    text: Fungsi **naik** jika f′(x) > 0 dan **turun** jika f′(x) < 0. Titik dengan f′(x) = 0 disebut **titik stasioner**.
  - type: text
    slide: 0
    text: "Jenisnya dilihat dari tanda f′ di sekitar titik: + ke − berarti maksimum; − ke + berarti minimum; tanda tetap berarti titik belok."
  - type: math
    slide: 0
    name: stasioner
    expression: f′(x) = 0
    highlight: true
  - type: heading
    slide: 1
    text: Uji turunan kedua
  - type: text
    slide: 1
    text: Jika f′(a) = 0 dan f″(a) < 0, maka f(a) adalah nilai **maksimum** lokal. Jika f″(a) > 0, nilai **minimum** lokal.
  - type: text
    slide: 1
    text: "Contoh: f(x) = x³ − 3x memiliki f′ = 3x² − 3 = 0 di x = ±1; f″(1) = 6 > 0 (minimum) dan f″(−1) = −6 < 0 (maksimum)."
  - type: math
    slide: 1
    name: maksimum
    expression: f″(a) < 0
    highlight: true
  - type: math
    slide: 1
    name: minimum
    expression: f″(a) > 0
  - type: tip
    slide: 1
    text: Untuk nilai ekstrem pada interval tertutup, bandingkan juga nilai di ujung-ujung interval.
