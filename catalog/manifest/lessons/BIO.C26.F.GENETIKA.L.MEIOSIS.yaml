    text: Meiosis menghasilkan **4 sel anak haploid (n)** dan terjadi pada pembentukan gamet. Terjadi **pindah silang** yang menambah variasi.
  - type: text
    slide: 1
    text: Sel tubuh manusia 46 kromosom (2n) ⇒ sperma dan ovum 23 kromosom (n).
