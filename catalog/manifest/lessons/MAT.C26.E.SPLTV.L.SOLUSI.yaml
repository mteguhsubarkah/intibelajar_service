    text: Memeriksa solusi
  - type: text
    slide: 0
    text: Solusi SPLTV adalah tripel terurut (x, y, z) yang memenuhi **ketiga** persamaan sekaligus.
  - type: text
    slide: 0
    text: Selalu substitusikan kembali ke ketiga persamaan awal. Satu persamaan yang tidak terpenuhi berarti ada salah hitung.
  - type: math
    slide: 0
    name: himpunan solusi
    expression: "{(x, y, z)}"
    highlight: true
  - type: heading
    slide: 1
    text: Banyaknya solusi dan maknanya
  - type: text
    slide: 1
    text: SPLTV bisa punya satu solusi, tak hingga banyak solusi (ada persamaan yang merupakan gabungan persamaan lain), atau tidak punya solusi (persamaannya saling bertentangan).
  - type: text
    slide: 1
    text: "Dalam konteks, periksa kewajarannya: harga, banyak barang, atau umur tidak boleh negatif, dan banyak barang harus bilangan bulat."
