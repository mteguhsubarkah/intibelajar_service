blocks:
  - type: heading
    slide: 0
    text: Organik dan anorganik
  - type: text
    slide: 0
    text: Berdasarkan sifatnya, limbah dibagi menjadi **organik** (mudah terurai, seperti sisa makanan dan daun) dan **anorganik** (sulit terurai, seperti plastik, kaca, dan logam).
  - type: text
    slide: 0
    text: Berdasarkan wujudnya, ada limbah padat, cair, dan gas.
  - type: heading
    slide: 1
    text: Limbah B3
  - type: text
    slide: 1
    text: "**Limbah B3** (bahan berbahaya dan beracun) bersifat mudah meledak, mudah terbakar, beracun, korosif, atau infeksius. Contohnya baterai bekas, oli bekas, lampu neon, dan limbah medis."
  - type: text
    slide: 1
    text: Limbah B3 tidak boleh dicampur dengan sampah biasa dan harus diserahkan ke pengelola khusus.
  - type: tip
    slide: 1
    text: Plastik dapat bertahan ratusan tahun dan pecah menjadi mikroplastik.
