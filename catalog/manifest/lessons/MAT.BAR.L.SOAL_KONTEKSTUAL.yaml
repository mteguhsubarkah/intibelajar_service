    slide: 1
    text: "Tali dipotong 5 bagian membentuk barisan geometri, terpendek 4 cm dan terpanjang 64 cm: r⁴ = 16 ⇒ r = 2. Panjang tali = 4 + 8 + 16 + 32 + 64 = 124 cm."
