    text: Metode eliminasi
  - type: text
    slide: 0
    text: Samakan koefisien salah satu variabel, lalu jumlahkan atau kurangkan kedua persamaan.
  - type: text
    slide: 0
    text: "x + y = 10 dan x − y = 2. Jumlahkan: 2x = 12, jadi x = 6, lalu y = 10 − 6 = 4."
  - type: math
    slide: 0
    name: eliminasi
    expression: samakan koefisien, lalu jumlah/kurang
    highlight: true
  - type: heading
    slide: 1
    text: Metode substitusi
  - type: text
    slide: 1
    text: Ubah satu persamaan menjadi y = …, lalu masukkan ke persamaan lain.
  - type: text
    slide: 1
    text: y = 10 − x, maka x − (10 − x) = 2 → 2x = 12 → x = 6.
  - type: math
    slide: 1
    name: substitusi
    expression: y = …, masukkan ke persamaan lain
    highlight: true
  - type: tip
    slide: 1
    text: Gabungan keduanya (eliminasi dulu, lalu substitusi) biasanya paling cepat.
