  - type: text
    slide: 1
    text: "Jarak peta × penyebut skala masih dalam cm. Kalau yang ditanya km, ubah dulu: 1 km = 100.000 cm."
  - type: text
    slide: 1
    text: "Contoh: 4 cm × 500.000 = 2.000.000 cm = 20 km."
