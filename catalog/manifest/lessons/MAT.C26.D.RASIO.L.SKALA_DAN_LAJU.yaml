    text: "**Skala** adalah perbandingan jarak pada peta dengan jarak sebenarnya, dalam satuan yang sama."
  - type: text
    slide: 0
    text: "Skala 1 : 200.000 artinya 1 cm pada peta sama dengan 200.000 cm di dunia nyata."
  - type: math
    slide: 0
    name: jarak sebenarnya
