blocks:
  - type: heading
    slide: 0
    text: Muatan listrik
  - type: text
    slide: 0
    text: "Ada dua jenis muatan: positif dan negatif. Muatan sejenis **tolak-menolak**, muatan berlawanan jenis **tarik-menarik**."
  - type: text
    slide: 0
    text: Satuan muatan adalah coulomb (C). Muatan sebuah elektron −1,6 × 10⁻¹⁹ C.
  - type: math
    slide: 0
    name: muatan elektron
    expression: −1,6 × 10⁻¹⁹ C
    highlight: true
  - type: heading
    slide: 1
    text: Hukum Coulomb
  - type: text
    slide: 1
    text: "Besar gaya antara dua muatan titik: **F = k · q₁q₂ / r²**, dengan k = 9 × 10⁹ N·m²/C²."
  - type: text
    slide: 1
    text: "Gaya sebanding dengan hasil kali muatan dan berbanding terbalik dengan **kuadrat** jarak: jarak dua kali lipat, gaya menjadi ¼."
  - type: math
    slide: 1
    name: hukum Coulomb
    expression: F = k q₁q₂ / r²
    highlight: true
  - type: math
    slide: 1
    name: k
    expression: 9 × 10⁹ N·m²/C²
  - type: tip
    slide: 1
    text: Ubah µC ke C (× 10⁻⁶) dan cm ke m sebelum menghitung.
