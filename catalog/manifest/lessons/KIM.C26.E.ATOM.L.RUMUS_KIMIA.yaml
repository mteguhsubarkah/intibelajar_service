    text: Rumus senyawa ion
  - type: text
    slide: 0
    text: Jumlah muatan positif dan negatif harus **nol**. Silangkan angka muatan sebagai indeks.
  - type: text
    slide: 0
    text: "Contoh: Al³⁺ dan O²⁻ ⇒ Al₂O₃ (2 × 3 = 6 dan 3 × 2 = 6)."
  - type: math
    slide: 0
    name: Al³⁺ + O²⁻
    expression: Al₂O₃
    highlight: true
  - type: heading
    slide: 1
    text: Rumus molekul dan rumus empiris
  - type: text
    slide: 1
    text: "**Rumus molekul** menyatakan jumlah atom sebenarnya. **Rumus empiris** adalah perbandingan paling sederhana."
  - type: text
    slide: 1
    text: "Contoh: glukosa C₆H₁₂O₆ memiliki rumus empiris CH₂O."
  - type: math
    slide: 1
    name: C₆H₁₂O₆
    expression: empiris CH₂O
    highlight: true
  - type: tip
    slide: 1
    text: Bagi semua indeks dengan FPB-nya untuk mendapat rumus empiris.
