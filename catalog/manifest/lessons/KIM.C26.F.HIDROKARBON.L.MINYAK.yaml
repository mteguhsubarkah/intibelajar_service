blocks:
  - type: heading
    slide: 0
    text: Fraksi minyak bumi
  - type: text
    slide: 0
    text: Minyak bumi adalah campuran hidrokarbon yang dipisahkan dengan **distilasi bertingkat** berdasarkan perbedaan titik didih.
  - type: text
    slide: 0
    text: Fraksi bertitik didih rendah (gas, bensin) keluar di bagian atas menara, sedangkan fraksi bertitik didih tinggi (solar, oli, aspal) di bagian bawah.
  - type: heading
    slide: 1
    text: Bilangan oktan dan pembakaran
  - type: text
    slide: 1
    text: "**Bilangan oktan** menunjukkan ketahanan bensin terhadap ketukan (knocking). Isooktana diberi nilai 100 dan n-heptana 0."
  - type: text
    slide: 1
    text: Pembakaran sempurna menghasilkan CO₂ dan H₂O. Pembakaran tidak sempurna menghasilkan CO yang beracun dan jelaga.
  - type: math
    slide: 1
    name: pembakaran sempurna
    expression: CₓHᵧ + O₂ → CO₂ + H₂O
    highlight: true
  - type: tip
    slide: 1
    text: Bensin beroktan 92 setara campuran 92% isooktana dan 8% n-heptana.
