blocks:
  - type: heading
    slide: 0
    text: Tiga sifat utama
  - type: text
    slide: 0
    text: "Kalikan basis sama: **jumlahkan** pangkat. Bagi basis sama: **kurangkan** pangkat. Pangkat dari pangkat: **kalikan** pangkat."
  - type: math
    slide: 0
    name: aᵐ · aⁿ
    expression: aᵐ⁺ⁿ
    highlight: true
  - type: math
    slide: 0
    name: "aᵐ : aⁿ"
    expression: aᵐ⁻ⁿ
  - type: math
    slide: 0
    name: (aᵐ)ⁿ
    expression: aᵐⁿ
  - type: heading
    slide: 1
    text: Pangkat dari perkalian dan pembagian
  - type: text
    slide: 1
    text: "Pangkat dibagikan ke setiap faktor: **(ab)ⁿ = aⁿbⁿ** dan **(a/b)ⁿ = aⁿ/bⁿ**."
  - type: text
    slide: 1
    text: "Contoh: (2³ · 2⁵) / 2⁴ = 2⁸ / 2⁴ = 2⁴ = 16."
  - type: math
    slide: 1
    name: (ab)ⁿ
    expression: aⁿbⁿ
    highlight: true
  - type: math
    slide: 1
    name: (a/b)ⁿ
    expression: aⁿ/bⁿ
  - type: tip
    slide: 1
    text: Ubah dulu semua basis ke basis yang sama (4 = 2², 8 = 2³), baru pakai sifatnya.
